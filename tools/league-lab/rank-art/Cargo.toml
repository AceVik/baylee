[package]
name = "baylee-rank-art"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
publish = false

[dependencies]
base64 = "0.23"
image = { version = "0.25.10", default-features = false, features = ["png"] }
naga = { version = "30", features = ["wgsl-in", "glsl-out"] }
resvg = { version = "0.50", default-features = false, features = ["text"] }
serde_json = "1"

[lints]
workspace = true
