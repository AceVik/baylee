[project]
name = "baylee-trainer"
version = "0.1.0"
description = "Training for Baylee's own Magic AI: value, policy and deckbuilding nets over game records"
requires-python = ">=3.12,<3.14"
dependencies = [
    "torch>=2.8",
    "numpy>=2.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
