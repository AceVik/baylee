[project]
name = "baylee-trainer"
version = "0.1.0"
description = "Training for Baylee's own Magic AI: value, policy and deckbuilding nets over game records"
requires-python = ">=3.12,<3.14"
dependencies = [
    "torch>=2.15,<2.16",
    # PyTorch 2.15 dropped cuRAND; the native ONNX CUDA provider still links it.
    "cuda-toolkit[curand]==13.2.2; sys_platform == 'linux'",
    "numpy>=2.0",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "orjson>=3.11",
]

[tool.uv]
package = false

[tool.uv.sources]
# CUDA 13.2 wheels on Linux (bigace); PyPI's elsewhere, whose macOS wheels
# run on the Mac's GPU (MPS).
torch = [{ index = "pytorch-cu132", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
