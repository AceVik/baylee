# The API documents' generator (`docs/api/`), run as `cargo dev api`.
#
# A workspace of its own, outside the main one: until oas-forge 0.2 is on
# crates.io it links a sibling checkout by path, and a path that CI cannot
# see would leave the whole workspace unresolvable. Once 0.2 is published it
# becomes `oas-forge = "0.2"` and this crate can join the workspace.
[package]
name = "baylee-api-docs"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
publish = false

[workspace]

[dependencies]
oas-forge = { path = "../../../openapi-extract" }
