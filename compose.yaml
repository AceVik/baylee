# Local Postgres. The gateway does not start without it.
#
# It holds two things that are only neighbours: the gateway's accounts,
# sessions, decks and preferences (`baylee-db`, migrated in place), and the
# card catalog (`baylee-catalog`, rebuilt wholesale by an ingest). The first
# is required — a gateway with no database has no accounts. The second is
# optional: without an ingest the gateway serves no card text and the client
# draws faces from what the engine projects.
#
# The test suite needs this too. Each spawned gateway takes a schema of its
# own, so the suite never touches what an ingest has put in `public`.
#
#   docker compose up -d
#   export DATABASE_URL=postgres://baylee:baylee@127.0.0.1:5432/baylee
#   cargo run -p baylee-catalog -- ingest                  # every language
#   cargo run -p baylee-catalog -- ingest --english-only   # ~118k printings

# The project name is **pinned**, and that is what makes five worktrees one
# database. Compose otherwise derives it from the *directory*, and this
# repository is checked out five times — so `baylee-gateway/` and
# `baylee-client/` each built a container and a volume of their own and then
# collided on 5432. That is not a slower setup, it is a **different**
# database: an ingest into one is invisible in the other, and a search
# answers nothing while somebody next door is looking at a full catalog.
# Observed on 19.09.2026 as three volumes — `baylee_catalog-data` at 1.3 GB,
# `baylee-gateway_catalog-data` at 604 MB and `baylee-client_catalog-data`
# at 46.7 MB, the last of which is an initialised cluster and no catalog at
# all.
#
# A `-p baylee` on the command line fixes it for whoever remembers, which is
# the same as not fixing it. This key is read by the command itself, so
# forgetting is no longer a way to get it wrong. `COMPOSE_PROJECT_NAME` and
# `-p` still win, and that precedence is the right way round: the pin
# survives being forgotten, not being overruled on purpose.
#
# The two volumes named after a directory are orphans from before this and
# are deleted by hand or not at all — Compose will not touch a volume it no
# longer knows about, which is the safe direction for the 1.3 GB one.
name: baylee

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: baylee
      POSTGRES_PASSWORD: baylee
      POSTGRES_DB: baylee
      # The locale is stated rather than inherited, and it is `builtin`
      # rather than libc, because this image is Alpine and Alpine is musl —
      # which has no real locale support at all. A database initialised
      # without this says `en_US.utf8` and behaves like `C`: `strcoll` is
      # `strcmp`, so `'Zebra' < 'Äpfel'`, and `datcollversion` comes back
      # empty, so PostgreSQL cannot even warn when the collation underneath
      # an index changes. Nineteen languages of card text is not a place to
      # inherit that by accident.
      #
      # `builtin` + `C.UTF-8` is what the database was already doing, only
      # guaranteed: Unicode case mapping in `lower()` (which the unique
      # index on `lower(email)` stands on) with code-point ordering, no libc
      # underneath it and nothing to drift. Where a human-facing sort is
      # actually wanted it is asked for on the query — the image carries 871
      # ICU collations, so `ORDER BY name COLLATE "de-DE-x-icu"` is there
      # when a screen needs it.
      #
      # This only takes effect when the volume is created. Changing it on an
      # existing database does nothing: `docker compose down -v` first.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - catalog-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baylee -d baylee"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  catalog-data:
