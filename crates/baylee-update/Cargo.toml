[package]
name = "baylee-update"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "The desktop client's updater: which release is newer, whether its signature is ours, and replacing the installed files on exit (#326)"

[lints]
workspace = true

[dependencies]
base64.workspace = true
ed25519-dalek.workspace = true
flate2.workspace = true
getrandom.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
ureq.workspace = true
zip.workspace = true
uuid.workspace = true

# "Move old copy to Trash" (`relocate::SystemTrash`): NSFileManager's
# trashItemAtURL, through the binding the client already links.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSError", "NSFileManager", "NSString", "NSURL"] }

# The launcher's icon resource (`build.rs`): the file a Start-menu entry,
# Explorer and the taskbar show is `baylee-launch.exe`, packaged as
# `baylee-client.exe`. Gated on the *target*, so no other build fetches it.
[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true
