[package]
name = "baylee-cards"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Compiled card registry (one file per card)"

[lints]
workspace = true

[features]
# The L5 mutation switch, `BAYLEE_MUTATE` (`src/mutate.rs`,
# `docs/verification-hooks.md`). Only `baylee-engine`'s dev-dependencies
# enable it, so no binary or library build carries it;
# `cargo dev gate features` compiles it on its own and proves that.
mutate = []

[dependencies]
baylee-core.workspace = true
baylee-cards-dsl.workspace = true
# Tokens, shared filters and the door to the registry's tables.
baylee-cards-base.workspace = true
# What a format says about a card, and the words a deck check answers in.
# Serde and nothing else, so the engine never sees it through here.
baylee-cardtext.workspace = true
serde.workspace = true
uuid.workspace = true

[dev-dependencies]
# The tests look cards up, so they link the pool.
baylee-cards-pool.workspace = true
