[package]
name = "baylee-perf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "The engine's fixed workload: what it is measured by, what a profile-guided build trains on, and what holds that build to the generic one"

[lints]
workspace = true

[features]
# The standard shipping artifact trains/proves its detector-free session.
without-loop-detection = []
# Match the native shipping registry as well as its detector policy.
tower = ["without-loop-detection", "dep:engine-server", "dep:baylee-tower", "dep:baylee-tower-content"]
# `engine_perf search`, through `Engine::fork_for`. Off in every build that
# trains or proves a shipped binary: that build shares a `cargo` run with the
# binary, and `cargo dev gate shipped-features` keeps this out of a hosting
# build.
simulation = ["baylee-gamehost/simulation"]

[dependencies]
# Its programs look cards up, so they hold the pool (`baylee-cards-pool`).
baylee-cards-pool.workspace = true
anyhow.workspace = true
baylee-cards.workspace = true
baylee-core.workspace = true
baylee-engine.workspace = true
baylee-gamehost.workspace = true
# Renamed so that `baylee-engine-server/<feature>` on a command line that also
# selects this crate names the engine server alone: cargo reads it for every
# selected package with a dependency of that name, and this one carries Tower
# (crates/baylee-pgo/tests/variant_features.rs).
engine-server = { package = "baylee-engine-server", path = "../baylee-engine-server", optional = true, default-features = false, features = ["tower"] }
baylee-tower = { workspace = true, optional = true }
# The frozen starters the Tower workload seats: the content the shipping
# executor admits.
baylee-tower-content = { workspace = true, optional = true }
baylee-protocol.workspace = true
baylee-view.workspace = true
prost.workspace = true
serde.workspace = true
serde_json.workspace = true
