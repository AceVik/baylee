[package]
name = "baylee-perf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "The engine's fixed workload: what it is measured by, what a profile-guided build trains on, and what holds that build to the generic one"

[lints]
workspace = true

[features]
# `engine_perf search`, through `Engine::fork_for`. Off in every build that
# trains or proves a shipped binary: that build shares a `cargo` run with the
# binary, and `cargo dev gate shipped-features` keeps this out of a hosting
# build.
simulation = ["baylee-gamehost/simulation"]

[dependencies]
# Its programs look cards up, so they hold the pool (`baylee-cards-pool`).
baylee-cards-pool.workspace = true
anyhow.workspace = true
baylee-cards.workspace = true
baylee-core.workspace = true
baylee-engine.workspace = true
baylee-gamehost.workspace = true
baylee-protocol.workspace = true
baylee-view.workspace = true
prost.workspace = true
serde.workspace = true
serde_json.workspace = true
