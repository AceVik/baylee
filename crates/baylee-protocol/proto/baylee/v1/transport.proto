syntax = "proto3";

// baylee wire protocol v0 — transport handshake + preset transfer.
// See docs/protocol.md. Binary WebSocket frames, one Envelope per frame.
package baylee.v1;

// ---------------------------------------------------------------- handshake

// A seat socket refused for its protocol (#271): the first and only frame
// on it, sent by the gateway before the socket is closed. The client says
// which protocol it speaks in the socket's query (`&protocol=`), so there
// is no hello to answer; `protocol_version` is the gateway's, and
// `message` names both numbers.
message HelloAck {
  uint32 protocol_version = 1;
  bool compatible = 2;
  string message = 3;
}

message JoinGame {
  string game_id = 1;
  // Gateway-issued seat token: binds this connection to exactly one seat.
  string seat_token = 2;
}

message ResumeGame {
  string game_id = 1;
  string seat_token = 2;
  // Last delta sequence number the client has applied.
  uint64 last_seq = 3;
}

// Player → engine: this seat has drawn its table and can play (#256).
// Empty on purpose: the seat is the socket's own, stamped on the SeatFrame by
// the gateway, so there is nothing in it a client could claim for another
// seat. Sent once per attach; a repeat, or one after the curtain is up,
// changes nothing.
message SeatReady {}

// Engine → player: play is now allowed. The shared entrance has finished.
message Curtain {}

// An echo for estimating server time using the lowest round-trip sample.
// A request has server_time_ms = 0; the engine stamps its reply.
message ClockProbe {
  uint64 client_time_ms = 1;
  uint64 server_time_ms = 2;
}

// Readiness of human seats. A zero enter_at_ms cancels a pending entrance.
// Otherwise every client begins its portal at this server Unix timestamp.
// No game actions or decision clocks run until the entrance has finished.
message TableLoading {
  uint32 ready = 1;
  uint32 total = 2;
  uint64 enter_at_ms = 3;
}

// ------------------------------------------------------------------- preset

enum Finish {
  FINISH_UNSPECIFIED = 0;
  FINISH_NORMAL = 1;
  FINISH_FOIL = 2;
  FINISH_ETCHED = 3;
}

message PrintInfo {
  string scryfall_id = 1;
  string lang = 2;
  Finish finish = 3;
}

message DeckEntry {
  uint32 card_index = 1;
  uint32 print_ref = 2;
}

message AiProfile {
  uint32 lookahead = 1;
  uint32 temperature_milli = 2;
  uint32 mulligan_skill = 3;
  // 0 random, 1 attack-leader, 2 archenemy
  uint32 politics = 4;
  // 0 none, 1 basic, 2 threat-aware
  uint32 hold_up = 5;
}

message SeatController {
  oneof kind {
    uint64 human_user_id = 1;
    AiProfile ai = 2;
    bool open = 3;
  }
}

message ModifierSpec {
  string key = 1;
  uint64 script_hash = 2;
  map<string, string> params = 3;
}

message SeatSpec {
  SeatController controller = 1;
  repeated DeckEntry deck = 2;
  // Cards outside the game this seat may reach (wishes). Never shuffled
  // into the library.
  repeated DeckEntry sideboard = 8;
  // This seat's commanders (CR 903.3). They start in the command zone and
  // are never part of the library, so they are a list of their own rather
  // than a marker inside `deck`.
  repeated DeckEntry commanders = 9;
  optional int32 starting_life = 3;
  repeated DeckEntry starting_hand = 4;
  repeated DeckEntry starting_battlefield = 5;
  repeated string emblems = 6;
  optional uint32 team = 7;
}

message StartingCounter {
  string kind = 1;
  uint32 amount = 2;
}
message StartingCounters {
  uint32 seat = 1;
  uint32 permanent = 2;
  repeated StartingCounter counters = 3;
}
message HouseRules {
  bool mulligan_free_first = 1;
  // 0 = run-once-then-break, 1 = comp-rules-draw
  uint32 loop_policy = 2;
  uint32 decision_timeout_secs = 3;
  uint32 reconnect_window_secs = 4;
  bool timing_normalization = 5;
  bool takebacks = 6;
  bool time_extension_votes = 7;
  optional uint32 free_mulligans = 8;
  repeated StartingCounters starting_counters = 9;
}

message GamePresetMsg {
  // 0 commander, 1 highlander, 2 freeform, 3 custom
  uint32 format = 1;
  uint64 seed = 2;
  // 3 was dev_mode: a client asking to be allowed to rewrite the board.
  // Capabilities are granted by the host per seat and never travel inbound.
  reserved 3;
  reserved "dev_mode";
  HouseRules house_rules = 4;
  repeated ModifierSpec modifiers = 5;
  repeated PrintInfo prints = 6;
  repeated SeatSpec seats = 7;
}

// ----------------------------------------------------------------- envelope

message Heartbeat {
  uint64 client_time_ms = 1;
}

message Error {
  uint32 code = 1;
  string message = 2;
}

// ------------------------------------------------------------- v1 gameplay
// Complex engine structures (pending choices, actions, views) travel as
// serde_json payloads inside protobuf framing — the wire contract stays
// binary while the choice taxonomy evolves without proto churn.

message CreateGame {
  GamePresetMsg preset = 1;
}

message GameCreated {
  string game_id = 1;
  uint32 your_seat = 2;
}

// Server → client: a choice is requested from your seat.
message ChoiceRequest {
  string game_id = 1;
  uint64 seq = 2;
  // serde_json-encoded engine Pending.
  bytes pending_json = 3;
}

// Client → server: the seat's answer.
message PlayerActionMsg {
  string game_id = 1;
  string seat_token = 2;
  // serde_json-encoded engine PlayerAction.
  bytes action_json = 3;
}

// Client → server: something a seat says about itself that is not a move in
// the game (#265): which teammates it shows its hand to, and asking or
// declining to be shown one. The engine never sees it, so it enters neither
// the journal nor the snapshot hash. A setting that changes nothing is
// answered with nothing.
message SeatSettingMsg {
  // serde_json-encoded baylee_view::SeatSetting.
  bytes setting_json = 1;
}

// Server → client: the once-per-game payload — seat roster and print
// table. A networked client cannot build this itself: it never sees the
// preset, and the print table is what turns a PrintRef into a card face.
message GameStaticMsg {
  string game_id = 1;
  // View schema version. Duplicated out of the payload on purpose: a client
  // that cannot render this version must be able to say so without first
  // decoding a structure whose shape is exactly what changed.
  uint32 view_version = 2;
  // serde_json-encoded baylee_view::GameStatic.
  bytes static_json = 3;
}

// Server → client: a state view after actions (journal seq for resync).
message StateDelta {
  string game_id = 1;
  uint64 seq = 2;
  // serde_json-encoded baylee_view::PlayerView. Never empty.
  bytes view_json = 3;
  // serde_json-encoded baylee_view::LogTail: this seat's game log since the
  // last tail it was sent, beside the view and never inside it (#262). Empty
  // when there is nothing new. A tail holds at most baylee_view::LOG_TAIL_CAP
  // entries; when more are waiting, several frames go out in one go, each
  // repeating the same view and seq with the next part of the log. A client
  // reads log_json from every frame, including one whose view it drops as not
  // newer. docs/protocol.md, "The game log".
  bytes log_json = 4;
}

// ------------------------------------------------- control and engine planes
//
// The gateway runs no rules of its own. A game lives in an engine process that
// an *agent* starts and that dials the gateway back; the gateway routes
// between that process and the seats. None of the messages below ever reach a
// player's socket, and a player's socket never carries one.
//
//   gateway ── StartEngine ──> agent ── spawn ──> engine
//   gateway <──── EngineHello / SeatFrame ─────── engine
//   gateway ──── GameSetup / SeatFrame ────────> engine

// Agent → gateway, first frame on the control socket.
message AgentHello {
  // Shared secret from the gateway's configuration.
  string token = 1;
  // Human label, for logs and for the operator.
  string name = 2;
  // How many engines this agent will run at once. 0 means no limit.
  uint32 capacity = 3;
  // The PROTOCOL_VERSION this agent was built with (#271). The gateway
  // refuses any other with an Error naming both; 0 is an agent from before
  // this field, which says none.
  uint32 protocol_version = 4;
}

// Gateway → agent, once the token checks out.
message AgentWelcome {
  string agent_id = 1;
  // How often the agent should send a Heartbeat.
  uint32 heartbeat_secs = 2;
}

// Gateway → agent: start an engine for this game.
message StartEngine {
  string game_id = 1;
  // What the engine authenticates its own attach with. One game's worth of
  // authority, and it never leaves the machine the agent runs on.
  string engine_token = 2;
  // Where the engine dials back (ws:// or wss://).
  string gateway_url = 3;
}

// Gateway → agent: this game is over and its engine can go.
message StopEngine {
  string game_id = 1;
}

// Agent → gateway: what became of one engine.
message EngineStatus {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    // The process is running.
    KIND_STARTED = 1;
    // It exited; `detail` carries the status.
    KIND_EXITED = 2;
    // It never started; `detail` says why.
    KIND_FAILED = 3;
  }
  string game_id = 1;
  Kind kind = 2;
  string detail = 3;
}

// Engine → gateway, first frame on the engine socket.
message EngineHello {
  string game_id = 1;
  string token = 2;
  // The PROTOCOL_VERSION this engine was built with (#271), checked like
  // AgentHello's.
  uint32 protocol_version = 3;
  // The engine's process id on its machine, so a gateway on the same
  // machine can read its CPU and memory for the admin console
  // (`docs/protocol.md` §"The admin console"). 0 is an engine from before
  // this field, or one that does not say; the gateway reads nothing then.
  uint32 pid = 4;
}

// Gateway → engine: everything needed to build the game.
message GameSetup {
  string game_id = 1;
  // serde_json-encoded baylee_core::preset::GamePreset. JSON rather than
  // GamePresetMsg for the same reason the choice taxonomy is JSON: this link
  // is between two builds of the same workspace, and the preset gains fields
  // faster than the wire should.
  bytes preset_json = 2;
  // Seat names in seat order. The rules kernel has never heard of an account,
  // so the roster is assembled by the gateway.
  repeated string seat_names = 3;
}

// Gateway → engine: a seat's socket opened.
message SeatAttached {
  uint32 seat = 1;
  // 2 was standing_json: the account's standing answers, replayed into the
  // seat as it attached. Retired with `/automation` (#233); the client sends
  // its own ability policies as seat actions.
  reserved 2;
  reserved "standing_json";
  // The seat is already in the game and only lost frames: send it a snapshot
  // rather than advancing the game on its behalf.
  bool resync = 3;
}

// Gateway → engine: a seat's socket closed.
message SeatDetached {
  uint32 seat = 1;
}

// Either direction on the engine link: one player-facing Envelope, tagged with
// the seat it belongs to.
message SeatFrame {
  uint32 seat = 1;
  // An encoded Envelope. Nested rather than a field on Envelope itself, so the
  // player-facing protocol keeps exactly the shape it had and the gateway can
  // forward the bytes it was handed without decoding or re-encoding them.
  bytes envelope = 2;
}

// Engine → gateway: the game is over. The gateway cannot read a `Pending` —
// it does not link the engine — so the engine says so outright.
message GameEnded {
  string game_id = 1;
  repeated uint32 winners = 2;
  string reason = 3;
}

// Engine → gateway: a piece of the game's record (#315), every input the
// engine took, for the gateway's store and bug reports; never forwarded to a
// seat. `data` is one gzip member of JSON Lines (`baylee_gamehost::record`),
// so the pieces stored one after another in `seq` order are one gzip stream.
// The last piece comes before `GameEnded` on the same socket; a record whose
// engine died has no last piece.
message GameRecordChunk {
  string game_id = 1;
  // 0, 1, 2, … per game.
  uint32 seq = 2;
  bytes data = 3;
  bool last = 4;
}

// Gateway → engine: send what has gathered of the record now, as a
// `GameRecordChunk` that is not `last`, and then say so with a
// `RecordFlushed` carrying the same `nonce` (#323). Asked for a bug report
// filed at a game that goes on, so the record attached reaches the moment
// of the report. Never forwarded to a seat. An engine from before it reads
// an envelope with no message and does nothing.
message FlushRecord {
  string game_id = 1;
  // The gateway's, echoed back; says which ask an answer is for.
  uint64 nonce = 2;
}

// Engine → gateway: everything of the record up to the `FlushRecord` with
// this `nonce` was sent before this frame, on the same socket (#323). Sent
// for every `FlushRecord`, also when nothing was waiting (then with no
// piece before it), before the game is built, and after it ended.
message RecordFlushed {
  string game_id = 1;
  uint64 nonce = 2;
  // How many pieces the engine has sent so far: the next piece's `seq`.
  uint32 pieces = 3;
}

message Envelope {
  // 1 was `Hello`, which nothing ever sent (#271).
  reserved 1;
  reserved "hello";
  oneof msg {
    HelloAck hello_ack = 2;
    JoinGame join = 3;
    ResumeGame resume = 4;
    GamePresetMsg preset = 5;
    Heartbeat heartbeat = 6;
    Error error = 7;
    CreateGame create_game = 8;
    GameCreated game_created = 9;
    ChoiceRequest choice_request = 10;
    PlayerActionMsg player_action = 11;
    StateDelta state_delta = 12;
    GameStaticMsg game_static = 13;
    // Control plane (gateway ↔ agent).
    AgentHello agent_hello = 14;
    AgentWelcome agent_welcome = 15;
    StartEngine start_engine = 16;
    StopEngine stop_engine = 17;
    EngineStatus engine_status = 18;
    // Engine plane (gateway ↔ engine process).
    EngineHello engine_hello = 19;
    GameSetup game_setup = 20;
    SeatAttached seat_attached = 21;
    SeatDetached seat_detached = 22;
    SeatFrame seat_frame = 23;
    GameEnded game_ended = 24;
    // Game start (player ↔ engine; on the engine link inside a SeatFrame).
    SeatReady seat_ready = 25;
    Curtain curtain = 26;
    // Player → engine, protocol version 3: a seat's setting about itself.
    SeatSettingMsg seat_setting = 27;
    ClockProbe clock_probe = 28;
    TableLoading table_loading = 29;
    // Engine → gateway only (#315). An older gateway ignores it.
    GameRecordChunk game_record_chunk = 30;
    // Engine link only (#323). An engine or gateway from before them
    // decodes either as an envelope with no message and passes over it.
    FlushRecord flush_record = 31;
    RecordFlushed record_flushed = 32;
    // Seat → engine → seat: what an AI seat's mind said beside an answer.
    // Debug builds only: a debug engine forwards it to every other attached
    // seat, a release engine drops it, and a release bridge sends none
    // (docs/protocol.md §"An AI seat's reasoning").
    AiLog ai_log = 33;
    // Seat → engine: what answers this seat, as its own client says
    // (docs/protocol.md §"Who answers a seat, as it says"). Written into
    // the game's record and shown to nobody. An engine from before it drops
    // it; no client is ever sent one.
    SeatMind seat_mind = 34;
  }

}

// What an AI seat's mind said beside an answer: a debugging and sparring
// tool. A model's reasoning reads its whole view out loud, so it is hidden
// information, and a debug engine shows it to the whole table on purpose;
// a release engine, the one deployed, forwards it to nobody.
message AiLog {
  reserved 1, 2, 4, 5;
  reserved "event", "kind", "reason", "json";
  // The note the mind wrote beside its answer (JSON: chose, say, tokens, ms).
  string note = 3;
  // The model's reasoning, when it gave one.
  string thinking = 6;
  // The seat that said it. Written by the engine on the way out; whatever a
  // sender puts here is overwritten.
  uint32 seat = 7;
}

// What answers a seat, as the seat's own client declares it, for the game's
// record (#315): sent once on every socket, before the seat's first answer,
// and again whenever it changes. Self-declared and unverified: the engine
// checks its shape (`baylee_protocol::mind::fault`) and nothing else, writes
// it into the record, and shows it to no seat. It names a kind of mind and a
// model, never how the model is reached: no address, no key, no prompt.
message SeatMind {
  enum Kind {
    // Says none; refused.
    KIND_UNSPECIFIED = 0;
    // A person at a client.
    KIND_HUMAN = 1;
    // The house heuristic, played by a seat bridge at `level`.
    KIND_HOUSE = 2;
    // A script that gives the least answer to every question.
    KIND_SCRIPTED = 3;
    // A language model behind an API.
    KIND_LLM_API = 4;
    // A language model behind an agent CLI.
    KIND_LLM_CLI = 5;
  }
  Kind kind = 1;
  // An API's protocol (`anthropic`, `openai`) or a CLI's tool (`claude`,
  // `codex`, …). Empty for the other kinds.
  string provider = 2;
  // The exact model id asked for; empty for a CLI's own default and for the
  // other kinds.
  string model = 3;
  // The effort or thinking level asked for, as the provider spells it;
  // empty when none was set.
  string effort = 4;
  // The house's level (`steady`, …), for `KIND_HOUSE`.
  string level = 5;
}
