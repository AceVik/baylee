syntax = "proto3";

// baylee wire protocol v0 — transport handshake + preset transfer.
// See docs/protocol.md. Binary WebSocket frames, one Envelope per frame.
package baylee.v1;

// ---------------------------------------------------------------- handshake

message Hello {
  uint32 protocol_version = 1;
  // Hash of the server's compiled card pool; mismatches invalidate client
  // caches and refuse the session.
  string card_pool_hash = 2;
}

message HelloAck {
  uint32 protocol_version = 1;
  bool compatible = 2;
  string message = 3;
}

message JoinGame {
  string game_id = 1;
  // Gateway-issued seat token: binds this connection to exactly one seat.
  string seat_token = 2;
}

message ResumeGame {
  string game_id = 1;
  string seat_token = 2;
  // Last delta sequence number the client has applied.
  uint64 last_seq = 3;
}

// ------------------------------------------------------------------- preset

enum Finish {
  FINISH_UNSPECIFIED = 0;
  FINISH_NORMAL = 1;
  FINISH_FOIL = 2;
  FINISH_ETCHED = 3;
}

message PrintInfo {
  string scryfall_id = 1;
  string lang = 2;
  Finish finish = 3;
}

message DeckEntry {
  uint32 card_index = 1;
  uint32 print_ref = 2;
}

message AiProfile {
  uint32 lookahead = 1;
  uint32 temperature_milli = 2;
  uint32 mulligan_skill = 3;
  // 0 random, 1 attack-leader, 2 archenemy
  uint32 politics = 4;
  // 0 none, 1 basic, 2 threat-aware
  uint32 hold_up = 5;
}

message SeatController {
  oneof kind {
    uint64 human_user_id = 1;
    AiProfile ai = 2;
    bool open = 3;
  }
}

message ModifierSpec {
  string key = 1;
  uint64 script_hash = 2;
  map<string, string> params = 3;
}

message SeatSpec {
  SeatController controller = 1;
  repeated DeckEntry deck = 2;
  // Cards outside the game this seat may reach (wishes). Never shuffled
  // into the library.
  repeated DeckEntry sideboard = 8;
  optional int32 starting_life = 3;
  repeated DeckEntry starting_hand = 4;
  repeated DeckEntry starting_battlefield = 5;
  repeated string emblems = 6;
  optional uint32 team = 7;
}

message HouseRules {
  bool mulligan_free_first = 1;
  // 0 = run-once-then-break, 1 = comp-rules-draw
  uint32 loop_policy = 2;
  uint32 decision_timeout_secs = 3;
  uint32 reconnect_window_secs = 4;
  bool timing_normalization = 5;
  bool takebacks = 6;
  bool time_extension_votes = 7;
}

message GamePresetMsg {
  // 0 commander, 1 highlander, 2 freeform, 3 custom
  uint32 format = 1;
  uint64 seed = 2;
  // 3 was dev_mode: a client asking to be allowed to rewrite the board.
  // Capabilities are granted by the host per seat and never travel inbound.
  reserved 3;
  reserved "dev_mode";
  HouseRules house_rules = 4;
  repeated ModifierSpec modifiers = 5;
  repeated PrintInfo prints = 6;
  repeated SeatSpec seats = 7;
}

// ----------------------------------------------------------------- envelope

message Heartbeat {
  uint64 client_time_ms = 1;
}

message Error {
  uint32 code = 1;
  string message = 2;
}

// ------------------------------------------------------------- v1 gameplay
// Complex engine structures (pending choices, actions, views) travel as
// serde_json payloads inside protobuf framing — the wire contract stays
// binary while the choice taxonomy evolves without proto churn.

message CreateGame {
  GamePresetMsg preset = 1;
}

message GameCreated {
  string game_id = 1;
  uint32 your_seat = 2;
}

// Server → client: a choice is requested from your seat.
message ChoiceRequest {
  string game_id = 1;
  uint64 seq = 2;
  // serde_json-encoded engine Pending.
  bytes pending_json = 3;
}

// Client → server: the seat's answer.
message PlayerActionMsg {
  string game_id = 1;
  string seat_token = 2;
  // serde_json-encoded engine PlayerAction.
  bytes action_json = 3;
}

// Server → client: the once-per-game payload — seat roster and print
// table. A networked client cannot build this itself: it never sees the
// preset, and the print table is what turns a PrintRef into a card face.
message GameStaticMsg {
  string game_id = 1;
  // View schema version. Duplicated out of the payload on purpose: a client
  // that cannot render this version must be able to say so without first
  // decoding a structure whose shape is exactly what changed.
  uint32 view_version = 2;
  // serde_json-encoded baylee_view::GameStatic.
  bytes static_json = 3;
}

// Server → client: a state view after actions (journal seq for resync).
message StateDelta {
  string game_id = 1;
  uint64 seq = 2;
  // serde_json-encoded compact view (turn, phase, zones counts, log tail).
  bytes view_json = 3;
}

// ------------------------------------------------- control and engine planes
//
// The gateway runs no rules of its own. A game lives in an engine process that
// an *agent* starts and that dials the gateway back; the gateway routes
// between that process and the seats. None of the messages below ever reach a
// player's socket, and a player's socket never carries one.
//
//   gateway ── StartEngine ──> agent ── spawn ──> engine
//   gateway <──── EngineHello / SeatFrame ─────── engine
//   gateway ──── GameSetup / SeatFrame ────────> engine

// Agent → gateway, first frame on the control socket.
message AgentHello {
  // Shared secret from the gateway's configuration.
  string token = 1;
  // Human label, for logs and for the operator.
  string name = 2;
  // How many engines this agent will run at once. 0 means no limit.
  uint32 capacity = 3;
}

// Gateway → agent, once the token checks out.
message AgentWelcome {
  string agent_id = 1;
  // How often the agent should send a Heartbeat.
  uint32 heartbeat_secs = 2;
}

// Gateway → agent: start an engine for this game.
message StartEngine {
  string game_id = 1;
  // What the engine authenticates its own attach with. One game's worth of
  // authority, and it never leaves the machine the agent runs on.
  string engine_token = 2;
  // Where the engine dials back (ws:// or wss://).
  string gateway_url = 3;
}

// Gateway → agent: this game is over and its engine can go.
message StopEngine {
  string game_id = 1;
}

// Agent → gateway: what became of one engine.
message EngineStatus {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    // The process is running.
    KIND_STARTED = 1;
    // It exited; `detail` carries the status.
    KIND_EXITED = 2;
    // It never started; `detail` says why.
    KIND_FAILED = 3;
  }
  string game_id = 1;
  Kind kind = 2;
  string detail = 3;
}

// Engine → gateway, first frame on the engine socket.
message EngineHello {
  string game_id = 1;
  string token = 2;
}

// Gateway → engine: everything needed to build the game.
message GameSetup {
  string game_id = 1;
  // serde_json-encoded baylee_core::preset::GamePreset. JSON rather than
  // GamePresetMsg for the same reason the choice taxonomy is JSON: this link
  // is between two builds of the same workspace, and the preset gains fields
  // faster than the wire should.
  bytes preset_json = 2;
  // Seat names in seat order. The rules kernel has never heard of an account,
  // so the roster is assembled by the gateway.
  repeated string seat_names = 3;
}

// Gateway → engine: a seat's socket opened.
message SeatAttached {
  uint32 seat = 1;
  // serde_json list of the account's standing answers, replayed into the seat
  // before the first pump so a question it never wanted to see is already
  // covered when the opening hand arrives.
  bytes standing_json = 2;
  // The seat is already in the game and only lost frames: send it a snapshot
  // rather than advancing the game on its behalf.
  bool resync = 3;
}

// Gateway → engine: a seat's socket closed.
message SeatDetached {
  uint32 seat = 1;
}

// Either direction on the engine link: one player-facing Envelope, tagged with
// the seat it belongs to.
message SeatFrame {
  uint32 seat = 1;
  // An encoded Envelope. Nested rather than a field on Envelope itself, so the
  // player-facing protocol keeps exactly the shape it had and the gateway can
  // forward the bytes it was handed without decoding or re-encoding them.
  bytes envelope = 2;
}

// Engine → gateway: the game is over. The gateway cannot read a `Pending` —
// it does not link the engine — so the engine says so outright.
message GameEnded {
  string game_id = 1;
  repeated uint32 winners = 2;
  string reason = 3;
}

message Envelope {
  oneof msg {
    Hello hello = 1;
    HelloAck hello_ack = 2;
    JoinGame join = 3;
    ResumeGame resume = 4;
    GamePresetMsg preset = 5;
    Heartbeat heartbeat = 6;
    Error error = 7;
    CreateGame create_game = 8;
    GameCreated game_created = 9;
    ChoiceRequest choice_request = 10;
    PlayerActionMsg player_action = 11;
    StateDelta state_delta = 12;
    GameStaticMsg game_static = 13;
    // Control plane (gateway ↔ agent).
    AgentHello agent_hello = 14;
    AgentWelcome agent_welcome = 15;
    StartEngine start_engine = 16;
    StopEngine stop_engine = 17;
    EngineStatus engine_status = 18;
    // Engine plane (gateway ↔ engine process).
    EngineHello engine_hello = 19;
    GameSetup game_setup = 20;
    SeatAttached seat_attached = 21;
    SeatDetached seat_detached = 22;
    SeatFrame seat_frame = 23;
    GameEnded game_ended = 24;
  }

}
