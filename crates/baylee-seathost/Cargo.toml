[package]
name = "baylee-seathost"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A seat agent: keeps hosted language-model profiles and runs one baylee-seat bridge per hosted chair"

[lints]
workspace = true

[dependencies]
# The seat agent's link (`seathost` frames) and the gateway's version.
baylee-protocol.workspace = true
# The settings file's profile and caps, the spend book, the key stores: the
# bridge's own types, so a profile the seat agent accepts is one the bridge
# plays. Nothing of the game: the seat agent supervises processes.
baylee-client-core.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true }
tokio-tungstenite.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[[bin]]
name = "baylee-seathost"
path = "src/main.rs"
