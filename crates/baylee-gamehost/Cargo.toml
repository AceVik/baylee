[package]
name = "baylee-gamehost"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared game hosting: sessions (engine + AI seats), hidden-info views, preset conversion"
# The integration tests are one program (`tests/integration.rs`), not one
# per file: each linked the engine and every card again.
autotests = false

[lints]
workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"

[features]
# The house's search in copies of the game (`session/foresight/`,
# `docs/house-ai.md` §"Foresight"): a level with a foresight tier tries its
# options in forks of the table (`Engine::fork_for`) within its own bound and
# the host's (`Session::set_foresight_host`). The hosting builds turn it on
# (the engine server and the client's own table); a table still has to switch
# it on (`Session::set_foresight`).
foresight = ["baylee-engine/fork"]
# The harness around it, for training and evaluation that run their games
# in-process: `Session::fork_for` and `SimulationSession` to drive a copy by
# hand, and the hooks that measure and study the house's searches (probes,
# kept questions, a clock of the harness's own, a node share). Only the
# training crates may turn it on (through a feature `xtask` does not enable,
# such as `baylee-train/onnx`): `cargo dev gate shipped-features` fails if a
# hosting build does.
simulation = ["foresight"]

[dependencies]
baylee-ai.workspace = true
# The build a record's header names, which decides how a replay checks it
# (`record::this_build`). No dependencies of its own.
baylee-build.workspace = true
baylee-cards.workspace = true
baylee-cards-dsl.workspace = true
baylee-core.workspace = true
baylee-engine.workspace = true
baylee-protocol.workspace = true
baylee-view.workspace = true
serde.workspace = true
serde_json.workspace = true
# The table surface's seed is a one-way digest of the game seed
# (`session::table_seed_of`); an invertible mixer would give the seed away.
sha2.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
# Its tests look cards up, so they hold the pool (`baylee-cards-pool`).
baylee-cards-pool.workspace = true
# `Session::fork_for` is tested here (`session/tests/simulation.rs`) as the
# engine tests its own fork: a dev edge, which neither a `--bin` build nor
# `cargo dev gate shipped-features`'s graph follows.
baylee-engine = { workspace = true, features = ["fork"] }
# A report's card references (`bugreport::refs`) are held to the hidden-
# information rule here, beside every other guarantee a view makes
# (`view/tests/report_refs.rs`). Already linked through `baylee-ai`.
baylee-client-core.workspace = true
