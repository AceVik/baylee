[package]
name = "baylee-gamehost"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared game hosting: sessions (engine + AI seats), hidden-info views, preset conversion"

[lints]
workspace = true

[features]
# The engine's `Engine::fork_for`, for lookahead that a training or evaluation
# harness runs through a `Session` it owns in-process. Only the training
# crates may turn it on (through a feature `xtask` does not enable, such as
# `baylee-train/play`): `cargo dev gate shipped-features` fails if a hosting
# build does.
simulation = ["baylee-engine/simulation"]

[dependencies]
baylee-ai.workspace = true
# The build a record's header names, which decides how a replay checks it
# (`record::this_build`). No dependencies of its own.
baylee-build.workspace = true
baylee-cards.workspace = true
baylee-cards-dsl.workspace = true
baylee-core.workspace = true
baylee-engine.workspace = true
baylee-protocol.workspace = true
baylee-view.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
# A report's card references (`bugreport::refs`) are held to the hidden-
# information rule here, beside every other guarantee a view makes
# (`view/tests/report_refs.rs`). Already linked through `baylee-ai`.
baylee-client-core.workspace = true
