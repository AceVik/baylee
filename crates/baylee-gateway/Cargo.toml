[package]
name = "baylee-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Gateway: accounts, decks, lobby, and game hosting for baylee"

[lints]
workspace = true

[dependencies]
argon2.workspace = true
axum.workspace = true
baylee-cards.workspace = true
baylee-cards-dsl.workspace = true
baylee-catalog.workspace = true
baylee-core.workspace = true
baylee-protocol.workspace = true
bytes.workspace = true
futures-util.workspace = true
getrandom.workspace = true
# Uploaded sleeves and playmats are decoded before they are stored — the
# decode *is* the validation. Already in the tree via the client, so this
# adds nothing to audit; the extra formats are the ones a player's own
# picture actually arrives in.
image = { workspace = true, features = ["jpeg"] }
lettre.workspace = true
parking_lot.workspace = true
prost.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ureq.workspace = true
uuid.workspace = true

[dev-dependencies]
# The gateway no longer links the rules kernel — that is the point of the
# engine plane. Its tests still have to prove the two ends agree, so they link
# what the engine reads with, and drive a real engine over the real link.
baylee-engine.workspace = true
baylee-engine-server.workspace = true
tokio-tungstenite.workspace = true
# The end-to-end tests read the opening payload a client is sent, so they
# check it against the very version constant a client would refuse on.
baylee-view.workspace = true
