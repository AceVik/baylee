[package]
name = "baylee-account"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Strict native Baylee Central transport and account data format"

[lints]
workspace = true

[features]
default = []
client = ["dep:central-client", "dep:baylee-tower-api", "dep:time", "dep:baylee-core"]
tower-host = ["dep:baylee-tower-api", "dep:bytes", "dep:http-body-util", "dep:hyper", "dep:hyper-rustls", "dep:hyper-util", "dep:tokio"]

[dependencies]
baylee-core = { workspace = true, optional = true }
central-api.workspace = true
baylee-tower-api = { workspace = true, optional = true }
central-client = { workspace = true, optional = true }
serde.workspace = true
flate2.workspace = true
serde_json.workspace = true
sha2.workspace = true
ureq.workspace = true
url.workspace = true
time = { workspace = true, features = ["parsing"], optional = true }
uuid.workspace = true
zeroize.workspace = true
bytes = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
hyper-rustls = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
