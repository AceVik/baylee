[package]
name = "baylee-client-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Renderer-agnostic client brain: table layout, board model, interaction state machine, image cache policy."

[lints]
workspace = true

[dependencies]
baylee-cardtext.workspace = true
baylee-cards-dsl.workspace = true
baylee-core.workspace = true
# Deck import and export: the formats, detection and URL sources.
baylee-deckio.workspace = true
baylee-engine.workspace = true
# The username rule the gateway checks (`names`), so the sign-up form can
# say what is wrong with a name before sending it (#269).
baylee-protocol.workspace = true
baylee-view.workspace = true
# Chat's end-to-end encryption (`social`), and the base64 a report and the
# chat share. Pure, no randomness of its own: it builds for wasm32.
baylee-seal.workspace = true
# A local game's record is gzipped once, for disk and for a report that
# carries it (`bugreport::localrecord`). Its default backend is pure Rust,
# so it builds for wasm32 too.
flate2.workspace = true
glam.workspace = true
serde.workspace = true
# A replay keeps each moment's payload as the tape wrote it and decodes it
# only when the moment is shown (`replay::tape`).
serde_json = { workspace = true, features = ["raw_value"] }
# The chat's history file names and chat folder (`social::disk`).
sha2.workspace = true
# The language-model seat's spend book counts a game in the player's
# calendar day: the date of a moment it is handed. Arithmetic only; the
# bridge reads the clock.
time.workspace = true
# The chat's secrets and plaintext are wiped when dropped (`social`).
zeroize.workspace = true
argon2 = { workspace = true, features = ["zeroize"] }
chacha20poly1305.workspace = true
getrandom.workspace = true
uuid.workspace = true
url = "2.5.8"

# The chat's device secrets in the OS credential store (`social::vault`): the
# Keychain, the Credential Manager, the Secret Service. Desktop only; the
# shared `baylee-keyring` adapter also used by `baylee-seat`.
[target.'cfg(any(windows, target_os = "macos", target_os = "linux"))'.dependencies]
keyring = { package = "baylee-keyring", path = "../baylee-keyring" }

[features]
# The view builders in `test_support`, for tests in crates above this one.
# Enabled through a dev-dependency, so it is never in a shipped build.
test-support = []

[dev-dependencies]
criterion.workspace = true

# Per-call costs outside the renderer (`docs/perf-client.md`):
# `cargo bench -p baylee-client-core --features test-support --bench client`.
[[bench]]
name = "client"
harness = false
required-features = ["test-support"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1", features = ["process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }
