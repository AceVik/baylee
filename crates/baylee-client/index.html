<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Deliberately *without* `viewport-fit=cover`: the browser then keeps the
       canvas inside the safe area on its own, and the client needs no notch
       arithmetic it cannot test. `user-scalable=no` because pinch is a camera
       gesture here, not a page zoom, and a double-tap must not zoom the page
       away from the game. -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0a0d0f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Baylee</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/brand/apple-touch-icon.png">
  <!-- Nothing on this page is inline, script or style (#327): the served
       page's Content-Security-Policy (`scripts/server/play.caddy`) allows
       only files. The stylesheet is `web/page.css`; `web/boot.js` checks for
       WebGPU, wakes sound on the first press (#296) and starts the wasm, and
       Trunk.toml's `pattern_script` puts the tag that loads it where the
       `rel="rust"` link stands, with the hashed file names on it. -->
  <link data-trunk rel="css" href="web/page.css">
  <link data-trunk rel="copy-file" href="web/boot.js">
  <link data-trunk rel="rust" data-wasm-opt="z" data-bin="baylee-client">
  <!-- Bevy's asset server resolves `fonts/Faustina.ttf` against `./assets/` in a
       browser exactly as it does natively, but nothing puts that directory in
       `dist/` unless trunk is told to. Without this line the wasm build ships
       no fonts, and every glyph the client draws — the icons, the mana
       symbols — silently renders as nothing. -->
  <link data-trunk rel="copy-dir" href="assets">
</head>
<body></body>
</html>
