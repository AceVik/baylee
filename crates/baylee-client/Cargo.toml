[package]
name = "baylee-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Bevy 2.5D duel client: table renderer, HUD, input, and card image cache."

[lints]
workspace = true

[dependencies]
url = "2.5.8"
time.workspace = true
baylee-ai.workspace = true
baylee-cards.workspace = true
# `manasources.rs` reads a card's printed mana ability out of the registry:
# which of its abilities makes mana, and what colours it can make.
baylee-cards-dsl.workspace = true
baylee-build.workspace = true
baylee-client-core.workspace = true
baylee-core.workspace = true
baylee-engine.workspace = true
baylee-gamehost.workspace = true
baylee-protocol.workspace = true
baylee-view.workspace = true
bevy.workspace = true
getrandom.workspace = true
# The keyword rail's marks, baked from the Mana font at startup; see
# `markatlas.rs`.
swash.workspace = true
prost.workspace = true
serde.workspace = true
serde_json.workspace = true
# Card text over HTTP. Works unchanged on native and wasm, which bevy's
# asset server does not do for anything that is not an asset.
ehttp.workspace = true
# The duel socket; see `net.rs`.
ewebsock.workspace = true
# The clock behind `sky.rs`, which has to work in a browser.
web-time.workspace = true

[dev-dependencies]
# The same crate as above, with its view builders switched on. A test target
# only; `cargo build` of the client never sees the feature.
baylee-client-core = { workspace = true, features = ["test-support"] }
uuid.workspace = true
naga.workspace = true
# The networked host is tested against a real websocket server built from a
# real `Session` — the transport is the part that cannot be unit-tested.
tokio = { workspace = true }
tokio-tungstenite.workspace = true
futures-util.workspace = true

[features]
# The dev-control harness: a loopback HTTP server that presses keys, moves
# the pointer, dumps the client's own state and takes screenshots, so the
# client can be driven and read while its window is not in the foreground.
#
# A compile-time feature and not a runtime switch on purpose. A remote
# control socket inside a game binary is a cheat vector, and the only
# guarantee worth having is that the code is not in the shipped build at
# all; the loopback bind is the second lock, not the first.
dev-control = ["dep:image"]

# Two development features that trade a slower first build for a faster loop,
# both off by default and neither ever in a shipped build.
#
# `dev-reload` is the one that pays. It watches the shader sources this crate
# embeds, so an edit to `felt.wgsl` repaints the table in a *running* client
# with no rebuild and no restart — measured by pausing the picture through
# `/pause`, turning `FELT_CLOTH` magenta and watching the felt change under a
# client nobody had rebuilt; putting the colour back restored the frame byte
# for byte.
#
# `dev-dylink` links bevy as one shared library instead of statically, and it
# is here with its measurement rather than its reputation: a one-line edit to
# `main.rs` rebuilds in **2.0 s** statically and **1.6 s** through the dylib,
# against a two-minute first build. The usual "tens of seconds of linking" is
# not a cost this crate pays, because `[profile.dev] debug =
# "line-tables-only"` in the workspace manifest already took it out. The line
# stays so the next person can re-measure in one word instead of an
# afternoon — not because it will change the day.
#
#   BEVY_ASSET_ROOT=$PWD cargo run -p baylee-client --features dev-reload
#   cargo run -p baylee-client --features dev-dylink
#
# Both must stay out of `default` and off wasm. `dynamic_linking` has no
# meaning there, and `embedded_watcher` implies `file_watcher`, which pulls
# `notify-debouncer-full`, which does not build for `wasm32-unknown-unknown`
# — and CI type-checks this crate for exactly that target. A binary built
# with `dev-dylink` also needs bevy's dylib on its search path, so it is run
# through `cargo run` rather than as `./target/debug/baylee-client`.
#
# Both were written up here as *impossible* at bevy 0.19.1, with a resolver
# error to prove it: `bevy_dylib ^0.19.1` and `notify-debouncer-full ^0.7.0`
# each "could not be selected", the candidate lists stopping at 0.16.1 and
# 0.6.0. Both crates were on crates.io the whole time, published alongside the
# bevy that asks for them. What had stopped was the local registry index
# cache — `~/.cargo/registry/index/*/.cache/be/vy/bevy_dylib` was dated a year
# back and cargo never revalidated it — so an error that named crates.io was
# describing one laptop. A resolver failure against a crate that plainly
# exists is worth one `curl https://index.crates.io/...` before it is written
# down as a fact about the world.
dev-dylink = ["bevy/dynamic_linking"]
dev-reload = ["bevy/embedded_watcher"]

# `BEVY_ASSET_ROOT` is the load-bearing half of `dev-reload`, and getting it
# wrong fails *silently*. `embedded_asset!` remembers a shader by `file!()`,
# which cargo writes relative to the workspace root
# (`crates/baylee-client/src/shaders/felt.wgsl`), while bevy's watcher strips
# its own base path off each changed file before looking it up — and that base
# is `CARGO_MANIFEST_DIR` unless `BEVY_ASSET_ROOT` says otherwise, which is
# this package, two directories too deep. Every lookup would miss and nothing
# would reload, with no error anywhere. So the binary refuses to start when
# the variable is not the workspace root (`main.rs`) rather than pretending to
# watch. It touches nothing else: `AssetPlugin`'s `file_path` here is
# absolute, and an absolute join replaces the base rather than extending it.
# `watch_for_changes_override` can stay `None` — bevy defaults it to
# `cfg!(feature = "watch")`, which `embedded_watcher` implies. The cost of
# that root is that the watcher then sees the whole worktree, `target/`
# included.


[[bin]]
name = "baylee-client"
path = "src/main.rs"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Only reached through the `dev-control` feature; see its comment above.
image = { workspace = true, optional = true }

# Android never calls `main`: it loads a shared object and calls
# `android_main`, and `android-activity` — winit's door to that — refuses to
# compile at all until one of its two activity kinds has been chosen (six
# `cannot find type …Impl` errors and a 15-line `compile_error!` saying so).
# cargo-apk packages a NativeActivity, so that is the one. Target-scoped
# because the feature means nothing anywhere else, and because a desktop build
# should not carry it to find that out.
[target.'cfg(target_os = "android")'.dependencies]
bevy = { workspace = true, features = ["android-native-activity"] }

# Browser builds: entropy comes from Web Crypto and settings persist in
# localStorage (see src/settings.rs). `getrandom` refuses to guess a backend
# on wasm32-unknown-unknown — a wrong guess would be a silently weak RNG
# rather than a build error — and since 0.4 this feature is the whole of the
# answer. It used to be half of one: `.cargo/config.toml` also passed
# `--cfg getrandom_backend="wasm_js"`, which 0.4 no longer declares as a
# value, so the flag went from load-bearing to an unexpected cfg nobody reads.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }
web-sys = { workspace = true, features = [
    "Document",
    "Element",
    "EventTarget",
    "HtmlElement",
    "HtmlInputElement",
    "KeyboardEvent",
    "Location",
    "Storage",
    "Window",
] }
wasm-bindgen.workspace = true
send_wrapper.workspace = true
