[package]
name = "baylee-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Bevy 2.5D duel client: table renderer, HUD, input, and card image cache."

[lints]
workspace = true

[dependencies]
baylee-ai.workspace = true
baylee-cards.workspace = true
# `manasources.rs` reads a card's printed mana ability out of the registry:
# which of its abilities makes mana, and what colours it can make.
baylee-cards-dsl.workspace = true
baylee-client-core.workspace = true
baylee-core.workspace = true
baylee-engine.workspace = true
baylee-gamehost.workspace = true
baylee-protocol.workspace = true
baylee-view.workspace = true
bevy.workspace = true
getrandom.workspace = true
prost.workspace = true
serde.workspace = true
serde_json.workspace = true
# Card text over HTTP. Works unchanged on native and wasm, which bevy's
# asset server does not do for anything that is not an asset.
ehttp.workspace = true
# The duel socket; see `net.rs`.
ewebsock.workspace = true
# The clock behind `sky.rs`, which has to work in a browser.
web-time.workspace = true

[dev-dependencies]
# The same crate as above, with its view builders switched on. A test target
# only; `cargo build` of the client never sees the feature.
baylee-client-core = { workspace = true, features = ["test-support"] }
uuid.workspace = true
naga.workspace = true
# The networked host is tested against a real websocket server built from a
# real `Session` — the transport is the part that cannot be unit-tested.
tokio = { workspace = true }
tokio-tungstenite.workspace = true
futures-util.workspace = true

[features]
# The dev-control harness: a loopback HTTP server that presses keys, moves
# the pointer, dumps the client's own state and takes screenshots, so the
# client can be driven and read while its window is not in the foreground.
#
# A compile-time feature and not a runtime switch on purpose. A remote
# control socket inside a game binary is a cheat vector, and the only
# guarantee worth having is that the code is not in the shipped build at
# all; the loopback bind is the second lock, not the first.
dev-control = ["dep:image"]

# No `dev-dylink = ["bevy/dynamic_linking"]` here, and it was tried: at
# bevy 0.19.1 `bevy_dylib` does not resolve, and because cargo resolves the
# whole feature graph for the lockfile, merely *declaring* the feature breaks
# every command in the workspace — including ones that never enable it.
#
# No `dev-reload = ["bevy/embedded_watcher"]` either, and for exactly the same
# reason, which is worth writing down because everything *else* about it
# checks out. bevy 0.19.1's `bevy_asset` asks for `notify-debouncer-full
# ^0.7.0` and crates.io stops at 0.6.0, so the requirement cannot be selected
# and one declared feature takes `cargo check -p baylee-client-core` down with
# it. Measured 2026-09-10.
#
# What the rest of it would need, so a bevy bump can turn it on in one line:
# all seven shaders are already `embedded_asset!`, and `AssetPlugin`'s
# `watch_for_changes_override` can stay `None` (bevy reads
# `cfg!(feature = "watch")`, which `embedded_watcher` implies). The one thing
# that has to be arranged is the **root**. `embedded_asset!` remembers a
# shader by `file!()`, which cargo writes relative to the workspace root
# (`crates/baylee-client/src/shaders/…`), while bevy's watcher strips its base
# path — `CARGO_MANIFEST_DIR`, this package, two directories too deep — off
# each changed file before looking it up. Every lookup would miss and nothing
# would reload, with no error anywhere. Setting `BEVY_ASSET_ROOT` to the
# workspace root before `App::new()` fixes it and touches nothing else, since
# `asset_root()` is absolute and an absolute join replaces the base rather
# than extending it. The cost of that root is that the watcher then sees the
# whole worktree, `target/` included.
#
# It would also have to stay out of `default` and off wasm: `embedded_watcher`
# implies `file_watcher`, which pulls `notify-debouncer-full`, which does not
# build for `wasm32-unknown-unknown` — and CI type-checks this crate for
# exactly that target.

[[bin]]
name = "baylee-client"
path = "src/main.rs"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Only reached through the `dev-control` feature; see its comment above.
image = { workspace = true, optional = true }

# Browser builds: entropy comes from Web Crypto (see .cargo/config.toml), and
# settings persist in localStorage (see src/settings.rs).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }
web-sys = { workspace = true, features = [
    "Document",
    "Element",
    "EventTarget",
    "HtmlElement",
    "HtmlInputElement",
    "KeyboardEvent",
    "Location",
    "Storage",
    "Window",
] }
wasm-bindgen.workspace = true
send_wrapper.workspace = true
