[package]
name = "baylee-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Bevy 2.5D duel client: table renderer, HUD, input, and card image cache."

[lints]
workspace = true

[dependencies]
baylee-ai.workspace = true
baylee-cards.workspace = true
# `manasources.rs` reads a card's printed mana ability out of the registry:
# which of its abilities makes mana, and what colours it can make.
baylee-cards-dsl.workspace = true
baylee-client-core.workspace = true
baylee-core.workspace = true
baylee-engine.workspace = true
baylee-gamehost.workspace = true
baylee-protocol.workspace = true
baylee-view.workspace = true
bevy.workspace = true
getrandom.workspace = true
prost.workspace = true
serde.workspace = true
serde_json.workspace = true
# Card text over HTTP. Works unchanged on native and wasm, which bevy's
# asset server does not do for anything that is not an asset.
ehttp.workspace = true
# The duel socket; see `net.rs`.
ewebsock.workspace = true

[dev-dependencies]
uuid.workspace = true
naga.workspace = true
# The networked host is tested against a real websocket server built from a
# real `Session` — the transport is the part that cannot be unit-tested.
tokio = { workspace = true }
tokio-tungstenite.workspace = true
futures-util.workspace = true

[features]
# The dev-control harness: a loopback HTTP server that presses keys, moves
# the pointer, dumps the client's own state and takes screenshots, so the
# client can be driven and read while its window is not in the foreground.
#
# A compile-time feature and not a runtime switch on purpose. A remote
# control socket inside a game binary is a cheat vector, and the only
# guarantee worth having is that the code is not in the shipped build at
# all; the loopback bind is the second lock, not the first.
dev-control = ["dep:image"]

[[bin]]
name = "baylee-client"
path = "src/main.rs"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Only reached through the `dev-control` feature; see its comment above.
image = { workspace = true, optional = true }

# Browser builds: entropy comes from Web Crypto (see .cargo/config.toml), and
# settings persist in localStorage (see src/settings.rs).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }
web-sys = { workspace = true, features = [
    "Document",
    "Element",
    "EventTarget",
    "HtmlElement",
    "HtmlInputElement",
    "KeyboardEvent",
    "Location",
    "Storage",
    "Window",
] }
wasm-bindgen.workspace = true
send_wrapper.workspace = true
