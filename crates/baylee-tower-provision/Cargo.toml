[package]
name = "baylee-tower-provision"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Binary: brings up a production Tower Echoes cohort through the service's own migrate/admin commands; credentials only on stdin"
publish = false

[lints]
