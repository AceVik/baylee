[package]
name = "baylee-engine-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Binary: one process per game, websocket transport"

[lints]
workspace = true

[dependencies]
# Its programs look cards up, so they hold the pool (`baylee-cards-pool`).
baylee-cards-pool.workspace = true
baylee-ai.workspace = true
baylee-build.workspace = true
baylee-cards.workspace = true
baylee-cards-dsl.workspace = true
baylee-core.workspace = true
baylee-engine.workspace = true
baylee-gamehost.workspace = true
baylee-protocol.workspace = true
baylee-view.workspace = true
bytes.workspace = true
flate2.workspace = true
futures-util.workspace = true
prost.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[features]
# A local measurement, never a hosted game: every game this engine builds has
# the house's chairs try their options in forks of the game before they answer
# (`Session::set_foresight`, `docs/house-ai.md` §"Foresight"), and prints what
# that cost when it ends. It turns on `baylee-gamehost/simulation`, which no
# hosting build may (`cargo dev gate shipped-features`), so it is off by default
# and outside `cargo build-servers`; an engine built with it plays only a game a
# gateway on this machine ordered (loopback or a unix socket) and runs no dev
# harness.
house-foresight = ["baylee-gamehost/simulation"]

[dev-dependencies]
# The other end of the command line this binary is started with. The agent
# writes the three flags and this reads them, and nothing in the build links
# the two — so without this the two spellings are only ever held against
# themselves. It points the way a test may: the reader depends on the writer.
baylee-agent.workspace = true
criterion.workspace = true

[[bench]]
name = "frames"
harness = false
