[package]
name = "baylee-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Deterministic MTG rules kernel (no I/O, no async)"

[lints]
workspace = true

[features]
# `Engine::fingerprint`, `Engine::fingerprint_light` and `Fingerprint`: every
# field of the engine, for a fuzzer holding it to its invariants (a refused
# `apply` changes nothing). Off in every build that plays a game.
fuzz = []
# `Engine::fork_for`: a disposable copy of a game with the hidden cards dealt
# again, for lookahead in training and evaluation (`docs/engine-internals.md`
# §"Forking a simulation"). Never in a build that hosts a game:
# `cargo dev gate shipped-features` fails if anything outside the training
# crates turns it on.
simulation = []

[dependencies]
baylee-core.workspace = true
baylee-cards-dsl.workspace = true
rustc-hash.workspace = true
xxhash-rust.workspace = true
smallvec.workspace = true
serde = { workspace = true, features = ["rc"] }
thiserror.workspace = true
rand_chacha.workspace = true
rand_core.workspace = true

[dev-dependencies]
# `mutate`: `BAYLEE_MUTATE` for this crate's test binary, and for nothing else
# (`docs/verification-hooks.md`).
baylee-cards = { workspace = true, features = ["mutate"] }
uuid.workspace = true
criterion.workspace = true
serde_json.workspace = true

[[bench]]
name = "basics"
harness = false

[[bench]]
name = "fork"
harness = false
required-features = ["simulation"]
