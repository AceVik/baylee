[package]
name = "baylee-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Deterministic MTG rules kernel (no I/O, no async)"

[lints]
workspace = true

[features]
# `Engine::fingerprint`, `Engine::fingerprint_light` and `Fingerprint`: every
# field of the engine, for a fuzzer holding it to its invariants (a refused
# `apply` changes nothing). Off in every build that plays a game.
fuzz = []
# `Engine::fork_for`: a disposable copy of a game with the hidden cards dealt
# again (`docs/engine-internals.md` §"Forking a simulation"), for the house's
# bounded search at a host (`baylee-gamehost/foresight`, which the engine
# server and the client's own table turn on) and for lookahead in training
# and evaluation. A fair copy holds none of the real hidden cards; the
# harness API around it (`baylee-gamehost/simulation`) is what
# `cargo dev gate shipped-features` keeps out of every hosting build.
fork = []

# Card test crates.
test-support = ["fuzz"]

[dependencies]
baylee-core.workspace = true
baylee-cards-dsl.workspace = true
rustc-hash.workspace = true
xxhash-rust.workspace = true
smallvec.workspace = true
serde = { workspace = true, features = ["rc"] }
thiserror.workspace = true
rand_chacha.workspace = true
rand_core.workspace = true

[dev-dependencies]
# Its tests look cards up, so they hold the pool (`baylee-cards-pool`).
baylee-cards-pool.workspace = true
# `mutate`: `BAYLEE_MUTATE` for this crate's test binary, and for nothing else
# (`docs/verification-hooks.md`).
baylee-cards = { workspace = true, features = ["mutate"] }
uuid.workspace = true
criterion.workspace = true
serde_json.workspace = true
# `recorded_lockstep_tests` (ignored) reads the gzip members of recorded runs.
flate2.workspace = true

[[bench]]
name = "basics"
harness = false

[[bench]]
name = "fork"
harness = false
required-features = ["fork"]
