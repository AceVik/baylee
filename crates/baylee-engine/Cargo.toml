[package]
name = "baylee-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Deterministic MTG rules kernel (no I/O, no async)"

[lints]
workspace = true

[features]
# `Engine::projection_is_fresh`, the fuzzer's projection-cache invariant
# (`docs/verification-hooks.md`). Non-default: nothing shipped builds it, and
# `scripts/gate-features.sh` is what compiles it.
fuzz = []

[dependencies]
baylee-core.workspace = true
baylee-cards-dsl.workspace = true
rustc-hash.workspace = true
xxhash-rust.workspace = true
smallvec.workspace = true
serde.workspace = true
thiserror.workspace = true
rand_chacha.workspace = true
rand_core.workspace = true

[dev-dependencies]
# `mutate`: `BAYLEE_MUTATE` for this crate's test binary, and for nothing else
# (`docs/verification-hooks.md`).
baylee-cards = { workspace = true, features = ["mutate"] }
uuid.workspace = true
criterion.workspace = true

[[bench]]
name = "basics"
harness = false
