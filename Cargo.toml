[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# MSRV: let-chains (stabilized in 1.88) are used across the engine and the
# gateway. CI builds against exactly this version so the number stays true.
rust-version = "1.88"
license = "AGPL-3.0-only"
# The AGPL's own "How to Apply" appendix asks for a copyright holder and a
# way to reach the source, and here both are obligations rather than
# decoration: §13 says a user who interacts with the program over a network
# must be offered its Corresponding Source, and a gateway is exactly that.
# `repository` is where that offer points; `baylee-build` carries it into
# every binary and the client draws it.
authors = ["Viktor Machnik"]
repository = "https://github.com/AceVik/baylee"
description = "An unofficial, non-commercial fan implementation of a trading card game"

# Dependency policy: newest stable, pinned here once for the whole workspace.
# Refresh with `cargo upgrade` (cargo-edit) + full CI run.
[workspace.dependencies]
baylee-core = { path = "crates/baylee-core" }
baylee-protocol = { path = "crates/baylee-protocol" }
baylee-view = { path = "crates/baylee-view" }
baylee-client-core = { path = "crates/baylee-client-core" }
baylee-client = { path = "crates/baylee-client" }
baylee-engine = { path = "crates/baylee-engine" }
baylee-cards-dsl = { path = "crates/baylee-cards-dsl" }
baylee-cards = { path = "crates/baylee-cards" }
baylee-cards-codegen = { path = "crates/baylee-cards-codegen" }
baylee-cards-index = { path = "crates/baylee-cards-index" }
baylee-ai = { path = "crates/baylee-ai" }
baylee-gamehost = { path = "crates/baylee-gamehost" }
baylee-gateway = { path = "crates/baylee-gateway" }
baylee-engine-server = { path = "crates/baylee-engine-server" }
baylee-agent = { path = "crates/baylee-agent" }
baylee-catalog = { path = "crates/baylee-catalog" }
baylee-build = { path = "crates/baylee-build" }
baylee-db = { path = "crates/baylee-db" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v7", "js"] }
thiserror = "2"
anyhow = "1"
smallvec = "1"
prost = "0.14"
prost-build = "0.14"
protoc-bin-vendored = "3"
bytes = "1"
futures-util = "0.3"
rustc-hash = "2"
glam = "0.32"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
rand_chacha = "0.10"
rand_core = "0.10"
clap = { version = "4", features = ["derive"] }
ureq = { version = "3", features = ["json"] }
heck = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"
axum = { version = "0.8", features = ["ws"] }
argon2 = "0.6"
getrandom = "0.4"
# PNG encoding for the dev-control screenshot endpoint (`dev-control`
# feature, never in a release build). Pinned to the version bevy already
# resolves, so it adds no second copy of the crate.
image = { version = "0.25", default-features = false, features = ["png"] }
# Browser bindings for the client's localStorage settings. Version pinned to
# the one bevy already resolves for wasm, so this adds no second copy.
web-sys = "0.3"
wasm-bindgen = "0.2"
sha2 = "0.11"
# Confirmation mail from the gateway. rustls only — no OpenSSL on the build
# host, and `webpki-roots` so a container needs no CA bundle of its own.
lettre = { version = "0.11", default-features = false, features = [
    "builder", "smtp-transport", "hostname", "tokio1", "tokio1-rustls", "ring",
    "webpki-roots",
] }
subtle = "2"
tokio-tungstenite = "0.30"
# Persistence, gateway side only. The engine never sees a database: the
# catalog stores card text, `baylee-db` stores accounts, decks and sessions.
sea-orm = { version = "2.0", default-features = false, features = [
    "sqlx-postgres", "runtime-tokio-rustls", "macros",
    # The three Postgres types the account tables are built from, plus the
    # array a decklist is stored as. Without these features SeaORM maps a
    # `uuid` column to a `String` and a `timestamptz` to nothing at all,
    # which is how a typed schema quietly becomes a stringly one again.
    "with-uuid", "with-time", "with-json", "postgres-array",
] }
# The migrator. Same release line as `sea-orm` deliberately: the two share
# `sea-query` types across their public API and a mismatched pair fails to
# compile in a way that reads like a bug in this repository.
sea-orm-migration = { version = "2.0", default-features = false, features = [
    "sqlx-postgres", "runtime-tokio-rustls",
] }
# Timestamps. `time` rather than `chrono` because it was already in the tree
# as a transitive dependency and because `OffsetDateTime` cannot be built
# without an offset, which is the mistake a `timestamptz` column exists to
# stop being possible.
time = { version = "0.3", features = ["serde"] }
# Scryfall ships its bulk data gzipped; the ingest streams it rather than
# holding 400 MB of JSON in memory.
flate2 = "1"
# Card text fetch in the client. Tiny, and the only HTTP client that works
# unchanged on native and wasm — bevy's asset server only does assets.
ehttp = "0.7"
# The duel socket, for the same reason: one API that is a background thread
# natively and the browser's own WebSocket on wasm. `tls` is rustls-only, so
# a wss:// gateway costs no system OpenSSL.
ewebsock = { version = "0.8", features = ["tls"] }
# Lets the browser's WebSocket handle live in a Bevy resource, which must be
# Send + Sync. Checked at run time (a panic, never UB) and wasm-only.
send_wrapper = "0.6"
# The wall clock the sky reads. `std::time::SystemTime::now` panics on
# wasm32-unknown-unknown; this is `std::time` everywhere else and the
# browser's own clock there. Already in the tree — bevy depends on it.
web-time = "1.1"
# The card shader is validated at build time. Without this it would compile
# only when a real GPU pipeline is built — which in the browser means the one
# environment that cannot be debugged by looking at a filesystem.
naga = { version = "29", features = ["wgsl-in"] }
criterion = { version = "0.8", features = ["html_reports"] }
bevy = { version = "0.19", default-features = false, features = [
    "std", "async_executor", "multi_threaded",
    "bevy_asset", "bevy_log", "bevy_state", "reflect_auto_register",
    "bevy_winit", "default_font", "custom_cursor",
    "ui_bevy_render", "bevy_ui_widgets",
    "bevy_pbr", "bevy_light", "bevy_anti_alias", "tonemapping_luts", "zstd_rust",
    "picking", "mesh_picking",
    "png", "jpeg", "webp",
    # Both schemes, and `http` is not the careless half of the pair: the
    # gateway's art mirror is what a client is *told* to use, and a
    # development gateway is `http://127.0.0.1:28766`. Bevy registers the two
    # asset sources behind separate features, so with `https` alone every
    # mirrored picture failed with "Asset Source 'AssetSourceId::Name(http)'
    # does not exist" and the table drew constructed faces on grey slabs.
    "http", "https", "web_asset_cache",
    "keyboard", "mouse", "touch", "gestures",
    # The browser build renders through **WebGPU**. The two are one feature
    # apart and mutually exclusive: `webgl2` puts wgpu on the GL backend,
    # which caps the browser at ES 3.00 semantics — no storage buffers, no
    # texture arrays, no compute, and no `bitCount`. Everything drawn here
    # still obeys that older budget (uniforms only, compile-time loop
    # bounds), so the swap costs nothing today and is what makes compute and
    # storage buffers reachable at all tomorrow.
    "x11", "wayland", "webgpu",
    # Sound. `bevy_audio` is the device — rodio and cpal, which means
    # CoreAudio, ALSA, WASAPI and, in a browser, an `AudioContext` that does
    # not start until the player has clicked something. `wav` is the decoder,
    # and it is the only format this client needs because it ships no audio
    # files: `client::sound` computes PCM at startup and writes a RIFF header
    # in front of it. See `docs/legal.md` §5.
    "bevy_audio", "wav",
] }

[workspace.lints.rust]
# `deny`, not `forbid`: unsafe stays off by default, but a call site that
# genuinely earns it — a measured performance win, or a safe abstraction that
# would otherwise take far more complex code — can opt in with a local
# `#[allow(unsafe_code)]`. `forbid` cannot be overridden, which is why every
# such decision would otherwise have to be a workspace-wide one. The opt-in is
# deliberate and reviewable: it carries a `// SAFETY:` comment stating the
# invariant, and tests that would fail if the invariant broke.
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# `debug_assert!` is not evaluated in release — a mutating call inside it
# silently disappears from production builds (this hid "mana is never paid
# in release" once already).
debug_assert_with_mut_call = "warn"
# Game math uses deliberate narrowing casts everywhere; noisy without value.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev]
# Line tables instead of full debug info. A backtrace keeps its file and line
# numbers — which is all a panicking test is ever read for — while the
# artefacts get much smaller, and it is artefact size that drives both a
# 165 GB `target/debug` and the link time of every Bevy test binary.
#
# Not `debug = false`: a panic with no line number costs more to chase than
# the disk ever saved.
debug = "line-tables-only"
