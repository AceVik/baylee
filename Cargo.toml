[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"

# Dependency policy: newest stable, pinned here once for the whole workspace.
# Refresh with `cargo upgrade` (cargo-edit) + full CI run.
[workspace.dependencies]
baylee-core = { path = "crates/baylee-core" }
baylee-protocol = { path = "crates/baylee-protocol" }
baylee-engine = { path = "crates/baylee-engine" }
baylee-cards-dsl = { path = "crates/baylee-cards-dsl" }
baylee-cards = { path = "crates/baylee-cards" }
baylee-cards-codegen = { path = "crates/baylee-cards-codegen" }
baylee-ai = { path = "crates/baylee-ai" }
baylee-engine-server = { path = "crates/baylee-engine-server" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v7", "js"] }
thiserror = "2"
anyhow = "1"
smallvec = "1"
prost = "0.13"
prost-build = "0.13"
protoc-bin-vendored = "3"
bytes = "1"
futures-util = "0.3"
rustc-hash = "2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
rand_chacha = "0.9"
rand_core = "0.9"
rhai = "1"
clap = { version = "4", features = ["derive"] }
ureq = { version = "3", features = ["json"] }
heck = "0.5"
tracing = "0.1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
criterion = { version = "0.5", features = ["html_reports"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Game math uses deliberate narrowing casts everywhere; noisy without value.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
