name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# A push supersedes the run before it, and four runs of the same branch were
# not four verdicts — they were four jobs queueing for the same macOS pool and
# four `codegen` processes fetching from Scryfall on the same runner IP range,
# which is what earned the rate limiting. The last commit's verdict is the one
# that matters; the superseded run is cancelled rather than raced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-deps
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # The gateway keeps its accounts in PostgreSQL, so the suite needs one.
  # Not a convenience: the e2e tests spawn real gateway processes, and a
  # gateway with no database refuses to start.
  #
  # Each spawned gateway takes a schema of its own and caps its pool at two,
  # which is what lets three dozen of them share one server that allows a
  # hundred connections in total.
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: baylee
          POSTGRES_PASSWORD: baylee
          POSTGRES_DB: baylee
        ports:
          - 5432:5432
        # Without this the first test races the server's own startup, which
        # fails on some runs and not others — the one failure shape a CI job
        # must not have.
        options: >-
          --health-cmd "pg_isready -U baylee -d baylee"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://baylee:baylee@127.0.0.1:5432/baylee
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-deps
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo test --workspace --all-targets

  # Debug-only behavior has bitten before (a `debug_assert!` hid the mana
  # payment from every release build), so the suite also runs in release.
  test-release:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: baylee
          POSTGRES_PASSWORD: baylee
          POSTGRES_DB: baylee
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U baylee -d baylee"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://baylee:baylee@127.0.0.1:5432/baylee
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-deps
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo test --workspace --all-targets --release

  # Every platform this is meant to run on, on its own architecture.
  #
  # What breaks per-platform is exactly what one Linux runner cannot see: a
  # path separator, a `cfg` that has only ever run on 64-bit x86, a build
  # script that assumes a shell, and above all the **link**. So this builds
  # rather than checks — the client is a GUI binary and half of what a new
  # platform costs is discovered by the linker and not by the type checker.
  #
  # The suite itself does not run here, deliberately. The tests are
  # arithmetic and protocol, both architecture-independent, so running them
  # six times would re-prove what the two jobs above already prove while
  # making every pull request wait on six Bevy builds.
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not hide the state of the other five; the
      # whole value of a matrix is knowing *which* of them broke.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest      # x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm   # aarch64-unknown-linux-gnu
          - os: windows-latest     # x86_64-pc-windows-msvc
          - os: windows-11-arm     # aarch64-pc-windows-msvc
          # Six targets, five runners: the Apple Silicon runner builds the
          # Intel slice too.
          #
          # `macos-13` stood here as its own row and had been **retired**
          # since 2025-12-08, following GitHub's N-1 policy after Apple
          # dropped x86_64 — so the job never started, sat in `queued` for 91
          # minutes on one run, and kept the whole run from ever concluding.
          # `macos-15-intel` is the documented successor and would work, but
          # GitHub has also announced that x86_64 macOS runners go away
          # entirely when that image retires in autumn 2027, so a row naming
          # one is a row with a second expiry date on it.
          #
          # An arm64 Mac links x86_64 with nothing but `rustup target add`:
          # the macOS SDK carries both slices, so `rustc --target
          # x86_64-apple-darwin` produces a real `Mach-O 64-bit executable
          # x86_64`. Measured on this machine before the row was written.
          # That is the same **link** the matrix comment above says this job
          # exists for; what it gives up is *running* the result, which no
          # row of this matrix does anyway.
          - os: macos-latest       # aarch64-apple-darwin
            extra-target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-deps
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: ${{ matrix.os }}
      - run: cargo build --workspace --bins
      # `--bins` links every binary; this is the half it does not reach, and
      # it is where a `cfg(test)` block first meets a platform. Checked
      # rather than built, because linking test harnesses on six platforms
      # is a cost with no matching failure mode.
      - run: cargo check --workspace --all-targets
      # The second architecture of a runner that can reach one. Installed
      # here rather than through the toolchain action's `targets:`, because
      # that field would have to be handed an empty string on every other
      # row, and an empty target is not the same thing as no target.
      - if: matrix.extra-target
        run: rustup target add ${{ matrix.extra-target }}
      - if: matrix.extra-target
        run: cargo build --workspace --bins --target ${{ matrix.extra-target }}

  # Cards are not generated here, and the job that tried to is gone. `codegen`
  # reads the external card-script reference, which is GPL and deliberately
  # not vendored (`NOTICE`), so a runner has none of it — `note: card-script
  # reference not found at …/mtg/card-scripts, skipping index` — and the
  # generator then writes different files than the machine that committed
  # them: run 34990754077 reported 85 stale files, 79 of them for no reason
  # but the absent corpus. Generating a card is a developer's job, and what
  # comes out of it is committed code the compiler and the tests already
  # check. What CI checks about the *cards* is this job: every `//! Oracle:`
  # header against the CardDef the code builds, and against the oracle text
  # and type line Scryfall prints — drift that stable clippy and the tests
  # cannot see, and it has caught a card carrying the wrong cost and P/T
  # through a "fix".
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/scryfall-cache
        id: scryfall
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: xtask
      # `validate` reads a cache it cannot fill. It looks every printing up
      # through `cached_printing`, a pure read with no network at all, so on a
      # cold cache it compares nothing and says so ("only 0 comparisons were
      # made against the printings; the sweep is not reaching the pool")
      # rather than reporting a clean pool. Filling it used to be `codegen`'s
      # side effect, which is how a check about card headers came to depend on
      # a generator. `xtask scryfall-cache` is the command that fetches and
      # does nothing else, and it is one bulk download — 2.3 s on this runner,
      # measured cold in run 34990754077.
      - run: cargo run -p xtask -- scryfall-cache
      - run: cargo run -p xtask -- validate
      # The fetch is the expensive half, so it is saved even when the
      # comparison fails: `actions/cache`'s own post step is skipped on a
      # failed job, which is what kept every run of this job starting from an
      # empty cache. `!cancelled()` and deliberately **not** `always()`, which
      # this job was given for one commit and which immediately poisoned the
      # key — `actions/cache/save` refuses to overwrite a key that exists, so
      # a run cancelled four minutes in saved a 17 KB directory under the key
      # the full fetch was going to write 30 MB to.
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          path: data/scryfall-cache
          key: ${{ steps.scryfall.outputs.key }}

  # The browser client compiles nothing on a native build: its localStorage
  # settings and Web Crypto entropy live behind `cfg(target_arch = "wasm32")`
  # and would rot unnoticed without a target-specific job.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo check -p baylee-client --target wasm32-unknown-unknown

  # Benches run in CI so they never silently rot; the numbers land in the
  # job log for comparison against docs/perf-baseline.md (manual check —
  # runner timing is too noisy for a hard 10% gate).
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-deps
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # `--bench basics` names the target on purpose. Without it `cargo bench`
      # runs every bench target in the crate, the lib's own libtest harness
      # included, and that harness answers `--quick` with "Unrecognized
      # option" and exit 101 — criterion never sees the flag it is meant for.
      - run: cargo bench -p baylee-engine --bench basics -- --quick

  # The declared MSRV is a promise, and two things were wrong with it at once.
  # The number was false: `Cargo.toml` said 1.88 while `bevy` 0.19.1 declares
  # `rust-version = "1.95.0"`, so nothing here had built on 1.88 for months —
  # and `cargo upgrade`, which is MSRV-aware, read our own file and offered to
  # downgrade bevy and sea-orm to honour it.
  #
  # And this job proved nothing. `rust-toolchain.toml` pins `channel =
  # "stable"`, and a toolchain file beats `rustup default`, which is all
  # `dtolnay/rust-toolchain` sets — so the 1.88 it installed was never used and
  # the job was green because it checked stable twice. Run 34990754077 says so
  # in rustup's own words: "note that the toolchain
  # 'stable-x86_64-unknown-linux-gnu' is currently in use (overridden by
  # '/home/runner/work/baylee/baylee/rust-toolchain.toml')".
  #
  # `RUSTUP_TOOLCHAIN` is the one override that beats the file — measured, not
  # assumed: with the file saying stable, `RUSTUP_TOOLCHAIN=nightly rustc
  # --version` answers nightly. It is exported *before* `rust-cache`, which
  # hashes `rustc -vV` into its key, so the cache belongs to the compiler that
  # actually compiles. And the version is read out of `Cargo.toml` rather than
  # typed here, because a number that appears twice is a number that drifts —
  # which is how this one came to be 1.88 in two places and true in neither.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-deps
      - id: declared
        run: |
          v=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          test -n "$v" || { echo "Cargo.toml declares no rust-version"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.declared.outputs.version }}
      - run: echo "RUSTUP_TOOLCHAIN=${{ steps.declared.outputs.version }}" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # In the log, so the next person reading a green tick can see which
      # compiler earned it. This is the line whose absence hid the bug.
      - run: rustc --version && cargo --version
      - run: cargo check --workspace --all-targets

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  audit:
    runs-on: ubuntu-latest
    # `audit-check` reports through a **check run**, which is a write, and
    # this workflow's `GITHUB_TOKEN` is read-only: the job failed with
    # "Resource not accessible by integration" before it had looked at a
    # single advisory. Named on the job rather than raised repository-wide,
    # because a permission granted to one job is the one the other thirteen
    # do not get — and `contents: read` has to be restated, since a
    # `permissions` block replaces the defaults rather than adding to them.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
