name: ci

# Who waits for what (owner, 08.10.2026: "CI green only matters when we
# release"). A change lands on main after the two desktop gates
# (`cargo dev land`) without waiting for CI. CI then has two jobs:
#
# - **main push**: everything that protects a release. `release.yml` promotes
#   only the packages of a *successful push run at the tagged commit*, and
#   `baylee-tools release` also requires each job named in its
#   REQUIRED_JOBS to have run and passed in that run, so nothing here can be
#   skipped on a commit that is then released.
# - **pull request**: the quick half (fmt, clippy, the debug suite in two
#   partitions, shipped-features, validate, deny, web-feedback), each only
#   when its inputs changed. The
#   label `ci:full` runs a PR as a main push would; so does any change to CI
#   itself.
# - **nightly**: the full set again plus the five-platform `build` matrix
#   (every binary on Linux x86_64, the client elsewhere), for what rots
#   without a push (a new stable toolchain, a new advisory).
#
# Measured before this layout (30 main pushes and 31 PRs, 06.–08.10.2026):
# PR p50 27 min (p95 40), main push p50 56 (p95 69), and three jobs stuck for 4–6 h in
# `apt-get update`. `docs/releasing.md` §"CI" has the table.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    # Nightly, at an odd minute: the top of the hour is the most delayed slot.
    - cron: '41 2 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: Run what a main push runs, packages included (a dispatched run is never promotable)
        type: boolean
        default: true
      platforms:
        description: Also run the nightly build matrix (every binary on Linux x86_64, the client on the other four platforms)
        type: boolean
        default: false

# Read-only unless a job says otherwise (`packages`, `audit`).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# One run per event and ref at a time. On main a running run is never
# cancelled: on 24.09.2026 eleven heads in a row were cancelled by the next
# integration and main went two hours without a verdict, and the version-bump
# commit a release is tagged on needs its run to finish. GitHub keeps one
# pending run per group, so a burst of pushes still costs one run in progress
# plus the newest queued. Everything else (a PR, a dispatch, the nightly) is
# superseded by its next run. The event is in the key so a nightly never takes
# the pending slot of a main push.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  # What changed, so a job runs only when its inputs did (`cargo dev ci-changes`,
  # crates/baylee-dev/src/changes.rs, says which paths are which). Every push still gets a run: a workflow-level
  # `paths-ignore` would leave a commit with no run at all.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full: ${{ steps.scope.outputs.full }}
      rust: ${{ steps.scope.outputs.rust }}
      tests: ${{ steps.scope.outputs.tests }}
      web: ${{ steps.scope.outputs.web }}
      packages: ${{ steps.scope.outputs.packages }}
      platforms: ${{ steps.scope.outputs.platforms }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: scope
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          FULL_INPUT: ${{ inputs.full }}
          PLATFORMS_INPUT: ${{ inputs.platforms }}
          LABELLED_FULL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: |
          # A push diffs every commit it brought (`before`), a PR its merge
          # commit against the base it merges into. No diff (a new branch, a
          # schedule, a dispatch) or an empty one counts as everything.
          files=
          case $EVENT in
            push)
              if git fetch --no-tags --depth=1 origin "$BEFORE" 2>/dev/null; then
                files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
              fi ;;
            pull_request)
              files=$(git diff --name-only HEAD^1 HEAD) ;;
          esac
          if [ -z "$files" ]; then
            code=true docs=true web=true ci=true
          else
            while IFS='=' read -r key value; do
              case $key in code) code=$value ;; docs) docs=$value ;; web) web=$value ;; ci) ci=$value ;; esac
            # The runner's own stable toolchain: the pinned one is not
            # installed here, and this job sits in front of every other.
            done < <(RUSTUP_TOOLCHAIN=stable cargo dev ci-changes <<<"$files")
          fi
          full=false
          case $EVENT in
            push) if [ "$code" = true ] || [ "$ci" = true ]; then full=true; fi ;;
            schedule) full=true ;;
            workflow_dispatch) full=$FULL_INPUT ;;
            pull_request) if [ "$LABELLED_FULL" = true ] || [ "$ci" = true ]; then full=true; fi ;;
          esac
          rust=false; if [ "$code" = true ] || [ "$ci" = true ] || [ "$full" = true ]; then rust=true; fi
          tests=false; if [ "$rust" = true ] || [ "$docs" = true ]; then tests=true; fi
          webjob=false; if [ "$web" = true ] || [ "$full" = true ]; then webjob=true; fi
          packages=false; if [ "$full" = true ] && [ "$EVENT" != schedule ]; then packages=true; fi
          platforms=false
          if [ "$EVENT" = schedule ] || { [ "$EVENT" = workflow_dispatch ] && [ "$PLATFORMS_INPUT" = true ]; }; then
            platforms=true
          fi
          {
            echo "full=$full"; echo "rust=$rust"; echo "tests=$tests"; echo "web=$webjob"
            echo "packages=$packages"; echo "platforms=$platforms"
          } | tee -a "$GITHUB_OUTPUT"
          {
            echo "### Scope"
            echo "changed: code=$code docs=$docs web=$web ci=$ci"
            echo "runs: full=$full rust=$rust tests=$tests web=$webjob packages=$packages platforms=$platforms"
          } >> "$GITHUB_STEP_SUMMARY"

  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch: the toolchain defaults to stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Caches. The repository had 10 GB of Actions cache (25 GB since 29.10.2026,
  # when the package caches had pushed `tests-optimized` out twice) and each
  # Rust cache is 1.0–1.9 GB; on 08.10.2026 eight entries filled it, all from that day, and
  # most jobs logged "No cache found" (the debug suite compiled for 7.7 min
  # instead of 3.5, the optimized one for 25 instead of 17). The writers were
  # PRs: a PR's cache lives under `refs/pull/N/merge`, which no other run can
  # read, and the PR-only platform matrix wrote five more. So only a push to
  # main writes a cache now, and every other run restores main's. Jobs no
  # cache is written for (bench, msrv, the nightly matrix's other rows)
  # restore none either; its Linux x86_64 row reads the debug suite's.
  clippy:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/linux-deps
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch: the toolchain defaults to stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: tests-debug
          save-if: false
      # The training crates are not CI's (owner, 30.10.2026): see the test job.
      - run: cargo clippy --workspace --all-targets --exclude baylee-train --exclude baylee-train-ops -- -D warnings

  # The gateway keeps its accounts in PostgreSQL, so the suite needs one.
  # Not a convenience: the e2e tests spawn real gateway processes, and a
  # gateway with no database refuses to start.
  #
  # Each spawned gateway takes a schema of its own and caps its pool at two,
  # which is what lets three dozen of them share one server that allows a
  # hundred connections in total.
  #
  # Two partitions, each building the whole suite and running half of it.
  # Measured 08.10.2026: 10346 tests, 2716 s of test time, 860 s on one
  # four-core runner after 3.5 min (warm) to 7.7 min (cold) of compiling; the
  # longest test alone is 271 s, which is the floor any split runs into. Each
  # half compiles for itself rather than sharing a `nextest archive`: the
  # archive would be gigabytes of Bevy test binaries to upload and download,
  # and the e2e tests reach other binaries by compile-time paths.
  test:
    name: test (${{ matrix.partition }}/2)
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-24.04
    # 30 until 15.10.2026: the full generated pool (9078 cards) put the
    # per-card sweeps of partition 1 past it (harness 172 s on ten cores
    # here, over 19 min on the four-core runner). 50 until 29.10.2026, when
    # partition 1 ran p50 31.8 / p95 40.5 min warm and hit 50 once cold
    # (run 39778675890); the harness is eight shards across both halves now.
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: baylee
          POSTGRES_PASSWORD: baylee
          POSTGRES_DB: baylee
        ports:
          - 5432:5432
        # Without this the first test races the server's own startup, which
        # fails on some runs and not others — the one failure shape a CI job
        # must not have.
        options: >-
          --health-cmd "pg_isready -U baylee -d baylee"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://baylee:baylee@127.0.0.1:5432/baylee
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/linux-deps
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch: the toolchain defaults to stable
      - uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: tests-debug
          cache-on-failure: true
          # The nightly writes too: after an eviction a quiet main stayed
          # cold until its next push.
          save-if: ${{ matrix.partition == 1 && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule') }}
      - uses: taiki-e/install-action@d042af60014eb018fcd01f57f4f62118b69e3ea6 # nextest branch: installs nextest
      # Before the suite, not after: run 40556109917 lost a green 40-minute
      # partition when this install hung behind it. The bounded install
      # includes dpkg triggers: that run spent 295 s downloading and was
      # killed during man-db after unpacking.
      - name: Linux credential-store packages
        if: matrix.partition == 1
        shell: bash
        run: |
          sudo timeout --kill-after=15s 600 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 install --no-install-recommends -y dbus-x11 gnome-keyring libglib2.0-bin
      # nextest rather than `cargo test`: it runs each test in its own process,
      # reports per *test* rather than per binary (which is how the next
      # outlier is found), and partitions. There are no doctests in this
      # workspace (`cargo test --doc` finds zero), so nextest not running them
      # costs nothing. `--no-fail-fast`: a run that stops at the first failure
      # hides how much else is broken.
      # The training crates (baylee-train, baylee-train-ops) are not CI's:
      # they are built, linted and tested locally, where the local gate runs
      # them (owner, 24.10. and 30.10.2026). xtask still links baylee-train
      # without `play`, so its library compiles as a dependency. Engine,
      # house-AI and gamehost coverage stays in CI.
      - run: >-
          cargo nextest run --locked --workspace --all-targets --no-fail-fast
          --exclude baylee-train --exclude baylee-train-ops
          --partition count:${{ matrix.partition }}/2
      - name: Isolated Linux credential-store round trip
        if: matrix.partition == 1
        run: cargo dev keyring-linux

  # Debug-only behavior has bitten before (a `debug_assert!` hid the mana
  # payment from every release build), so the suite also runs optimized with
  # release assertions/overflow semantics, without per-test LTO. Main pushes
  # and the nightly only, and it guards a release, not a review. Cold
  # compiles took 52–56 min on 29.10.2026, when eviction at the cache limit
  # dropped its cache (docs/releasing.md §"CI"), so 60 min cancelled one
  # eight minutes into the tests.
  test-release:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: baylee
          POSTGRES_PASSWORD: baylee
          POSTGRES_DB: baylee
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U baylee -d baylee"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://baylee:baylee@127.0.0.1:5432/baylee
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/linux-deps
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch: the toolchain defaults to stable
      - uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: tests-optimized
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule') }}
      - uses: taiki-e/install-action@d042af60014eb018fcd01f57f4f62118b69e3ea6 # nextest branch: installs nextest
      - run: cargo nextest run --locked --workspace --all-targets --exclude baylee-train --exclude baylee-train-ops --no-fail-fast --cargo-profile ci-release

  # Main builds the actual dist packages once. Tags promote those exact
  # artifacts. A dispatched or `ci:full` run builds them too, but only a main
  # push's packages can ever be promoted (`ci_artifacts.trusted_run`).
  packages:
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    uses: ./.github/workflows/client-packages.yml
    permissions:
      contents: read
      actions: read

  # The client on every platform it ships for, on its own architecture: the
  # nightly and a dispatch with `platforms`. Only the client is built for every
  # platform; the servers and tools run on Linux x86_64 (owner, 29.10.2026), so
  # that row alone links every binary and checks every target, and the arm64
  # Linux row adds the gateway, agent and engine server. Main's
  # `packages` build the shipped client for all six targets in the `dist`
  # profile; this builds it in the debug profile developers run.
  # What breaks per platform is what one Linux runner cannot see — a path
  # separator, a `cfg` that has only met 64-bit x86, a build script that
  # assumes a shell, and above all the link — and none of it changes per push
  # often enough to make every change wait on five Bevy builds (macOS took
  # 24–32 min of every PR). The x86_64 macOS client is the package row's alone:
  # the `macos-intel` job that linked every binary for it went on 29.10.2026.
  build:
    needs: changes
    if: needs.changes.outputs.platforms == 'true'
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      # One platform failing must not hide the state of the other four; the
      # whole value of a matrix is knowing *which* of them broke.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04       # x86_64-unknown-linux-gnu
            timeout: 40
            everything: true
          - os: ubuntu-24.04-arm   # aarch64-unknown-linux-gnu
            timeout: 40
            servers: true
          - os: windows-latest     # x86_64-pc-windows-msvc
            timeout: 60
          - os: windows-11-arm     # aarch64-pc-windows-msvc
            timeout: 60
          - os: macos-latest       # aarch64-apple-darwin
            timeout: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/linux-deps
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch: the toolchain defaults to stable
      # Only the Linux x86_64 row has a cache to read: the debug suite's.
      - if: matrix.everything
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: tests-debug
          save-if: false
      - if: matrix.everything
        run: cargo build --locked --workspace --bins --exclude baylee-train --exclude baylee-train-ops
      # `--bins` links every binary; this is the half it does not reach, and
      # it is where a `cfg(test)` block first meets a platform.
      - if: matrix.everything
        run: cargo check --locked --workspace --all-targets --exclude baylee-train --exclude baylee-train-ops
      - if: ${{ !matrix.everything }}
        run: cargo build-client
      - if: ${{ !matrix.everything }}
        run: cargo check-client
      - if: matrix.servers
        run: cargo build-servers

  # Cards are not generated here. `codegen` reads the external card-script
  # reference, which is GPL and deliberately not vendored (`NOTICE`), so a
  # runner has none of it and would write different files than the machine
  # that committed them (run 34990754077: 85 stale files, 79 for no reason but
  # the absent corpus). What CI checks about the *cards* is this job: every
  # `//! Oracle:` header against the CardDef the code builds, and against the
  # oracle text and type line Scryfall prints.
  validate:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/scryfall-cache
        id: scryfall
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch: the toolchain defaults to stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: tests-debug
          save-if: false
      # `validate` reads a cache it cannot fill (a pure read, no network), so
      # on a cold cache it compares nothing and says so. `xtask
      # scryfall-cache` is the command that fetches: one bulk download, 3322
      # payloads in about 30 s (run 37787880265).
      - run: cargo run --locked -p xtask -- scryfall-cache
      # xtask links baylee-train (without `play`) for card validation, not training: `working`, `cardwalk` and `housedeck`.
      - run: cargo run --locked -p xtask -- validate
      # The API documents (docs/api/): current, and every route a service
      # registers is in one of them (`cargo dev api check`). The tool is a
      # workspace of its own (tools/api-docs/Cargo.toml says why), so no
      # `--workspace` job runs its tests.
      - run: cargo run --locked -q --manifest-path tools/api-docs/Cargo.toml -- check
      - run: cargo test --locked -q --manifest-path tools/api-docs/Cargo.toml
      # Saved even when the comparison fails (`actions/cache`'s own post step
      # is skipped on a failed job). `!cancelled()` and deliberately not
      # `always()`: `actions/cache/save` never overwrites a key, so a run
      # cancelled early would have saved a partial directory under the key
      # the full fetch was going to write. A pull request saves nothing: its
      # cache could serve only itself, and it would push main's out.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        continue-on-error: true
        with:
          path: data/scryfall-cache
          key: ${{ steps.scryfall.outputs.key }}

  # Android, iOS and the wasm client are coming soon. Their target-specific
  # checks are not part of desktop CI or release promotion.

  # Development-feature builds/tests run locally before landing, not in CI.
  # Only release-relevant graph checks remain: neither verification hook may
  # reach shipped builds, and the reviewed bigint advisory scope must hold.
  # This resolves dependency graphs, without building
  # the Bevy client or running the gateway suite a second time.
  shipped-features:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch: the toolchain defaults to stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: tests-debug
          save-if: false
      - run: cargo dev gate shipped-features

  # Benches run so they never silently rot; the numbers land in the job log
  # for comparison against docs/perf-baseline.md (manual check — runner timing
  # is too noisy for a hard 10% gate). No `linux-deps`: the engine links no
  # audio, input or display library, and that step is where three jobs hung.
  bench:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch: the toolchain defaults to stable
      # `--bench basics` names the target on purpose: without it libtest's own
      # harness answers `--quick` with "Unrecognized option" and exit 101.
      - run: cargo bench --locked -p baylee-engine --bench basics -- --quick

  # The declared MSRV is a promise. `rust-toolchain.toml` pins `channel =
  # "stable"` and a toolchain file beats `rustup default`, which is all
  # `dtolnay/rust-toolchain` sets, so this job once checked stable twice (run
  # 34990754077: "overridden by '…/rust-toolchain.toml'").
  # `RUSTUP_TOOLCHAIN` is the one override that beats the file, and the
  # version is read out of `Cargo.toml` rather than typed here.
  msrv:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/linux-deps
      - id: declared
        run: |
          v=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          test -n "$v" || { echo "Cargo.toml declares no rust-version"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ steps.declared.outputs.version }}
      # Through `env:`, not spliced into the script: a pull request writes
      # `Cargo.toml`, and so the text this line would run.
      - env:
          VERSION: ${{ steps.declared.outputs.version }}
        run: echo "RUSTUP_TOOLCHAIN=$VERSION" >> "$GITHUB_ENV"
      # In the log, so the next person reading a green tick can see which
      # compiler earned it. This is the line whose absence hid the bug.
      - run: rustc --version && cargo --version
      - run: cargo check --locked --workspace --all-targets --exclude baylee-train --exclude baylee-train-ops

  # The feedback service's web UI (web/feedback, #311): the lockfile's tree,
  # the type check, lint, the unit and component tests, and the build the
  # service would serve. The end-to-end tests (`npm run e2e`) need the binary
  # and a Chromium, so they run on a developer's machine before a UI change.
  web-feedback:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web/feedback
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/feedback/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  deny:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  # Main pushes and the nightly: a new advisory arrives without a push, which
  # is what the nightly is for.
  audit:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # `audit-check` reports through a **check run**, which is a write, and
    # this workflow's `GITHUB_TOKEN` is read-only. Named on the job rather
    # than raised repository-wide; `contents: read` is restated because a
    # `permissions` block replaces the defaults rather than adding to them.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # The same advisories deny.toml ignores, with their reasons there:
          # `ttf-parser` unmaintained, reached only through winit's Wayland
          # titlebar, no safe upgrade. audit-check reads no deny.toml, and on a
          # warning it opens an issue this read-only token may not write, so
          # the job went red on a notice that is not a vulnerability.
          ignore: RUSTSEC-2026-0192,RUSTSEC-2026-0344,RUSTSEC-2026-0387
