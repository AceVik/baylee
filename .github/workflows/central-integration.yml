name: central-native-integration
on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/baylee-account/**'
      - 'crates/baylee-client-core/**'
      - 'crates/baylee-keyring/**'
      - 'crates/baylee-seal/**'
      - 'crates/baylee-protocol/**'
      - 'crates/baylee-db/**'
      - 'crates/baylee-gateway/**'
      - 'crates/baylee-dev/**'
      - '.github/workflows/central-integration.yml'
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/baylee-account/**'
      - 'crates/baylee-client-core/**'
      - 'crates/baylee-keyring/**'
      - 'crates/baylee-seal/**'
      - 'crates/baylee-protocol/**'
      - 'crates/baylee-db/**'
      - 'crates/baylee-gateway/**'
      - 'crates/baylee-dev/**'
      - '.github/workflows/central-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  migration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Native credential-store build dependencies
        run: |
          sudo timeout 300 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo timeout 300 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --no-install-recommends -y libsecret-1-dev
      - name: Native account schema and real transport
        run: cargo test --locked -p baylee-account --all-features
      - name: Source cutover against owned PostgreSQL 18
        run: cargo dev central db
      - name: Gateway migration, restore and admission
        run: |
          cargo dev central integration
          # The deliberate failure must fail, and only for its own reason,
          # after its cleanup.
          if cargo dev central integration --exercise-failure 2>failure.txt; then
            echo "expected fixture failure did not occur"; exit 1
          fi
          grep -qx 'central integration: synthetic fixture failure' failure.txt
