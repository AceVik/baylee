name: central-native-integration
on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/baylee-account/**'
      - 'crates/baylee-client-core/**'
      - 'crates/baylee-keyring/**'
      - 'crates/baylee-seal/**'
      - 'crates/baylee-protocol/**'
      - 'crates/baylee-db/**'
      - 'crates/baylee-gateway/**'
      - 'crates/baylee-dev/**'
      - '.github/workflows/central-integration.yml'
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/baylee-account/**'
      - 'crates/baylee-client-core/**'
      - 'crates/baylee-keyring/**'
      - 'crates/baylee-seal/**'
      - 'crates/baylee-protocol/**'
      - 'crates/baylee-db/**'
      - 'crates/baylee-gateway/**'
      - 'crates/baylee-dev/**'
      - '.github/workflows/central-integration.yml'
  workflow_dispatch:
# A newer push supersedes a pull request's run; main's runs all finish.
concurrency:
  group: central-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  migration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch: the toolchain defaults to stable
      # libsecret for the native credential store, installed the bounded way
      # every other job does it (a slow mirror ran a bare 300 s past twice).
      - uses: ./.github/actions/linux-deps
      - name: Native account schema and real transport
        run: cargo test --locked -p baylee-account --all-features
      - name: Source cutover against owned PostgreSQL 18
        run: cargo dev central db
      - name: Gateway migration, restore and admission
        run: |
          cargo dev central integration
          # The deliberate failure must fail, and only for its own reason,
          # after its cleanup.
          if cargo dev central integration --exercise-failure 2>failure.txt; then
            echo "expected fixture failure did not occur"; exit 1
          fi
          grep -qx 'central integration: synthetic fixture failure' failure.txt
