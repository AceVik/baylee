# Publishes the game client for every desktop system as a GitHub Release.
#
# A tag `v<version>` publishes; it must name the workspace version and a
# commit `ci` passed on, or nothing is published. `workflow_dispatch` is the dry
# run: the same builds, uploaded as workflow artifacts, and no release.
#
# A tag promotes the exact packages from a successful main CI run. It never
# recompiles them. PR artifacts cannot be promoted. The reusable build workflow
# also handles dry runs, with isolated caches written only by trusted main pushes.
#
# Every archive is signed (Ed25519, `<archive>.sig`) before it is published,
# because the client installs updates by itself, and only ever an archive
# whose signature verifies against the keys it was compiled with (#326,
# `docs/releasing.md` §"Signing"). The seed is the secret
# BAYLEE_UPDATE_SIGNING_KEY, kept in the `release` environment, which only a
# `v*` tag or `main` may enter; `sign` is the one job that enters it. Without
# the secret a tag fails in `sign` and nothing is published; a dry run says so
# and goes on unsigned. A dry run is dispatched from `main`: from any other
# branch it is refused in `version`, before anything is built.
#
# Beside each archive the release carries its installers (a dmg each for
# Apple silicon and Intel, setup .exe, AppImage, .deb; `docs/releasing.md`
# §"Installers"), promoted from the same CI run. The updater never fetches
# them, so they get no `.sig`; their SHA-256 is beside them and in the
# release notes.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      promote-ci:
        description: Verify and sign existing green main CI packages without publishing
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # The feedback service a client knows: the offline count, and reports
  # signed in nowhere when no report address is set (docs/feedback.md
  # §"Straight from a client"); a repository variable, unset = off.
  BAYLEE_FEEDBACK_PUBLIC_URL: ${{ vars.BAYLEE_FEEDBACK_PUBLIC_URL }}
  # Where a client signed in to no gateway sends reports instead, the
  # official gateway (docs/feedback.md §"To Baylee Central instead"); unset =
  # the feedback service above.
  BAYLEE_REPORT_PUBLIC_URL: ${{ vars.BAYLEE_REPORT_PUBLIC_URL }}

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      ci-run: ${{ steps.v.outputs.ci-run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # The card status check below compares the tag with the commit the
          # status was measured at.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch: the toolchain defaults to stable
        with:
          toolchain: stable
      - id: v
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTE_CI: ${{ inputs.promote-ci || false }}
        run: |
          # `sign` enters the `release` environment, which admits a `v*` tag
          # and `main` only; a dry run from elsewhere would build all six
          # packages and stop there.
          if [ "$GITHUB_REF_TYPE" != tag ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::dispatch a dry run from main, not $GITHUB_REF"
            exit 1
          fi
          version=$(sed -n '/^\[workspace\.package\]/,/^\[/{s/^version = "\(.*\)"$/\1/p;}' Cargo.toml)
          [ -n "$version" ] || { echo "::error::no workspace.package.version in Cargo.toml"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ] || [ "$PROMOTE_CI" = true ]; then
            # The version is bumped in a commit on main and the tag follows it;
            # a tag that names another number would publish a binary whose
            # build stamp contradicts its own release.
            if [ "$GITHUB_REF_TYPE" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match workspace version $version"
              exit 1
            fi
            # The website reads the card status from the tagged commit, so its
            # numbers are those of the client this release ships: the status
            # must have been measured at this pool (docs/releasing.md). The
            # status is measured in the version commit, so between releases
            # it is stale and a dry run only warns: it is there to promote
            # and sign (run 40981976758 stopped here, 1374 cards on).
            if [ "$GITHUB_REF_TYPE" = tag ]; then
              cargo tools site card-status-fresh --rev "$GITHUB_SHA"
            elif ! cargo tools site card-status-fresh --rev "$GITHUB_SHA"; then
              echo "::warning::the card status is stale; a tag here would be refused until \`cargo tools site card-status\` is committed"
            fi
            # Only a successful push to this repository's main, at this SHA.
            # A green PR run is not a source of release executables.
            run=$(cargo tools release resolve)
            echo "ci-run=$run" >> "$GITHUB_OUTPUT"
          else
            version="$version-dev.${GITHUB_SHA::10}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "releasing $version"

  build:
    needs: version
    uses: ./.github/workflows/client-packages.yml
    with:
      version: ${{ needs.version.outputs.version }}
      source-run: ${{ needs.version.outputs.ci-run }}
    permissions:
      contents: read
      actions: read

  # The signer, the client's own verifier (`baylee-update`) built from this
  # commit, in a job of its own: every build script and proc macro of its
  # dependencies runs here, where no secret is, and only the binary reaches
  # `sign`. A separate step in the signing job would be no wall: a build
  # script can write `$GITHUB_ENV` or replace the binary the next step runs
  # (review of 29.10.2026).
  signer:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # The same pinned toolchain as the builds.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch: the toolchain defaults to stable
        with:
          toolchain: stable
      - run: cargo build --locked -q -p baylee-update --bin baylee-update-sign
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signer
          path: target/debug/baylee-update-sign
          retention-days: 1
          if-no-files-found: error

  # Signs every archive, then checks each signature against the keys the
  # client is compiled with, so a secret that is not the client's key fails
  # here and not in every player's updater. One job for all archives, on
  # both triggers: the secret reaches this job alone, and a dry run
  # exercises the step a tag takes.
  #
  # The job enters the `release` environment, which only a `v*` tag or `main`
  # may enter, and the seed is that environment's secret (`docs/releasing.md`
  # §"The key, once"); an environment secret wins over a repository secret of
  # the same name. Nothing is checked out or compiled here: the signer and
  # the archives come in as artifacts.
  sign:
    needs: [version, build, signer]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signer
          path: signer
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: client-*
          path: out
          merge-multiple: true
      - name: Sign
        shell: bash
        env:
          BAYLEE_UPDATE_SIGNING_KEY: ${{ secrets.BAYLEE_UPDATE_SIGNING_KEY }}
        run: |
          chmod +x signer/baylee-update-sign
          signer/baylee-update-sign release out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signatures
          overwrite: true
          path: out/*.sig
          # A dry run without the secret has none.
          if-no-files-found: ${{ github.ref_type == 'tag' && 'error' || 'warn' }}

  # The release notes need `cargo tools`, which compiles, so they are written
  # in a job that holds no write token; `publish` only uploads.
  notes:
    needs: [version, build, sign]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch: the toolchain defaults to stable
        with:
          toolchain: stable
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: client-*
          path: out
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signatures
          path: out
      - name: Check the signatures and write the notes
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # No archive goes out without its signature: the updater would
          # only link to it, and every player would install it by hand.
          for archive in out/*.zip out/*.tar.gz; do
            [ -s "$archive.sig" ] || { echo "::error::$archive has no .sig"; exit 1; }
          done
          # The installers are not signed for the updater (it never fetches
          # them); the notes list their SHA-256, and this fails if any is missing.
          sums=$(cargo tools release installer-sums out "$VERSION")
          cat > notes.md <<EOF
          Unofficial fan content, not affiliated with Wizards of the Coast.

          **Install:** macOS: open \`Baylee-$VERSION-aarch64.dmg\` (Apple silicon) or \`Baylee-$VERSION-x86_64.dmg\` (Intel) and drag Baylee to Applications. Windows: run \`Baylee-Setup-$VERSION-x64.exe\` (or \`-arm64\`), which installs for your user only and asks for no administrator rights. Linux: \`Baylee-$VERSION-<arch>.AppImage\` (make it executable and start it) or \`baylee_${VERSION}_<arch>.deb\`.
          The archives (\`baylee-client-…\`) are the same game to unpack anywhere; \`README.txt\` in each has the first-start steps. An installed client updates itself from these archives.
          The builds are not code-signed, so macOS and Windows warn on first start.
          Each archive has a \`.sig\` beside it, the Ed25519 signature a client checks before it installs an update by itself.
          Every binary names its commit and CI run in its build stamp. The build number identifies the source \`ci\` run.

          $sums
          EOF
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-notes
          path: notes.md
          if-no-files-found: error

  publish:
    needs: [version, build, sign, notes]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: client-*
          path: out
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signatures
          path: out
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-notes
          path: .
      # The write token, and nothing that compiles or was compiled here.
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ls -l out
          # A version with a pre-release part (`0.1.0-beta.1`) is published as a
          # pre-release, so GitHub does not offer it as the latest stable build.
          pre=; case $VERSION in *-*) pre=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" out/*.zip out/*.tar.gz out/*.dmg out/*.exe out/*.AppImage out/*.deb out/*.sha256 out/*.sig --verify-tag $pre --title "Baylee $VERSION" --notes-file notes.md --generate-notes
