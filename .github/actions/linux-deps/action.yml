name: linux-deps
description: >
  The system libraries Bevy links against on Linux, and nothing on any other
  platform.

runs:
  using: composite
  steps:
    # Three are *build*-time dependencies, and which ones is a question the
    # feature graph answers rather than intuition. ALSA: rodio reaches it
    # through cpal and alsa-sys, a pkg-config crate, so a runner without the
    # headers fails at `cargo build` rather than at run time. libudev is
    # gamepad enumeration, in the same position. And Wayland, which this
    # action originally left out on the grounds that Bevy opens a display
    # with dlopen — true of X11, which arrives as `x11-dl` and `x11rb` and
    # needs nothing here, and **false of Wayland as this workspace resolves
    # it**: the `wayland` feature puts `wayland-backend` on `client_system`
    # and `wayland-sys` carries no `dlopen`, so its build script runs
    # pkg-config for `wayland-client` and exits 101 without the headers.
    # Every Linux job that builds `baylee-client` died there. Read it back
    # with `cargo tree -e features --target x86_64-unknown-linux-gnu` before
    # trusting a claim about any of these.
    #
    # Guarded by the runner's own OS rather than by a `if:` on every call
    # site, so the three non-Linux platforms in the build matrix can use the
    # same one line.
    - shell: bash
      run: |
        if [ "$RUNNER_OS" != "Linux" ]; then
          echo "not Linux ($RUNNER_OS) — nothing to install"
          exit 0
        fi
        # apt has no deadline of its own. On 07.10.2026 the runners' azure
        # mirror stopped answering mid-`apt-get update`, and three jobs (bench,
        # msrv, features) sat in this step for 228, 361 and 360 minutes until
        # GitHub's six-hour limit or a person ended them. So every network
        # wait is bounded (30 s per connection, three retries) and the whole
        # call is under `timeout`: a dead mirror now fails the step in
        # minutes, and the job's own `timeout-minutes` is the backstop.
        #
        # The package lists the image ships are tried first, with no update
        # at all; only when that install fails is the network asked.
        apt=(sudo timeout 300 apt-get -o Acquire::Retries=3 \
          -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
        pkgs=(libasound2-dev libudev-dev libwayland-dev)
        if ! "${apt[@]}" install --no-install-recommends -y "${pkgs[@]}"; then
          "${apt[@]}" update
          "${apt[@]}" install --no-install-recommends -y "${pkgs[@]}"
        fi
