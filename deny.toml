[advisories]
ignore = [
    # `ttf-parser`, whose author has said it will not be maintained further.
    # It is not ours and it is not bevy's text stack: the chain is
    # `sctk-adwaita` → `ab_glyph` → `owned_ttf_parser` → here, which is
    # winit drawing a Wayland titlebar on Linux. Native installer-art tools
    # also reuse ab_glyph for the bundled OFL fonts, never an external font.
    # The advisory itself says
    # "No safe upgrade is available!" and names `skrifa` as the replacement
    # — a move `sctk-adwaita` has to make, not us, so there is nothing here
    # to act on and an unmaintained-crate notice is not a vulnerability.
    # `cargo-deny` treats `unmaintained` as an **error** where
    # `cargo-audit` reports it as a warning, which is why only one of the
    # two jobs went red on it.
    "RUSTSEC-2026-0192",
    # crypto-bigint's timing advisory is unreachable in the reviewed Central
    # Ristretto255/SHA-512 suite: OPRF and DH use curve25519-dalek arithmetic;
    # the elliptic-curve helper reached here only expands hashes into bytes.
    # This is restricted to the exact SDK pin, upstream versions and reverse
    # dependency graph documented in docs/central-login.md. The mandatory
    # shipped-features job rejects changes to that scope. elliptic-curve0.13
    # requires bigint0.5; the upstream fix>=0.7.6 needs a compatible SDK update.
    "RUSTSEC-2026-0387",
    # SQLite in `libsqlite3-sys` (a crafted database with a `-wal` file of
    # another page size; local). It is in `Cargo.lock` only as the optional
    # SQLite driver of sqlx's macros: no build of ours links it
    # (`cargo tree -i libsqlite3-sys --target all -e all --all-features`
    # prints nothing), we open no SQLite file, and sqlx-sqlite 0.9 caps it
    # below the fixed 0.39, so only a sqlx release can move it.
    "RUSTSEC-2026-0459",
]

[licenses]
allow = [
    "AGPL-3.0-only",
    "AGPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    # `encase`, `encase_derive`, `encase_derive_impl` — wgpu's uniform-buffer
    # layout crates, reached through bevy's renderer. MIT No Attribution is
    # MIT with the attribution clause struck, so it is strictly weaker than
    # the `MIT` already above it, and stands here because an allowlist says
    # what was read, not what was convenient.
    "MIT-0",
    # `webpki-root-certs` and both `webpki-roots`, the Mozilla CA bundle
    # `ureq` verifies TLS against. A *data* licence rather than a code one,
    # which is why it is neither MIT nor Apache: permissive, and it governs
    # the certificate list rather than any code we compile.
    "CDLA-Permissive-2.0",
    # `xxhash-rust`, which `baylee-engine` names directly: `Xxh3` is what
    # `state.rs` streams the deterministic state through for `snapshot_hash`.
    # The Boost licence is OSI-approved and FSF-free, permissive, and drops
    # its attribution requirement for a distributed binary — so it asks less
    # of a shipped game than `MIT` does.
    "BSL-1.0",
    "OFL-1.1",
    # Native development-only Finder metadata encoders (ds_parser,
    # alias_record). Permissive copyright/patent grant; retain the notice.
    # https://blueoakcouncil.org/license/1.0.0
    "BlueOak-1.0.0",
]

[bans]

# Crates come from crates.io, and the only git source is Baylee Central,
# pinned by rev in the root `Cargo.toml` (29.10.2026). A new registry or git
# repository is a new party to trust and fails here until it is named.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/AceVik/baylee-central.git"]

