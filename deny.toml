[advisories]
ignore = [
    # `ttf-parser`, whose author has said it will not be maintained further.
    # It is not ours and it is not bevy's text stack: the chain is
    # `sctk-adwaita` → `ab_glyph` → `owned_ttf_parser` → here, which is
    # winit drawing a Wayland titlebar on Linux. The advisory itself says
    # "No safe upgrade is available!" and names `skrifa` as the replacement
    # — a move `sctk-adwaita` has to make, not us, so there is nothing here
    # to act on and an unmaintained-crate notice is not a vulnerability.
    # `cargo-deny` treats `unmaintained` as an **error** where
    # `cargo-audit` reports it as a warning, which is why only one of the
    # two jobs went red on it.
    "RUSTSEC-2026-0192",
]

[licenses]
allow = [
    "AGPL-3.0-only",
    "AGPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    # `quoted_printable`, which lettre uses to encode a mail body. Zero-clause
    # BSD: permissive with no attribution requirement at all.
    "0BSD",
    # `encase`, `encase_derive`, `encase_derive_impl` — wgpu's uniform-buffer
    # layout crates, reached through bevy's renderer. MIT No Attribution is
    # MIT with the attribution clause struck, so it is strictly weaker than
    # the `MIT` already above it and stands here for the same reason `0BSD`
    # does: an allowlist says what was read, not what was convenient.
    "MIT-0",
    # `webpki-root-certs` and both `webpki-roots`, the Mozilla CA bundle
    # `ureq` verifies TLS against. A *data* licence rather than a code one,
    # which is why it is neither MIT nor Apache: permissive, and it governs
    # the certificate list rather than any code we compile.
    "CDLA-Permissive-2.0",
    # `xxhash-rust`, which `baylee-engine` names directly: `Xxh3` is what
    # `state.rs` streams the deterministic state through for `snapshot_hash`.
    # The Boost licence is OSI-approved and FSF-free, permissive, and drops
    # its attribution requirement for a distributed binary — so it asks less
    # of a shipped game than `MIT` does.
    "BSL-1.0",
    "OFL-1.1",
]

