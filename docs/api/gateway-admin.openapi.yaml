          description: Linked, as `GET /admin/central` answers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsoleCentral"
        "400":
          description: "No valid `X-Baylee-Admin`, or not a token: `bgt_` and 64 lowercase hex digits"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: The bearer token is neither `BAYLEE_ADMIN_TOKEN` nor a live Central admin lease
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: >-
            A browser's request (`Origin`, `Sec-Fetch-Site` or `Sec-Fetch-Mode`) or a
            `Host` that is not this machine, refused before the token is read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
