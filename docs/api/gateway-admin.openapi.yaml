              schema:
                $ref: "#/components/schemas/ErrorBody"
          headers:
            Retry-After:
              schema:
                type: integer
                format: int64
                minimum: 0
              description: "Seconds to wait: 300"
        "503":
          description: >-
            Baylee Central or the gateway's database is unavailable while an admin lease is
            checked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/terms:
    get:
      summary: The terms of use in force
      description: |-
        The terms in force, where they came from, and whether
        Baylee Central holds them (until it does, they are shown and not
        enforced); `{"terms": null}` for a gateway without terms.
      operationId: current
      tags:
      - Admin
      security:
      - adminToken: []
      servers:
      - url: http://127.0.0.1:28767
        description: The admin listener (loopback only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TermsInForce"
        "401":
          description: The bearer token is neither `BAYLEE_ADMIN_TOKEN` nor a live Central admin lease
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: >-
            A browser's request (`Origin`, `Sec-Fetch-Site` or `Sec-Fetch-Mode`) or a
            `Host` that is not this machine, refused before the token is read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: >-
            Ten wrong tokens in five minutes, or 600 requests in a minute; the right token
            is refused too until the window passes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          headers:
            Retry-After:
              schema:
                type: integer
                format: int64
                minimum: 0
              description: "Seconds to wait: 300"
        "503":
          description: >-
            Baylee Central or the gateway's database is unavailable while an admin lease is
            checked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    post:
      summary: Publish a new version of the terms of use
      description: |-
        Publishes a new version and puts it in force; it goes to
        Baylee Central at once, and every player is asked to accept it. A
        published version never changes: a changed text needs a new version.
      operationId: publish
      tags:
      - Admin
      parameters:
      - name: X-Baylee-Admin
        in: header
        required: true
        description: >-
          The acting admin's name, for the audit line and the version's `published_by`;
          ignored when the bearer is a Central admin lease, whose account acts
        schema:
          type: string
          pattern: ^[\w.-]{1,64}$
      security:
      - adminToken: []
      servers:
      - url: http://127.0.0.1:28767
        description: The admin listener (loopback only)
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishBody"
        required: true
      responses:
        "201":
          description: Published and in force, as `GET /admin/terms` answers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TermsInForce"
        "400":
          description: >-
            No valid `X-Baylee-Admin`, not terms to publish (an unknown field included), or
            texts or a version outside the bounds; the sentence says which
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: The bearer token is neither `BAYLEE_ADMIN_TOKEN` nor a live Central admin lease
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: >-
            A browser's request (`Origin`, `Sec-Fetch-Site` or `Sec-Fetch-Mode`) or a
            `Host` that is not this machine, refused before the token is read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: The version was published before, or is the one in force
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "413":
          description: The body is over 16 KiB
        "429":
          description: >-
            Ten wrong tokens in five minutes, or 600 requests in a minute; the right token
            is refused too until the window passes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          headers:
