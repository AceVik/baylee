          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  "/admin/accounts/{id}/ban":
    put:
      summary: Ban an account
      description: |-
        Bans an account, registered or guest, for good or until a
        moment, replacing any ban it had. It leaves every room and game, its
        sockets close and its chair tickets are spent; a registered account's
        sessions are signed out, and its admission from Baylee Central is
        refused. A guest keeps its session, which is refused with the reason
        while the ban holds.
      operationId: ban
      tags:
      - Admin
      parameters:
      - name: X-Baylee-Admin
        in: header
        required: true
        description: >-
          The acting admin's name, for the audit line and the ban's `by`; ignored when
          the bearer is a Central admin lease, whose account acts
        schema:
          type: string
          pattern: ^[\w.-]{1,64}$
      - name: id
        in: path
        required: true
        description: The account's id
        schema:
          type: string
          format: uuid
      security:
      - adminToken: []
      servers:
      - url: http://127.0.0.1:28767
        description: The admin listener (loopback only)
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BanOrder"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountBanned"
        "400":
          description: >-
            No valid `X-Baylee-Admin`, an id that is not a UUID, not a ban (an unknown
            field included), no reason or one over 500 characters or of two lines, or an `until`
            that is not RFC 3339 or has passed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: The bearer token is neither `BAYLEE_ADMIN_TOKEN` nor a live Central admin lease
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: >-
            A browser's request (`Origin`, `Sec-Fetch-Site` or `Sec-Fetch-Mode`) or a
            `Host` that is not this machine, refused before the token is read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: No such account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "413":
          description: The body is over 16 KiB
        "429":
          description: >-
            Ten wrong tokens in five minutes, or 600 requests in a minute; the right token
            is refused too until the window passes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          headers:
            Retry-After:
              schema:
                type: integer
                format: int64
                minimum: 0
              description: "Seconds to wait: 300"
        "503":
          description: >-
            The gateway's database is unavailable (or Baylee Central, while an admin lease
            is checked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    delete:
      summary: Lift an account's ban
      description: |-
        Lifts the ban on an account; one whose end has passed
        counts as none.
      operationId: unban
      tags:
      - Admin
      parameters:
      - name: X-Baylee-Admin
        in: header
        required: true
        description: >-
          The acting admin's name, for the audit line; ignored when the bearer is a
          Central admin lease, whose account acts
        schema:
          type: string
          pattern: ^[\w.-]{1,64}$
      - name: id
        in: path
        required: true
        description: The account's id
        schema:
          type: string
          format: uuid
      security:
      - adminToken: []
      servers:
      - url: http://127.0.0.1:28767
        description: The admin listener (loopback only)
      responses:
        "204":
          description: Lifted
        "400":
          description: No valid `X-Baylee-Admin`, or an id that is not a UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: The bearer token is neither `BAYLEE_ADMIN_TOKEN` nor a live Central admin lease
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: >-
            A browser's request (`Origin`, `Sec-Fetch-Site` or `Sec-Fetch-Mode`) or a
            `Host` that is not this machine, refused before the token is read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: No banned account by that id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: >-
            Ten wrong tokens in five minutes, or 600 requests in a minute; the right token
            is refused too until the window passes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          headers:
            Retry-After:
              schema:
                type: integer
                format: int64
                minimum: 0
              description: "Seconds to wait: 300"
        "503":
          description: >-
            The gateway's database is unavailable (or Baylee Central, while an admin lease
            is checked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  "/admin/games/{id}/close":
    post:
      summary: End a running game
      description: |-
        Ends a running game the way games end, through its
        engine: every seat is told why, nobody wins or loses, and the record
        ends there. An engine that has not ended it after 10 seconds, or a game
        with no engine attached, is ended by the gateway itself.
      operationId: close_game
      tags:
      - Admin
      parameters:
      - name: X-Baylee-Admin
        in: header
        required: true
        description: >-
          The acting admin's name, for the audit line; ignored when the bearer is a
          Central admin lease, whose account acts
        schema:
          type: string
          pattern: ^[\w.-]{1,64}$
      - name: id
        in: path
        required: true
        description: The game's id
        schema:
          type: string
      security:
      - adminToken: []
      servers:
      - url: http://127.0.0.1:28767
        description: The admin listener (loopback only)
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloseOrder"
        required: true
      responses:
        "202":
          description: The engine was told, or the game ended
        "400":
          description: >-
            No valid `X-Baylee-Admin`, not a reason to close (an unknown field included),
            or no reason, one over 200 characters or of two lines
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: The bearer token is neither `BAYLEE_ADMIN_TOKEN` nor a live Central admin lease
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: >-
            A browser's request (`Origin`, `Sec-Fetch-Site` or `Sec-Fetch-Mode`) or a
            `Host` that is not this machine, refused before the token is read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: No such table
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: The table is not being played
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "413":
          description: The body is over 16 KiB
        "429":
          description: >-
