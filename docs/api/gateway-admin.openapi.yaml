components:
  securitySchemes:
    adminToken:
      type: http
      scheme: bearer
      description: "`BAYLEE_ADMIN_TOKEN`, on the admin listener only. A change also names its admin in `X-Baylee-Admin`."
  schemas:
    AccessAdded:
      type: object
      properties:
        added:
          type: integer
          format: int64
          minimum: 0
          description: How many of the accounts were not on the list already.
      required:
      - added
      allOf:
      - $ref: "#/components/schemas/ProfileAccessDetail"
      description: "`POST /admin/llm/access/{id}/allow`."
    AccessRemoved:
      type: object
      properties:
        removed:
          type: integer
          format: int64
          minimum: 0
          description: How many of the accounts were on the list.
      required:
      - removed
      allOf:
      - $ref: "#/components/schemas/ProfileAccessDetail"
      description: "`POST /admin/llm/access/{id}/disallow`."
    AccountBanned:
      type: object
      properties:
        ban:
          $ref: "#/components/schemas/BanBody"
          description: The ban now in force.
      required:
      - ban
      description: "`PUT /admin/accounts/{id}/ban`."
    AccountTable:
      type: object
      properties:
        id:
          type: string
          description: The game's id.
        name:
          type: string
          description: The room's name.
        state:
          type: string
          description: Whether it is waiting for players or being played.
          enum:
          - waiting
          - playing
      required:
      - id
      - name
      - state
      description: The table an account sits at.
    AccountsBody:
      type: object
      properties:
        accounts:
          type: array
          items:
            type: string
            format: uuid
          description: Account ids, 1 to 200; an id named twice counts once.
          minItems: 1
          maxItems: 200
      required:
      - accounts
      additionalProperties: false
      description: What `…/allow` and `…/disallow` take.
    AllowedAccount:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The account's id.
        username:
          type:
          - string
          - "null"
          description: Its username, or `null`.
        display_name:
          type: string
          description: What other players see.
        handle:
          type: string
          description: Its handle, `Name#tag`.
        added_at:
          type: string
          description: When it was put on the list, RFC 3339 in UTC.
          format: date-time
        added_by:
          type: string
          description: The admin who put it there.
      required:
      - id
      - username
      - display_name
      - handle
      - added_at
      - added_by
      description: An account on a profile's list.
    AuthMode:
      type: string
      enum:
      - guests
      - central
      - mixed
      description: "Who this gateway lets in: `guests` (guests only), `central` (Baylee Central's accounts only, the default) or `mixed` (both)."
    BanBody:
      type: object
      properties:
        reason:
          type: string
          description: Why, in the moderator's words.
        until:
          type:
          - string
          - "null"
          description: When it ends, an RFC 3339 moment in UTC; `null` for good.
          format: date-time
      required:
      - reason
      - until
      description: "How a ban reads on a refusal: `{\"reason\", \"until\"}`, `until` an RFC 3339 moment in UTC or `null` for good."
    BanOrder:
      type: object
      properties:
        reason:
          type: string
          description: "Why, in the admin's words, which the player is shown: 1 to 500 characters after trimming, one line."
        until:
          type:
          - string
          - "null"
          description: When the ban ends, an RFC 3339 moment in the future; absent or `null` for good.
          format: date-time
      required:
      - reason
      additionalProperties: false
      description: What `PUT /admin/accounts/{id}/ban` takes.
    BlockBody:
      type: object
      properties:
        index:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
          description: The card's `CardIndex`; a card of this build's pool.
        reason:
          type: string
          description: "Why, which the players are told: 1 to 200 characters after trimming, one line."
        until:
          type:
          - string
          - "null"
          description: >-
            When the block ends, RFC 3339, in the future and at most ten years ahead;
            absent or `null` for a block without an end.
          format: date-time
      required:
      - index
      - reason
      additionalProperties: false
      description: What `POST /admin/cards/blocks` reads.
    BlockInForce:
      type: object
      properties:
        index:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
          description: The card's `CardIndex`.
        name:
          type: string
          description: The card's English name.
        reason:
          type: string
          description: Why, in the admin's words, which the players are told.
        until:
          type:
          - string
          - "null"
          description: When it ends by itself, RFC 3339 in UTC; `null` for never.
          format: date-time
      required:
      - index
      - name
      - reason
      - until
      description: A block in force, as a player is told it.
    Build:
      type: object
      properties:
        version:
          type: string
          description: The release, e.g. `0.1.0-beta.8a`.
        commit:
          type: string
          description: The commit it was built from.
        build:
          type: string
          description: The build's number.
        built_at:
          type: string
          description: When it was built.
        dirty:
          type: boolean
          description: Whether the tree it was built from had changes the commit does not hold.
      required:
      - version
      - commit
      - build
      - built_at
      - dirty
      description: "Which binary answers: the same five fields in `/source`, `/info` and `/health`."
    ChooseBody:
      type: object
      properties:
        mode:
          $ref: "#/components/schemas/AuthMode"
          description: The mode to put in force.
      required:
      - mode
      additionalProperties: false
      description: What `PUT /admin/auth-mode` takes.
    CloseOrder:
      type: object
      properties:
        reason:
          type: string
          description: "Why, in the admin's words, which the players are shown: 1 to 200 characters after trimming, one line."
      required:
      - reason
      additionalProperties: false
      description: What `POST /admin/games/{id}/close` takes.
    ConsoleAccount:
      type: object
      properties:
        handle:
          type: string
          description: Its handle, `Name#tag`.
        in_lobby:
          type: boolean
          description: Whether a lobby socket of it is open.
        playing:
          type: boolean
          description: Whether it sits in a running game.
        online:
          type: boolean
          description: Whether it has a lobby socket open or a chair at a table.
      required:
      - handle
      - in_lobby
      - playing
      - online
      allOf:
      - $ref: "#/components/schemas/ConsoleAccountRow"
      description: One account as the console lists it.
    ConsoleAccountCounts:
      type: object
      properties:
        registered:
          type: integer
          format: int64
          description: Accounts that are not guests.
        with_email:
          type: integer
          format: int64
          description: Of those, the ones with an e-mail address.
        confirmed_email:
          type: integer
          format: int64
          description: Of those, the ones whose address was confirmed.
        admitted_by_key:
          type: integer
          format: int64
          description: Registered accounts a closed-beta key let in, that still exist.
        created:
          $ref: "#/components/schemas/ConsoleSince"
          description: Registered accounts made in each window that still exist.
        decks:
          type: integer
          format: int64
          description: Players' own decks.
      required:
      - registered
      - with_email
      - confirmed_email
      - admitted_by_key
      - created
      - decks
      description: "`GET /admin/stats`'s registered accounts."
    ConsoleAccountDetail:
      type: object
      properties:
        handle:
          type: string
          description: Its handle, `Name#tag`.
        in_lobby:
          type: boolean
          description: Whether a lobby socket of it is open.
        table:
          anyOf:
          - $ref: "#/components/schemas/AccountTable"
          - type: "null"
          description: The table it sits at, or `null`.
        online:
          type: boolean
          description: Whether it has a lobby socket open or sits at a table.
      required:
      - handle
      - in_lobby
      - table
      - online
      allOf:
      - $ref: "#/components/schemas/ConsoleDetail"
      description: "`GET /admin/accounts/{id}`."
    ConsoleAccountRow:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The account's id.
        username:
          type:
          - string
          - "null"
          description: Its username, the name it signs in with; `null` for a guest, which has none.
        display_name:
          type: string
          description: The name other players see.
        tag:
          type: integer
          format: int32
          description: >-
            The number that tells two accounts of one name apart, shown in hex in its
            handle (`Alice#af03`).
        guest:
          type: boolean
          description: Whether it is a guest.
        created_at:
          type: string
          description: When it was made, RFC 3339 in UTC.
          format: date-time
        has_email:
          type: boolean
          description: Whether it has an e-mail address (never the address).
        confirmed:
          type: boolean
          description: Whether that address was confirmed.
        lang:
          type: string
          description: The language code it registered in.
        by_key:
          type: boolean
          description: Whether a closed-beta key admitted it.
        key_note:
          type:
          - string
          - "null"
          description: >-
            The note of the key that admitted it; `null` when no key did, or the key is
            gone or has no note.
        terms_version:
          type:
          - string
          - "null"
          description: The version of the terms it last accepted, `null` for none.
        decks:
          type: integer
          format: int64
          description: How many decks it has.
        games:
          type: integer
          format: int64
          description: How many recorded games it sat in.
        sessions:
          type: integer
          format: int64
          description: How many of its sessions have not lapsed.
        active_at:
          type:
          - string
          - "null"
          description: "When its latest live session was last renewed, RFC 3339 in UTC: it was active then, or up to a renewal interval (6 hours, a guest's a day) later. `null` without a live session."
          format: date-time
        reset_pending:
          type: boolean
          description: Whether an admin reset its password and it has not chosen its own yet.
        ban:
          anyOf:
          - $ref: "#/components/schemas/ConsoleBan"
          - type: "null"
          description: The ban in force on it, `null` when none is (a lapsed ban is none).
      required:
      - id
      - username
      - display_name
      - tag
      - guest
      - created_at
      - has_email
      - confirmed
      - lang
      - by_key
      - key_note
      - terms_version
      - decks
      - games
      - sessions
      - active_at
      - reset_pending
      - ban
      description: "One account as the admin console lists it: never a password, a token, an e-mail address or a deck's cards."
    ConsoleAccounts:
      type: object
      properties:
        total:
          type: integer
          format: int64
          description: How many accounts match, over every page.
        online:
          type: integer
          format: int64
          minimum: 0
          description: How many accounts are online now, matching or not.
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/ConsoleAccount"
          description: This page of them.
      required:
      - total
      - online
      - accounts
      description: "`GET /admin/accounts`."
    ConsoleAgentCounts:
      type: object
      properties:
        connected:
          type: integer
          format: int64
          minimum: 0
          description: Engine agents connected now.
        local:
          type: integer
          format: int64
          minimum: 0
          description: Of those, the ones on this machine's unix socket.
        capacity:
          type:
          - integer
          - "null"
          format: int64
          minimum: 0
          description: How many games they may run together; `null` when one of them has no bound.
        games:
          type: integer
          format: int64
          minimum: 0
          description: The games they were asked to run.
      required:
      - connected
      - local
      - capacity
      - games
      description: "`GET /admin/stats`'s engine agents."
    ConsoleAuthMode:
      type: object
      properties:
        mode:
          $ref: "#/components/schemas/AuthMode"
          description: The mode in force.
        source:
          type: string
          description: "Where it comes from: the operator's `BAYLEE_AUTH_MODE`, which the console cannot change, an admin's choice here, or the default, `central`."
          enum:
          - environment
          - console
          - default
        set_at:
          type:
          - string
          - "null"
          description: When an admin chose it, `null` unless `source` is `console`.
        set_by:
          type:
          - string
          - "null"
          description: "Who chose it: the console's admin name or a Central account's id, `null` unless `source` is `console`."
        connected:
          type: boolean
          description: >-
            Whether the gateway is connected to Baylee Central, which is how a Central
            sign-in reaches it. Unconnected and on `central`, it lets nobody in.
      required:
      - mode
      - source
      - set_at
      - set_by
      - connected
      description: "`GET /admin/auth-mode` and `PUT /admin/auth-mode`."
    ConsoleBan:
      type: object
      properties:
        reason:
          type: string
          description: Why, in the admin's words, which its player is shown.
        until:
          type:
          - string
          - "null"
          description: When it ends, RFC 3339 in UTC; `null` for a ban for good.
          format: date-time
        at:
          type: string
          description: Since when, RFC 3339 in UTC.
          format: date-time
        by:
          type: string
          description: The admin who banned it.
      required:
      - reason
      - until
      - at
      - by
      description: A ban in force on an account.
    ConsoleCentral:
      type: object
      properties:
        source:
          type: string
          description: "Where the link comes from: the operator's file (`BAYLEE_CENTRAL_CONFIG_FILE`, which the console cannot change), a token pasted here, or none."
          enum:
          - file
          - token
          - none
        token:
          anyOf:
          - $ref: "#/components/schemas/ConsoleToken"
          - type: "null"
          description: >-
            The pasted token, never more of it than its last four characters; `null` unless
            `source` is `token`.
        central:
          anyOf:
          - $ref: "#/components/schemas/ConsoleStatus"
          - type: "null"
          description: >-
            What Baylee Central says about the token now; `null` unless `source` is `token`
            and Central answered.
        check:
          type:
          - string
          - "null"
          description: "How asking Central went: `ok`, `rejected` (it does not know the token, or it was revoked or has expired: make a new one on the website) or `unavailable`; `null` when nothing was asked."
          enum:
          - ok
          - rejected
          - unavailable
          - null
      required:
      - source
      - token
      - central
      - check
      description: "`GET /admin/central` and the answer of a change."
    ConsoleChair:
      type: object
      properties:
        seat:
          type: integer
          format: int32
          description: The chair's seat number.
        player:
          type:
          - string
          - "null"
          description: >-
            Who sat there, by handle (`Alice#af03`); `null` for a chair no account held
            (the house's) or whose account is gone.
        guest:
          type:
          - boolean
          - "null"
          description: Whether that account is a guest; `null` when `player` is.
      required:
      - seat
      description: One chair of a recorded game.
    ConsoleDay:
      type: object
      properties:
        day:
          type: string
          description: The day, `YYYY-MM-DD` in UTC.
          format: date
        registered:
          type: integer
          format: int64
          description: Registered accounts made that day that still exist.
        guests:
          type: integer
          format: int64
          description: Guests made that day that still exist.
        started:
          type: integer
          format: int64
          description: Recorded games started that day.
        finished:
          type: integer
          format: int64
          description: Recorded games finished that day.
        players:
          type: integer
          format: int64
          description: Accounts that sat in a game started that day.
      required:
      - day
      - registered
      - guests
      - started
      - finished
      - players
      description: One UTC day of the admin console's statistics.
    ConsoleDeck:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: The deck's id.
        name:
          type: string
          description: Its name.
        format:
          type: string
          description: Its format (`commander`, `freeform`, …).
        cards:
          type: integer
          format: int64
          description: "How many cards its main deck holds: each line's count (`40 Forest`), a line without one counting once."
        version:
          type: integer
          format: int32
          description: "Its version: how many versions it has had."
        updated_at:
          type: string
          description: When it last changed, RFC 3339 in UTC.
          format: date-time
      required:
      - id
      - name
      - format
      - cards
      - version
      - updated_at
      description: One of an account's decks, without its cards.
    ConsoleDetail:
      type: object
      properties:
        terms_accepted_at:
          type:
          - string
          - "null"
          description: When it last accepted the terms, RFC 3339 in UTC; `null` if it never did.
          format: date-time
        confirmed_at:
          type:
          - string
          - "null"
          description: When its e-mail address was confirmed, RFC 3339 in UTC; `null` when it was not.
          format: date-time
        deck_list:
          type: array
          items:
            $ref: "#/components/schemas/ConsoleDeck"
          description: Its decks, the latest changed first.
        recent_games:
          type: array
          items:
            $ref: "#/components/schemas/ConsoleGame"
          description: Its latest 25 recorded games, newest first.
      required:
      - terms_accepted_at
      - confirmed_at
      - deck_list
      - recent_games
      allOf:
      - $ref: "#/components/schemas/ConsoleAccountRow"
      description: "One account in full: its row as the console lists it, its decks and its latest games."
    ConsoleGame:
      type: object
      properties:
        game_id:
          type: string
          description: The game's id.
        started_at:
          type: string
          description: When it started, RFC 3339 in UTC.
          format: date-time
        ended_at:
          type:
          - string
          - "null"
          description: When its record ended, RFC 3339 in UTC; `null` while it has not.
          format: date-time
        complete:
          type: boolean
          description: Whether its record is complete.
        seat:
          type: integer
          format: int32
          description: The seat number of the account's chair.
        chairs:
          type: array
          items:
            $ref: "#/components/schemas/ConsoleChair"
          description: Every chair, in seat order.
      required:
      - game_id
      - started_at
      - ended_at
      - complete
      - seat
      - chairs
      description: One recorded game an account sat in.
    ConsoleGameCounts:
      type: object
      properties:
        running:
          type: integer
          format: int64
          minimum: 0
          description: Games being played (as `/health` counts them).
        local_running:
          type: integer
          format: int64
          minimum: 0
          description: Of those, games whose engine runs on this machine.
        waiting:
          type: integer
          format: int64
          minimum: 0
          description: Rooms waiting for players.
        seats_awaiting_engine:
          type: integer
          format: int64
          minimum: 0
          description: Seats of running games whose engine has not dialled back yet.
        recorded:
          type: integer
          format: int64
          description: "Games with a record: every hosted game whose engine sent the first piece of it."
        started:
          $ref: "#/components/schemas/ConsoleSince"
          description: Recorded games started in each window.
        finished:
          type: integer
          format: int64
          description: Recorded games whose record is complete.
        finished_since:
          $ref: "#/components/schemas/ConsoleSince"
          description: Of those, the ones finished in each window.
        record_bytes:
          type: integer
          format: int64
          description: The bytes every record holds together.
        avg_secs_30d:
          type: integer
          format: int64
          description: >-
            The mean length in seconds of the games finished in the last 30 days; `0` for
            none.
      required:
      - running
      - local_running
      - waiting
      - seats_awaiting_engine
      - recorded
      - started
      - finished
      - finished_since
      - record_bytes
      - avg_secs_30d
      description: "`GET /admin/stats`'s games."
    ConsoleGateway:
      type: object
      properties:
        name:
          type:
          - string
          - "null"
          description: The name it shows (`BAYLEE_GATEWAY_NAME`), `null` for none.
        registration:
          $ref: "#/components/schemas/Registration"
          description: Who may make an account.
        uptime_secs:
          type: integer
          format: int64
          minimum: 0
          description: Seconds this process has served.
        terms:
          type: boolean
          description: Whether it has terms of use.
        central:
          type: boolean
          description: >-
            Whether it is connected to Baylee Central (`BAYLEE_CENTRAL_CONFIG_FILE`), which
            is how a Central sign-in reaches it.
        auth_mode:
          $ref: "#/components/schemas/AuthMode"
          description: "Who comes in: guests, Baylee Central's accounts, or both (`GET /admin/auth-mode`)."
        auth_mode_source:
          type: string
          description: "Where that comes from: the operator's `BAYLEE_AUTH_MODE`, an admin's choice, or the default."
          enum:
          - environment
          - console
          - default
      required:
      - name
      - registration
      - uptime_secs
      - terms
      - central
      - auth_mode
      - auth_mode_source
      allOf:
      - $ref: "#/components/schemas/Build"
      description: "`GET /admin/stats`'s gateway."
    ConsoleGuestCounts:
      type: object
      properties:
        enabled:
          type: boolean
          description: Whether guests are let in (the auth mode is `guests` or `mixed`).
        live:
          type: integer
          format: int64
          description: Guest accounts now, each one a live session leads to until the next sweep.
        cap:
          type:
          - integer
          - "null"
          format: int64
          minimum: 0
          description: How many guests may be live at once (`BAYLEE_GUEST_CAP`); `null` for no cap.
        created:
          $ref: "#/components/schemas/ConsoleSince"
          description: Guests made in each window that still exist.
      required:
      - enabled
      - live
      - cap
      - created
      description: "`GET /admin/stats`'s guests."
    ConsoleInviteCounts:
      type: object
      properties:
        total:
          type: integer
          format: int64
          description: Keys ever made.
        active:
          type: integer
          format: int64
          description: "Keys that admit somebody now: not revoked, not expired, a use left."
        used_up:
          type: integer
          format: int64
          description: Keys not revoked and not expired, with no use left.
        expired:
          type: integer
          format: int64
          description: Keys not revoked whose expiry has passed.
        revoked:
          type: integer
          format: int64
          description: Keys revoked.
        uses_left:
          type: integer
          format: int64
          description: The uses the active keys have left, together.
        admitted:
          type: integer
          format: int64
          description: The existing accounts a key let in.
      required:
      - total
      - active
      - used_up
      - expired
      - revoked
      - uses_left
      - admitted
      description: "`GET /admin/stats`'s closed-beta keys."
    ConsoleLive:
      type: object
      properties:
        at:
          type: string
          description: When it was read, RFC 3339 in UTC.
          format: date-time
        players:
          type: array
          items:
            $ref: "#/components/schemas/LivePlayer"
          description: Every account with a lobby socket open or a chair at a waiting or running table.
        tables:
          type: array
          items:
            $ref: "#/components/schemas/LiveTable"
          description: The waiting rooms first, then the running games, newest first.
        agents:
          type: array
          items:
            $ref: "#/components/schemas/LiveAgent"
          description: The engine agents connected now, by id.
      required:
      - at
      - players
      - tables
      - agents
      description: "`GET /admin/live`."
    ConsoleOnline:
      type: object
      properties:
        players:
          type: integer
          format: int64
          minimum: 0
          description: >-
            Accounts with a lobby socket open or a chair at a running game (`GET
            /lobby/stats`'s `players_online`).
        in_lobby:
          type: integer
          format: int64
          minimum: 0
          description: Accounts with a lobby socket open.
        seated:
          type: integer
          format: int64
          minimum: 0
          description: Accounts in a chair of a running game.
        sessions_live:
          type: integer
          format: int64
          description: "Sessions that have not lapsed, which is not presence: a guest's lasts 30 days."
        accounts_signed_in:
          type: integer
          format: int64
          description: Accounts with at least one such session.
      required:
      - players
      - in_lobby
      - seated
      - sessions_live
      - accounts_signed_in
      description: "`GET /admin/stats`'s presence."
    ConsoleSet:
      type: object
      properties:
        cards:
          type: array
          items:
            $ref: "#/components/schemas/SetCard"
          description: The set's cards, in ledger order.
      required:
      - cards
      allOf:
      - $ref: "#/components/schemas/SetProgress"
      description: "`GET /admin/sets/{code}`."
    ConsoleSets:
      type: object
      properties:
        at:
          type: string
          description: When it was read, RFC 3339 in UTC.
          format: date-time
        version:
          type: string
          description: The release this build is.
        corpus:
          type: integer
          format: int64
          minimum: 0
          description: "The cards of the corpus: every row of the ledger."
        pool:
          $ref: "#/components/schemas/PoolTotals"
          description: The pool this build plays, over every set.
        sets:
          type: array
          items:
            $ref: "#/components/schemas/SetProgress"
          description: >-
            Every set, in the ledger's order (release order by first printing); a set
            counts the cards first printed in it.
      required:
      - at
      - version
      - corpus
      - pool
      - sets
      description: "`GET /admin/sets`."
    ConsoleSince:
      type: object
      properties:
        today_utc:
          type: integer
          format: int64
          description: Since midnight UTC today.
        last_7d:
          type: integer
          format: int64
          description: In the last 7 × 24 hours.
        last_30d:
          type: integer
          format: int64
          description: In the last 30 × 24 hours.
      required:
      - today_utc
      - last_7d
      - last_30d
      description: How many of something there were since three moments.
    ConsoleStats:
      type: object
      properties:
        at:
          type: string
          description: When the counts were taken, RFC 3339 in UTC.
          format: date-time
        gateway:
          $ref: "#/components/schemas/ConsoleGateway"
          description: This gateway and its build.
        accounts:
          $ref: "#/components/schemas/ConsoleAccountCounts"
          description: Registered accounts.
        guests:
          $ref: "#/components/schemas/ConsoleGuestCounts"
          description: Guest accounts.
        online:
          $ref: "#/components/schemas/ConsoleOnline"
          description: Who is online now.
        games:
          $ref: "#/components/schemas/ConsoleGameCounts"
          description: Games, in the lobby now and as recorded.
        agents:
          $ref: "#/components/schemas/ConsoleAgentCounts"
          description: The engine agents connected now.
        social:
          description: "Friends and chat: `devices`, `friendships`, `groups`, `pending_slots` and `sockets`, all counts; `null` when the gateway has none or its counts could not be read."
          type:
          - object
          - "null"
          properties:
            devices:
              type: integer
            friendships:
              type: integer
            groups:
              type: integer
            pending_slots:
              type: integer
            sockets:
              type: integer
        invites:
          $ref: "#/components/schemas/ConsoleInviteCounts"
          description: The closed-beta keys.
        daily:
          type: array
          items:
            $ref: "#/components/schemas/ConsoleDay"
          description: The last 30 UTC days, oldest first, today last.
      required:
      - at
      - gateway
      - accounts
      - guests
      - online
      - games
      - agents
      - social
      - invites
      - daily
      description: "`GET /admin/stats`."
    ConsoleStatus:
      type: object
      properties:
        gateway:
          type: string
          description: The gateway's id at Central.
        origin:
          type: string
          description: Its origin, the audience of its players' tickets.
        name:
          type: string
          description: The name Central lists it under.
        state:
          type: string
          description: >-
            Whether an administrator of Central approved it; only an approved gateway is
            listed and signs players in.
          enum:
          - pending
          - approved
          - disabled
        sso:
          type: boolean
          description: The token signs this gateway's players in.
        listing:
          type: boolean
          description: The token keeps this gateway's directory entry.
        expires_at:
          type: string
          description: When the token stops working.
      required:
      - gateway
      - origin
      - name
      - state
      - sso
      - listing
      - expires_at
      description: What Baylee Central says about the token.
    ConsoleTerms:
      type: object
      properties:
        version:
          type: string
          description: What an account accepts.
        digest:
          type: string
          description: "Baylee Central's digest of every text, in lowercase hex: what an acceptance names beside the version."
        source:
          type: string
          description: "Where they came from: an admin published them, a file (`BAYLEE_TERMS_PATH`) named them, or they are the default every gateway ships."
          enum:
          - published
          - file
          - default
        at_central:
          type: boolean
          description: >-
            Whether Baylee Central holds them; until it does, they are shown and not
            enforced.
        texts:
          type: array
          items:
            $ref: "#/components/schemas/ConsoleTermsText"
          description: One text per language (`en` for a single file).
      required:
      - version
      - digest
      - source
      - at_central
      - texts
      description: The terms in force, as the console shows them.
    ConsoleTermsText:
      type: object
      properties:
        lang:
          type: string
          description: Its primary language tag, lowercase (`de`, `en`).
        updated:
          type:
          - string
          - "null"
          description: The date it names as its last change, or `null`.
        markdown:
          type: string
          description: The text, in Markdown.
      required:
      - lang
      - updated
      - markdown
      description: The terms in one language.
    ConsoleToken:
      type: object
      properties:
        last4:
          type: string
          description: Its last four characters.
        set_at:
          type: string
          description: When it was pasted.
        set_by:
          type: string
          description: "Who pasted it: the console's admin name, or a Central account's id."
      required:
      - last4
      - set_at
      - set_by
      description: The pasted token, as the console shows it.
    CreateBody:
      type: object
      properties:
        uses:
          type:
          - integer
          - "null"
          format: int64
          description: How many accounts each key admits, 1 to 1000; 1 when absent.
          minimum: 1
          maximum: 1000
        expires:
          type:
          - string
          - "null"
          description: "How long the keys admit anybody, in days or hours, 1 to 3650 of them: `30d`, `12h`; for ever when absent."
          example: 30d
        note:
          type:
          - string
          - "null"
