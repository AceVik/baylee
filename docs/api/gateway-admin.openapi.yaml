openapi: "3.1.0"
info:
  title: Baylee gateway admin console
  version: 0.1.1-beta.9b
  description: "A gateway's admin console: counts, accounts, beta keys, card blocks, hosted models and the terms. It listens on its own loopback address only, never on the public port or the unix socket, and refuses a browser's request before it reads the token (`docs/protocol.md` §\"The admin console\")."
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
- url: http://127.0.0.1:28767
  description: The admin listener (`BAYLEE_ADMIN_BIND`, loopback only).
paths:
  /admin/stats:
    get:
      summary: How busy this gateway is, in counts
      description: |-
        Counts and sums only, no field naming a person: accounts,
        guests, who is online, games, engine agents, friends and chat, beta
        keys, and the last 30 UTC days.
      operationId: stats
      tags:
      - Admin
      security:
      - adminToken: []
      servers:
      - url: http://127.0.0.1:28767
        description: The admin listener (loopback only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsoleStats"
        "401":
          description: The bearer token is neither `BAYLEE_ADMIN_TOKEN` nor a live Central admin lease
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: >-
            A browser's request (`Origin`, `Sec-Fetch-Site` or `Sec-Fetch-Mode`) or a
            `Host` that is not this machine, refused before the token is read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: >-
            Ten wrong tokens in five minutes, or 600 requests in a minute; the right token
            is refused too until the window passes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          headers:
            Retry-After:
              schema:
                type: integer
                format: int64
                minimum: 0
              description: "Seconds to wait: 300"
        "503":
          description: >-
            The gateway's database is unavailable (or Baylee Central, while an admin lease
            is checked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/metrics:
    get:
      summary: The last hour of server samples
      description: |-
        What the machine is doing, sampled every 5 seconds into
        a ring of the last hour (720 samples) in memory: the host's CPU, load,
        memory, disk and network, this process's sockets and request rate, and
        the CPU and memory of each engine process on this machine. The host's
        fields are read off `/proc` and are `null` off Linux.
      operationId: metrics
      tags:
      - Admin
      security:
      - adminToken: []
      servers:
      - url: http://127.0.0.1:28767
        description: The admin listener (loopback only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsSnapshot"
        "401":
          description: The bearer token is neither `BAYLEE_ADMIN_TOKEN` nor a live Central admin lease
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: >-
            A browser's request (`Origin`, `Sec-Fetch-Site` or `Sec-Fetch-Mode`) or a
            `Host` that is not this machine, refused before the token is read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: >-
            Ten wrong tokens in five minutes, or 600 requests in a minute; the right token
            is refused too until the window passes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          headers:
            Retry-After:
              schema:
                type: integer
                format: int64
                minimum: 0
              description: "Seconds to wait: 300"
        "503":
          description: >-
            Baylee Central or the gateway's database is unavailable while an admin lease is
            checked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/sets:
    get:
      summary: How far the pool is through each set
      description: |-
        How far this build is through each set, in release order
        by first printing, from the ledger and the compiled pool; the numbers
        are whatever this binary was built with.
      operationId: sets
      tags:
      - Admin
      security:
      - adminToken: []
      servers:
      - url: http://127.0.0.1:28767
        description: The admin listener (loopback only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsoleSets"
        "401":
          description: The bearer token is neither `BAYLEE_ADMIN_TOKEN` nor a live Central admin lease
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: >-
            A browser's request (`Origin`, `Sec-Fetch-Site` or `Sec-Fetch-Mode`) or a
            `Host` that is not this machine, refused before the token is read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: >-
            Ten wrong tokens in five minutes, or 600 requests in a minute; the right token
            is refused too until the window passes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          headers:
            Retry-After:
              schema:
                type: integer
                format: int64
                minimum: 0
              description: "Seconds to wait: 300"
        "503":
          description: >-
            Baylee Central or the gateway's database is unavailable while an admin lease is
            checked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  "/admin/sets/{code}":
    get:
      summary: One set's cards
      description: |-
        One set's row as `GET /admin/sets` lists it, and its
        cards with how far each is. The gateway serves no card image here.
      operationId: one_set
      tags:
      - Admin
      parameters:
      - name: code
        in: path
        required: true
        description: Scryfall's set code, any case
        schema:
          type: string
      security:
      - adminToken: []
      servers:
      - url: http://127.0.0.1:28767
        description: The admin listener (loopback only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsoleSet"
        "400":
          description: "Not a set code: more than 8 characters, or not letters and digits"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: The bearer token is neither `BAYLEE_ADMIN_TOKEN` nor a live Central admin lease
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: >-
            A browser's request (`Origin`, `Sec-Fetch-Site` or `Sec-Fetch-Mode`) or a
            `Host` that is not this machine, refused before the token is read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: No such set in the ledger
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: >-
            Ten wrong tokens in five minutes, or 600 requests in a minute; the right token
            is refused too until the window passes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          headers:
            Retry-After:
              schema:
                type: integer
                format: int64
                minimum: 0
              description: "Seconds to wait: 300"
        "503":
          description: >-
            Baylee Central or the gateway's database is unavailable while an admin lease is
            checked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/live:
    get:
      summary: Who is here now, and at which table
      description: |-
        Every account with a lobby socket open or a chair at a
        table, by handle; the waiting rooms and then the running games, newest
        first, with their chairs; and the engine agents connected.
      operationId: live
      tags:
      - Admin
      security:
      - adminToken: []
      servers:
      - url: http://127.0.0.1:28767
        description: The admin listener (loopback only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsoleLive"
        "401":
          description: The bearer token is neither `BAYLEE_ADMIN_TOKEN` nor a live Central admin lease
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: >-
            A browser's request (`Origin`, `Sec-Fetch-Site` or `Sec-Fetch-Mode`) or a
            `Host` that is not this machine, refused before the token is read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: >-
            Ten wrong tokens in five minutes, or 600 requests in a minute; the right token
            is refused too until the window passes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          headers:
            Retry-After:
              schema:
                type: integer
                format: int64
                minimum: 0
              description: "Seconds to wait: 300"
        "503":
          description: >-
            The gateway's database is unavailable (or Baylee Central, while an admin lease
            is checked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/accounts:
    get:
      summary: A page of accounts
      description: |-
        A page of accounts, registered and guests, each with
        whether it is online now, and how many match in all. Never a password
        hash, a token or an e-mail address (only whether there is one).
      operationId: list_accounts
      tags:
      - Admin
      parameters:
      - name: q
        in: query
        required: false
        description: >-
          Part of a username or display name, a `#tag` in hex, or an account's id; at
          most 100 characters. Empty finds every account.
        schema:
          type: string
      - name: tag
        in: query
        required: false
        description: "Exactly one account by its tag: `af03`, `#af03` or a whole handle `Alice#af03` (the name is not checked); registered or guest. At most 100 characters."
        schema:
          type: string
      - name: kind
        in: query
        required: false
        description: "Which accounts: `all` (the default), `registered` or `guest`."
        schema:
          type: string
          enum:
          - all
          - registered
          - guest
      - name: sort
        in: query
        required: false
        description: "The order: `newest` (the default), `oldest`, `name`, `games` or `active`."
        schema:
          type: string
          enum:
          - newest
          - oldest
          - name
          - games
          - active
      - name: online
        in: query
        required: false
        description: Only accounts with a lobby socket open or a chair at a table.
        schema:
          type: boolean
      - name: offset
        in: query
        required: false
        description: How many accounts of the order to skip.
        schema:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
      - name: limit
        in: query
        required: false
        description: >-
          How many to answer, 1 to 200 (a number outside is taken as the nearest bound);
          50 when absent.
        schema:
          type: integer
          format: int64
          minimum: 1
          maximum: 200
      security:
      - adminToken: []
      servers:
      - url: http://127.0.0.1:28767
        description: The admin listener (loopback only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsoleAccounts"
        "400":
          description: >-
            A `kind`, `sort` or `tag` it does not know, or a search over 100 characters (a
            parameter of the wrong type is refused in plain text)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: The bearer token is neither `BAYLEE_ADMIN_TOKEN` nor a live Central admin lease
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: >-
            A browser's request (`Origin`, `Sec-Fetch-Site` or `Sec-Fetch-Mode`) or a
            `Host` that is not this machine, refused before the token is read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: >-
            Ten wrong tokens in five minutes, or 600 requests in a minute; the right token
            is refused too until the window passes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          headers:
            Retry-After:
              schema:
                type: integer
                format: int64
                minimum: 0
              description: "Seconds to wait: 300"
        "503":
          description: >-
            The gateway's database is unavailable (or Baylee Central, while an admin lease
            is checked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  "/admin/accounts/{id}":
    get:
      summary: One account, its decks and latest games
      description: |-
        The account's row as `GET /admin/accounts` lists it, the
        table it sits at, its decks (without their cards) and its latest 25
        games.
      operationId: one_account
      tags:
      - Admin
      parameters:
      - name: id
        in: path
        required: true
        description: The account's id
        schema:
          type: string
          format: uuid
      security:
      - adminToken: []
      servers:
      - url: http://127.0.0.1:28767
        description: The admin listener (loopback only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsoleAccountDetail"
        "400":
          description: The id is not a UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: The bearer token is neither `BAYLEE_ADMIN_TOKEN` nor a live Central admin lease
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: >-
            A browser's request (`Origin`, `Sec-Fetch-Site` or `Sec-Fetch-Mode`) or a
            `Host` that is not this machine, refused before the token is read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: No such account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: >-
            Ten wrong tokens in five minutes, or 600 requests in a minute; the right token
            is refused too until the window passes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          headers:
            Retry-After:
              schema:
                type: integer
                format: int64
                minimum: 0
              description: "Seconds to wait: 300"
        "503":
          description: >-
            The gateway's database is unavailable (or Baylee Central, while an admin lease
            is checked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    delete:
      summary: Delete an account
      description: |-
        Deletes an account, registered or guest, and everything
        it owns, exactly as the player's own `DELETE /account` does: its decks,
        sessions and settings, the pictures nobody else claims, its chairs and
        sockets.
      operationId: admin_delete_account
      tags:
      - Admin
      parameters:
      - name: X-Baylee-Admin
        in: header
        required: true
        description: >-
          The acting admin's name, for the audit line; ignored when the bearer is a
          Central admin lease, whose account acts
        schema:
          type: string
          pattern: ^[\w.-]{1,64}$
      - name: id
        in: path
        required: true
        description: The account's id
        schema:
          type: string
          format: uuid
      security:
      - adminToken: []
      servers:
      - url: http://127.0.0.1:28767
        description: The admin listener (loopback only)
      responses:
        "204":
          description: Deleted
        "400":
          description: No valid `X-Baylee-Admin`, or an id that is not a UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: The bearer token is neither `BAYLEE_ADMIN_TOKEN` nor a live Central admin lease
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: >-
            A browser's request (`Origin`, `Sec-Fetch-Site` or `Sec-Fetch-Mode`) or a
            `Host` that is not this machine, refused before the token is read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: No such account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: >-
            Ten wrong tokens in five minutes, or 600 requests in a minute; the right token
            is refused too until the window passes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          headers:
            Retry-After:
              schema:
                type: integer
                format: int64
                minimum: 0
              description: "Seconds to wait: 300"
        "503":
          description: >-
            The gateway's database is unavailable (or Baylee Central, while an admin lease
            is checked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/invites:
    get:
      summary: Every closed-beta key, never the keys
      description: |-
        Every key made, newest first, with what it can still do.
        Never a key: only its hash is stored, so no route can show one again.
      operationId: list_invites
      tags:
      - Admin
      security:
      - adminToken: []
      servers:
      - url: http://127.0.0.1:28767
        description: The admin listener (loopback only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ListedInvite"
        "401":
          description: The bearer token is neither `BAYLEE_ADMIN_TOKEN` nor a live Central admin lease
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: >-
            A browser's request (`Origin`, `Sec-Fetch-Site` or `Sec-Fetch-Mode`) or a
            `Host` that is not this machine, refused before the token is read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: >-
            Ten wrong tokens in five minutes, or 600 requests in a minute; the right token
            is refused too until the window passes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          headers:
            Retry-After:
              schema:
                type: integer
                format: int64
                minimum: 0
              description: "Seconds to wait: 300"
        "503":
          description: >-
            The gateway's database is unavailable (or Baylee Central, while an admin lease
            is checked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    post:
      summary: Make closed-beta keys
      description: |-
        Makes keys as `baylee-gateway invite create` does, in one
        transaction, and answers them: the one time they exist outside the hand
        they are given to.
      operationId: create_invites
      tags:
      - Admin
      parameters:
      - name: X-Baylee-Admin
        in: header
        required: true
        description: >-
          The acting admin's name, for the audit line; ignored when the bearer is a
          Central admin lease, whose account acts
        schema:
          type: string
          pattern: ^[\w.-]{1,64}$
      security:
      - adminToken: []
      servers:
      - url: http://127.0.0.1:28767
        description: The admin listener (loopback only)
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBody"
        required: true
      responses:
        "201":
          description: The keys, shown this once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MadeInvites"
        "400":
          description: >-
            No valid `X-Baylee-Admin`, not a request for keys (an unknown field included),
            or a value `invite create` refuses, in its words
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: The bearer token is neither `BAYLEE_ADMIN_TOKEN` nor a live Central admin lease
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: >-
            A browser's request (`Origin`, `Sec-Fetch-Site` or `Sec-Fetch-Mode`) or a
            `Host` that is not this machine, refused before the token is read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "413":
          description: The body is over 16 KiB
        "429":
          description: >-
            Ten wrong tokens in five minutes, or 600 requests in a minute; the right token
            is refused too until the window passes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          headers:
            Retry-After:
              schema:
                type: integer
                format: int64
                minimum: 0
              description: "Seconds to wait: 300"
        "503":
          description: >-
            The gateway's database is unavailable (or Baylee Central, while an admin lease
            is checked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  "/admin/invites/{id}":
    delete:
      summary: Revoke a closed-beta key
      description: |-
        Revokes a key as `baylee-gateway invite revoke` does; it
        admits nobody from now on and stays listed, revoked.
      operationId: revoke_invite
      tags:
      - Admin
      parameters:
      - name: X-Baylee-Admin
        in: header
        required: true
        description: >-
          The acting admin's name, for the audit line; ignored when the bearer is a
          Central admin lease, whose account acts
        schema:
          type: string
          pattern: ^[\w.-]{1,64}$
      - name: id
        in: path
        required: true
        description: The key's id
        schema:
          type: string
          format: uuid
      security:
      - adminToken: []
      servers:
      - url: http://127.0.0.1:28767
        description: The admin listener (loopback only)
      responses:
        "204":
          description: Revoked
        "400":
          description: No valid `X-Baylee-Admin`, or an id that is not a UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: The bearer token is neither `BAYLEE_ADMIN_TOKEN` nor a live Central admin lease
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: >-
            A browser's request (`Origin`, `Sec-Fetch-Site` or `Sec-Fetch-Mode`) or a
            `Host` that is not this machine, refused before the token is read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: No key by that id that is not revoked already
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: >-
            Ten wrong tokens in five minutes, or 600 requests in a minute; the right token
            is refused too until the window passes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          headers:
            Retry-After:
              schema:
                type: integer
                format: int64
                minimum: 0
              description: "Seconds to wait: 300"
        "503":
          description: >-
            The gateway's database is unavailable (or Baylee Central, while an admin lease
            is checked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/cards/search:
    get:
      summary: Find cards of the pool to block
      description: |-
        The pool's cards whose English name holds `q` (any case)
        or whose index is `q`, those starting with it first, then by name, at
        most 25; each with the block in force on it, if any.
      operationId: search_cards
      tags:
      - Admin
      parameters:
      - name: q
        in: query
        required: false
        description: >-
          Part of a card's English name (any case), or its index; at most 100 characters.
          Empty finds nothing.
        schema:
          type: string
      security:
      - adminToken: []
      servers:
      - url: http://127.0.0.1:28767
        description: The admin listener (loopback only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoundCards"
        "400":
          description: The search is over 100 characters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
