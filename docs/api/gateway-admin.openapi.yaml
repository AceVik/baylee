          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          headers:
            Retry-After:
              schema:
                type: integer
                format: int64
                minimum: 0
              description: "Seconds to wait: 300"
        "503":
          description: >-
