  "/admin/llm/seathosts/{host}/profiles/{id}/key":
    post:
      summary: Set or forget a hosted profile's key
      description: |-
        Write-only: the key goes to the seat agent, which keeps
        it in its key store, and nowhere else; no route answers it, only
        whether one is kept. Only for a seat agent on this machine's unix
        socket.
      operationId: llm_key
      tags:
      - Admin
      parameters:
      - name: X-Baylee-Admin
        in: header
        required: true
        description: >-
          The acting admin's name, for the audit line; ignored when the bearer is a
          Central admin lease, whose account acts
        schema:
          type: string
          pattern: ^[\w.-]{1,64}$
      - name: host
        in: path
        required: true
        description: "The seat agent's name: 1-64 of A-Z a-z 0-9 . - _"
        schema:
          type: string
      - name: id
        in: path
        required: true
        description: "The profile's id: 1-64 of A-Z a-z 0-9 . - _"
        schema:
          type: string
      security:
      - adminToken: []
      servers:
      - url: http://127.0.0.1:28767
        description: The admin listener (loopback only)
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeyBody"
        required: true
      responses:
        "204":
          description: Set, or forgotten
        "400":
          description: >-
            No valid `X-Baylee-Admin`, not a body with one `key`, an empty key, a name or
            id outside 1-64 of A-Z a-z 0-9 . - _, or the seat agent's refusal in its words
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: The bearer token is neither `BAYLEE_ADMIN_TOKEN` nor a live Central admin lease
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: >-
            A browser's request (`Origin`, `Sec-Fetch-Site` or `Sec-Fetch-Mode`) or a
            `Host` that is not this machine, refused before the token is read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: No such seat agent connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "413":
          description: The body is over 16 KiB
        "429":
          description: >-
            Ten wrong tokens in five minutes, or 600 requests in a minute; the right token
            is refused too until the window passes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          headers:
            Retry-After:
              schema:
                type: integer
                format: int64
                minimum: 0
              description: "Seconds to wait: 300"
        "503":
          description: >-
            The seat agent is not on this machine's unix socket (keys travel only over it),
