      - listed
      - updated_at
      - updated_by
      - connected
      - label
      - vendor
      description: Who may seat one hosted profile.
    ProfileAccessDetail:
      type: object
      properties:
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/AllowedAccount"
          description: The accounts on its list, by username.
      required:
      - accounts
      allOf:
      - $ref: "#/components/schemas/ProfileAccess"
      description: One profile's access with the accounts on its list.
    ProfileAccessList:
      type: object
      properties:
        profiles:
          type: array
          items:
            $ref: "#/components/schemas/ProfileAccess"
          description: Every profile a seat agent reports or a policy names, by id.
      required:
      - profiles
      description: "`GET /admin/llm/access`."
    ProfileWritten:
      type: object
      properties:
        ok:
          type: boolean
          description: "Always `true`: the seat agent wrote the definition."
      required:
      - ok
      description: "`PUT /admin/llm/seathosts/{host}/profiles/{id}`: written."
    PublishBody:
      type: object
      properties:
        version:
          type: string
          description: "A new version: printable ASCII without spaces, at most 64 characters, not `draft`, and never one published before or the one in force."
        texts:
          type: array
          items:
            $ref: "#/components/schemas/TextBody"
          description: One text per language, at most 4, `en` among them.
      required:
      - version
      - texts
      additionalProperties: false
      description: What `POST /admin/terms` takes.
    PublishedTerms:
      type: object
      properties:
        version:
          type: string
          description: The version.
        published_at:
          type: string
          description: When it was published, RFC 3339 in UTC.
          format: date-time
        published_by:
          type: string
          description: The admin who published it.
      required:
      - version
      - published_at
      - published_by
      description: A version of the terms an admin published.
    Registration:
      type: string
      enum:
      - open
      - invite
      - "off"
      description: "Who may make an account: `open` (anybody), `invite` (somebody with a beta key; a new guest needs one too) or `off`."
    SampleShown:
      type: object
      properties:
        at:
          type: integer
          format: int64
          minimum: 0
          description: When it was taken, in Unix seconds.
        cpu:
          type:
          - number
          - "null"
          format: double
          description: >-
            The share of all cores busy over the interval, 0 to 1; `null` on the first
            sample and off Linux.
        load1:
          type:
          - number
          - "null"
          format: double
          description: The 1-minute load average; `null` off Linux.
        mem_used:
          type:
          - integer
          - "null"
          format: int64
          minimum: 0
          description: Bytes of memory in use; `null` off Linux.
        disk_used:
          type:
          - integer
          - "null"
          format: int64
          minimum: 0
          description: Bytes in use on the disk.
        net_in:
          type:
          - number
          - "null"
          format: double
          description: >-
            Bytes a second received over every interface but loopback; `null` on the first
            sample and off Linux.
        net_out:
          type:
          - number
          - "null"
          format: double
          description: Bytes a second sent, likewise.
        sockets:
          type:
          - integer
          - "null"
          format: int64
          minimum: 0
          maximum: 4294967295
          description: This process's open sockets; `null` off Linux.
        requests:
          type: number
          format: double
          description: Requests a second on the public routes (the console's own are not counted).
        games:
          type: array
          items:
            $ref: "#/components/schemas/GameShown"
          description: The engine processes on this machine.
      required:
      - at
      - cpu
      - load1
      - mem_used
      - disk_used
      - net_in
      - net_out
      - sockets
      - requests
      - games
      description: One sample, as `GET /admin/metrics` shows it.
    SeatKind:
      type: string
      enum:
      - human
      - ai
      description: "What a chair is for: a person (`human`), once one takes it, or the house AI (`ai`), which fills it the moment it is configured."
    SetCard:
      type: object
      properties:
        index:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
          description: The card's `CardIndex`.
        name:
          type: string
          description: Its English name.
        coverage:
          type: string
          description: "How far this build plays it: `implemented`, `generated`, `partial`, `unimplemented`, or `absent` for a card it has nothing for."
          enum:
          - implemented
          - generated
          - partial
          - unimplemented
          - absent
        note:
          type:
          - string
          - "null"
          description: >-
            Why a partial card is only partly there, in its author's words; `null`
            otherwise.
        type_line:
          type: string
          description: Its printed type line; empty for an absent card.
        scryfall_id:
          type:
          - string
          - "null"
          description: >-
            The Scryfall id of the printing the pool card was built from, `null` for an
            absent card.
        oracle_id:
          type: string
          description: Its Scryfall oracle id.
      required:
      - index
      - name
      - coverage
      - note
      - type_line
      - scryfall_id
      - oracle_id
      description: One card of a set, as the drill-down lists it.
    SetProgress:
      type: object
      properties:
        code:
          type: string
          description: Scryfall's set code, lower case; empty for the pool as a whole.
        position:
          type: integer
          format: int64
          minimum: 0
          description: Where it falls in release order by first printing, from 0.
        total:
          type: integer
          format: int64
          minimum: 0
          description: Cards first printed in this set.
        implemented:
          type: integer
          format: int64
          minimum: 0
          description: Of those, cards this build plays in full and a card test plays.
        generated:
          type: integer
          format: int64
          minimum: 0
          description: Cards read in full from their scripts that no card test plays yet; playable.
        partial:
          type: integer
          format: int64
          minimum: 0
          description: Cards this build plays only in part.
        unimplemented:
          type: integer
          format: int64
          minimum: 0
          description: Cards this build holds only as stubs, which do not play.
        absent:
          type: integer
          format: int64
          minimum: 0
          description: Cards this build has nothing for.
      required:
      - code
      - position
      - total
      - implemented
      - generated
      - partial
      - unimplemented
      - absent
      description: >-
        How far this build's pool is through one set, counted in the cards first
        printed there (fewer than Scryfall's count for a set with reprints).
    TermsInForce:
      type: object
      properties:
        terms:
          anyOf:
          - $ref: "#/components/schemas/ConsoleTerms"
          - type: "null"
          description: The terms in force, or `null` for a gateway without terms.
      required:
      - terms
      description: "`GET /admin/terms` and `POST /admin/terms`."
    TermsVersions:
      type: object
      properties:
        versions:
          type: array
          items:
            $ref: "#/components/schemas/PublishedTerms"
          description: Every version an admin published, newest first.
      required:
      - versions
      description: "`GET /admin/terms/versions`."
    TextBody:
      type: object
      properties:
        lang:
          type: string
          description: A lowercase primary language tag (`de`, `en`); each at most once.
        updated:
          type:
          - string
          - "null"
          description: The date the text names as its last change; absent, `null` or empty for none.
        markdown:
          type: string
          description: "The text, in Markdown: at most 64 KiB, no control characters but newline and tab."
      required:
      - lang
      - markdown
      additionalProperties: false
      description: One language of a version an admin publishes.
tags:
- name: Admin
  description: The admin console
