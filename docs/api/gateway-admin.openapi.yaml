              description: "Seconds to wait: 300"
        "503":
          description: Baylee Central or the gateway's database is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    delete:
      summary: Remove the pasted token
      description: |-
        Forgets the token and unlinks the gateway at once: it
