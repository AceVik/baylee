          pattern: ^[\w.-]{1,64}$
      - name: id
        in: path
        required: true
        description: "The profile's id: 1-64 of A-Z a-z 0-9 . - _"
        schema:
          type: string
      security:
      - adminToken: []
      servers:
      - url: http://127.0.0.1:28767
        description: The admin listener (loopback only)
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountsBody"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessRemoved"
        "400":
          description: >-
            No valid `X-Baylee-Admin`, an id outside 1-64 of A-Z a-z 0-9 . - _, not a list
            of accounts (an unknown field included), fewer than 1 or more than 200, or one
            that is not a UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: The bearer token is neither `BAYLEE_ADMIN_TOKEN` nor a live Central admin lease
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: >-
            A browser's request (`Origin`, `Sec-Fetch-Site` or `Sec-Fetch-Mode`) or a
            `Host` that is not this machine, refused before the token is read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "413":
          description: The body is over 16 KiB
        "429":
          description: >-
            Ten wrong tokens in five minutes, or 600 requests in a minute; the right token
            is refused too until the window passes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          headers:
            Retry-After:
              schema:
                type: integer
                format: int64
                minimum: 0
              description: "Seconds to wait: 300"
        "503":
          description: >-
            The gateway's database is unavailable (or Baylee Central, while an admin lease
            is checked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/accounts/lookup:
    get:
      summary: Find registered accounts by the start of a name
      description: |-
        Registered accounts whose username or display name starts
        with `q`, for a list editor's type-ahead: the username equal to `q`
        first, then by username, at most 10.
      operationId: lookup
      tags:
      - Admin
      parameters:
      - name: q
        in: query
        required: false
        description: >-
          The start of a username or display name, any case (`%` and `_` are themselves);
          fewer than 2 characters find nothing, at most 100.
        schema:
          type: string
      security:
      - adminToken: []
      servers:
      - url: http://127.0.0.1:28767
        description: The admin listener (loopback only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LookupAnswer"
        "400":
          description: A query parameter other than `q`, or a search over 100 characters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: The bearer token is neither `BAYLEE_ADMIN_TOKEN` nor a live Central admin lease
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: >-
            A browser's request (`Origin`, `Sec-Fetch-Site` or `Sec-Fetch-Mode`) or a
            `Host` that is not this machine, refused before the token is read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: >-
            Ten wrong tokens in five minutes, or 600 requests in a minute; the right token
