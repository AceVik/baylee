              schema:
                type: integer
                format: int64
                minimum: 0
              description: "Seconds to wait: 300"
        "503":
          description: >-
            The gateway's database is unavailable (or Baylee Central, while an admin lease
            is checked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /admin/terms/versions:
    get:
      summary: Every version of the terms an admin published
      description: |-
        Every version an admin published, newest first, with when
        and by whom; versions from a file or the default are not listed.
      operationId: versions
      tags:
      - Admin
      security:
