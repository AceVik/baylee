          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: |-
            - The account is banned (`ban`) or must accept the terms in force first (`terms_required`)
            - This gateway has no chat, the caller is a guest (who has no friends list), the player is a guest or takes no friend requests, or the account is banned (`ban`) or must accept the terms in force first (`terms_required`)
