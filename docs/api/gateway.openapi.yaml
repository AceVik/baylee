      summary: Close a table invite
      description: |-
        The invitee declines a table invite (`{"answer":"declined"}`)
        or lets it go (no body), or the inviter withdraws it; both are told.
      operationId: social_close_invite
      tags:
      - Social
      parameters:
      - name: id
        in: path
        required: true
        description: The invite's id
        schema:
          type: string
      security:
      - bearer: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteDecline"
        required: false
      responses:
        "204":
          description: No Content
        "401":
          description: No bearer token, or one that is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: |-
            - The account is banned (`ban`) or must accept the terms in force first (`terms_required`)
            - This gateway has no chat, or the account is banned (`ban`) or must accept the terms in force first (`terms_required`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: No such invite, or the caller is neither its invitee nor its inviter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: The account store or Baylee Central is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: >-
        The session token a sign-in answers. Sockets take a single-use ticket bought
        with it instead (`POST /ws-ticket`).
    chairTicket:
      type: http
      scheme: bearer
      description: >-
        A host's single-use chair ticket (`POST
        /lobby/games/{id}/chairs/{seat}/ticket`), which a seat bridge redeems.
    seatToken:
      type: http
      scheme: bearer
      description: "A seat token: the `seat_token` that creating, joining or taking a seat, a rematch or a chair redemption answers. It proves one chair of one game."
  schemas:
    AcceptTerms:
      type: object
      properties:
        version:
          type: string
          description: The version the player read, as `GET /terms` named it.
      required:
      - version
      description: "What `POST /account/terms` takes: the version the player read."
    AccountKeys:
      type: object
      properties:
        tag:
          type: string
          description: The account's tag.
        handle:
          type: string
          description: Its handle (`Alice#af03`).
        devices:
          type: array
          items:
            $ref: "#/components/schemas/DeviceKey"
          description: Its devices.
      required:
      - tag
      - handle
      - devices
      description: One account's devices.
    Admission:
      type: string
      enum:
      - unmanaged
      - open
      - held
      description: "Whether a new game may start: `unmanaged` (no hold configured), `open`, or `held` (a deploy holds new games back)."
    AuthConfig:
      type: object
      properties:
        registration_enabled:
          type: boolean
          description: "Always `false`: nobody registers or signs in with a password at a gateway; accounts are Baylee Central's. Kept for clients from before, which offer a sign-up form only where it is true."
        registration:
          $ref: "#/components/schemas/Registration"
          description: "Who may come in new (`BAYLEE_REGISTRATION`): `open` lets anybody in, `invite` a guest only with a closed beta's key, and `off` nobody new; a Central account new here follows `docs/central-login.md`."
        guests_enabled:
          type: boolean
          description: "Whether \"play as a guest\" is offered: the mode is `guests` or `mixed`."
        central:
          type: boolean
          description: "Whether this gateway takes Baylee Central sign-ins (`POST /auth/central/login`): it is connected to Central and its mode is `central` or `mixed`."
        auth_mode:
          $ref: "#/components/schemas/AuthMode"
          description: "Who comes in: `guests`, `central` (the default) or `mixed`."
        art_cache:
          type: boolean
          description: Whether `GET /art/…` serves card images.
        deck_images:
          type: boolean
          description: Whether decks may carry uploaded pictures.
        clocks:
          type: array
          items:
            $ref: "#/components/schemas/ClockOffer"
          description: The clocks a room may be opened at; the first is the default.
      required:
      - registration_enabled
      - registration
      - guests_enabled
      - central
      - auth_mode
      - art_cache
      - deck_images
      - clocks
      description: "`GET /auth/config`."
    AuthMode:
      type: string
      enum:
      - guests
      - central
      - mixed
      description: "Who this gateway lets in: `guests` (guests only), `central` (Baylee Central's accounts only, the default) or `mixed` (both)."
    BanBody:
      type: object
      properties:
        reason:
          type: string
          description: Why, in the moderator's words.
        until:
          type:
          - string
          - "null"
          description: When it ends, an RFC 3339 moment in UTC; `null` for good.
          format: date-time
      required:
      - reason
      - until
      description: "How a ban reads on a refusal: `{\"reason\", \"until\"}`, `until` an RFC 3339 moment in UTC or `null` for good."
    BlockedCard:
      type: object
      properties:
        index:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
          description: The card's `CardIndex`.
        name:
          type: string
          description: Its English name.
        reason:
          type: string
          description: Why, in the operator's words.
        until:
          type:
          - string
          - "null"
          description: >-
            When the block ends by itself (RFC 3339, UTC), `null` for a block without an
            end.
          format: date-time
      required:
      - index
      - name
      - reason
      - until
      description: A card the operator has taken out of play on this gateway.
    BlockedCards:
      type: object
      properties:
        blocked:
          type: array
          items:
            $ref: "#/components/schemas/BlockedCard"
          description: Every card blocked now.
      required:
      - blocked
      description: "`GET /cards/blocked`."
    Build:
      type: object
      properties:
        version:
          type: string
          description: The release, e.g. `0.1.0-beta.8a`.
        commit:
          type: string
          description: The commit it was built from.
        build:
          type: string
          description: The build's number.
        built_at:
          type: string
          description: When it was built.
        dirty:
          type: boolean
          description: Whether the tree it was built from had changes the commit does not hold.
      required:
      - version
      - commit
      - build
      - built_at
      - dirty
      description: "Which binary answers: the same five fields in `/source`, `/info` and `/health`."
    CardTextEntry:
      type: object
      properties:
        scryfall_id:
          type: string
          description: "Asked for by card (`oracle_ids`): the Scryfall id of the printing the faces are read from. Asked for by printing (`ids`): the printing id that was asked for, which need not be that one."
        oracle_id:
          type: string
          description: The card's Scryfall oracle id.
        lang:
          type: string
          description: "The language code of the printing the names and type lines are read from: the one asked for, or `en` where the catalog has no printing in it. Whether a face's rules text is in it is that face's `printed`."
        layout:
          type: string
          description: That printing's Scryfall layout (`normal`, `modal_dfc`, …).
        faces:
          type: array
          items:
            $ref: "#/components/schemas/FaceText"
          description: The card's faces, in printed order.
      required:
      - scryfall_id
      - lang
      - faces
      description: Every face of one card, in one language, read from one printing.
    CatalogHealth:
      type: object
      oneOf:
      - $ref: "#/components/schemas/CatalogHealthOff"
      - $ref: "#/components/schemas/CatalogHealthReady"
      - $ref: "#/components/schemas/CatalogHealthProjectionMissing"
      - $ref: "#/components/schemas/CatalogHealthEmpty"
      - $ref: "#/components/schemas/CatalogHealthUnreachable"
      discriminator:
        propertyName: state
        mapping:
          "off": "#/components/schemas/CatalogHealthOff"
          ready: "#/components/schemas/CatalogHealthReady"
          projection_missing: "#/components/schemas/CatalogHealthProjectionMissing"
          empty: "#/components/schemas/CatalogHealthEmpty"
          unreachable: "#/components/schemas/CatalogHealthUnreachable"
      description: "The card catalog: `off` (none configured), `ready`, `projection_missing` (the search projection wants a rebuild), `empty` (no ingest yet) or `unreachable`."
    CatalogHealthEmpty:
      type: object
      properties:
        state:
          type: string
          enum:
          - empty
          description: "Discriminator: empty"
        cards:
          type: boolean
        projection:
          type: boolean
      required:
      - state
      - cards
      - projection
    CatalogHealthOff:
      type: object
      properties:
        state:
          type: string
          enum:
          - "off"
          description: "Discriminator: off"
      required:
      - state
    CatalogHealthProjectionMissing:
      type: object
      properties:
        state:
          type: string
          enum:
          - projection_missing
          description: "Discriminator: projection_missing"
        cards:
          type: boolean
        projection:
          type: boolean
      required:
      - state
      - cards
      - projection
    CatalogHealthReady:
      type: object
      properties:
        state:
          type: string
          enum:
          - ready
          description: "Discriminator: ready"
        cards:
          type: boolean
        projection:
          type: boolean
      required:
      - state
      - cards
      - projection
    CatalogHealthUnreachable:
      type: object
      properties:
        state:
          type: string
          enum:
          - unreachable
          description: "Discriminator: unreachable"
      required:
      - state
    CatalogPrinting:
      type: object
      properties:
        scryfall_id:
          type: string
          description: "The printing's Scryfall id: a deck line's `scryfall=` form, and its picture's key."
        oracle_id:
          type: string
          description: The card's Scryfall oracle id, shared with every other printing of it.
        lang:
          type: string
          description: The printing's language code (`en`, `de`, …).
        set:
          type: string
          description: The set code, as a deck line writes it.
        set_name:
          type: string
          description: The set's full name.
        collector_number:
          type: string
          description: The collector number within the set.
        rarity:
          type: string
          description: Its rarity, as Scryfall names it (`common`, `uncommon`, `rare`, `mythic`, …).
        released_at:
          type: string
          description: When it was released, `YYYY-MM-DD`; empty when that is not known.
        artist:
          type: string
          description: Who illustrated it.
        finishes:
          type: array
          items:
            type: string
          description: "The finishes it was sold in: `nonfoil`, `foil`, `etched`."
        frame_effects:
          type: array
          items:
            type: string
          description: Its frame treatments, as Scryfall names them (`showcase`, `extendedart`, …).
        border_color:
          type: string
          description: Its border colour, as Scryfall names it (`black`, `borderless`, …).
        promo:
          type: boolean
          description: Whether it is a promo.
        name:
          type: string
          description: The front face's name in the printing's language.
        layout:
          type: string
          description: >-
            Its Scryfall layout (`normal`, `transform`, `modal_dfc`, …), which tells a card
            with a back picture from one with two faces on its front; may be empty.
      required:
      - scryfall_id
      - oracle_id
      - lang
      - set
      - set_name
      - collector_number
      - rarity
      - released_at
      - artist
      - finishes
      - frame_effects
      - border_color
      - promo
      - name
      description: "One printing of a card, as a picker shows it: the piece of cardboard, not the card. A deck line picks it by `set`, `collector_number`, `lang` and a finish, or exactly by `scryfall_id`. Without a catalog the one printing this build references stands in, with only `scryfall_id`, `oracle_id`, `lang`, `finishes`, `name` and `layout` filled and every other text empty."
    CentralAdminSession:
      type: object
      description: A bearer for the admin listener.
      properties:
        token:
          type: string
          description: "The bearer: 64 lowercase hex characters."
        expires_at:
          type: integer
          format: int64
          description: "When it ends, Unix seconds: the end of its Central lease."
        username:
          type:
          - string
          - "null"
          description: The account's username here, `null` for an account only Central knows.
        display_name:
          type: string
          description: The name other players see.
      required:
      - token
      - expires_at
      - username
      - display_name
    CentralBytes32:
      type: array
      description: 32 bytes, as a JSON array of 32 numbers from 0 to 255.
      items:
        type: integer
        minimum: 0
        maximum: 255
      minItems: 32
      maxItems: 32
    CentralCapability:
      type: object
      description: >-
        A one-use ticket Baylee Central issued for this gateway and this route's
        purpose, good for 30 seconds.
      properties:
        ticket:
          $ref: "#/components/schemas/CentralBytes32"
      required:
      - ticket
      additionalProperties: false
    CentralSession:
      type: object
      description: A session at this gateway, answered as a sign-in is.
      properties:
        token:
          type: string
          description: "The session's bearer token: 64 lowercase hex characters."
        expires_at:
          type: integer
          format: int64
          description: "When it ends, Unix seconds: the end of its Central lease."
        username:
          type:
          - string
          - "null"
          description: The account's username here, `null` for an account only Central knows.
        display_name:
          type: string
          description: The name other players see.
        terms_stale:
          type: boolean
          description: >-
            Whether the account has yet to accept this gateway's terms in force (at
            Central); only on a gateway with terms.
        central_terms_stale:
          type: boolean
          const: true
          description: >-
            Only there when the account has yet to accept Baylee Central's own terms, which
            come first.
      required:
      - token
      - expires_at
      - username
      - display_name
    ChairDeck:
      type: object
      properties:
        cards:
          type: array
          items:
            type: string
          description: Main-deck lines (`N Card Name`, `docs/deck-format.md`).
        commanders:
          type: array
          items:
            type: string
          description: The deck's commanders, by name.
        name:
          type: string
          description: The deck's name.
        sideboard:
          type: array
          items:
            type: string
          description: Sideboard lines, in the same form.
      required:
      - cards
      - commanders
      - name
      - sideboard
      description: The deck a chair will play, as only that chair's bearer may read it.
    ChairGrant:
      type: object
      properties:
        decide_secs:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
          description: Seconds a player has for each decision at this table; 0 for no decision clock.
      required:
      - decide_secs
      allOf:
      - $ref: "#/components/schemas/SeatGrant"
      description: The chair the seat bridge now holds, and the pace the table plays at.
    ChairReadyBody:
      type: object
      properties:
        ready:
          type: boolean
          description: "`true` (also when absent) says its mind answered its check; `false` takes it back."
          default: true
      description: Whether the seat bridge's model is ready to play.
    ChairStatus:
      type: object
      properties:
        decide_secs:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
          description: Seconds a player has for each decision; 0 for no decision clock.
        deck:
          anyOf:
          - $ref: "#/components/schemas/ChairDeck"
          - type: "null"
          description: The deck the chair will play; `null` while it has none.
        game_id:
          type: string
          description: The game.
        ready:
          type: boolean
          description: Whether the chair is ready to start.
        seat:
          type: integer
          format: int64
          minimum: 0
          description: The chair's seat number, counted from 0.
        state:
          type: string
          description: "`waiting` until the room starts, then `playing`, then `over`."
          enum:
          - waiting
          - playing
          - over
      required:
      - decide_secs
      - deck
      - game_id
      - ready
      - seat
      - state
      description: A chair's own view of its room.
    ChatReport:
      type: object
      properties:
        conv:
          type: string
          description: >-
            The conversation it was delivered in, by id (`dm:<tag>:<tag>`, `grp:<uuid>`,
            `tbl:<game>`, `team:<game>:<n>` or `global`); the message's header must name the
            same.
        sealed:
          $ref: "#/components/schemas/Delivered"
          description: The message as it was delivered.
        mk:
          type: string
          description: Its message key, 32 bytes, base64url without padding.
        body:
          type: string
          description: >-
            The body it decrypted to, the exact bytes (at most 4096), base64url without
            padding.
        note:
          type: string
          description: What the reporter says, at most 2000 characters; empty when left out.
      required:
      - conv
      - sealed
      - mk
      - body
      description: "One delivered message, revealed by its recipient: the message as it arrived, its message key and the body it decrypted to. Revealing the key reveals this one message and nothing else."
    ClockOffer:
      type: object
      properties:
        name:
          type: string
          description: Its name, which `POST /lobby/games` takes.
        decide_secs:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
          description: Seconds a player has for each decision.
        reconnect_secs:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
          description: Seconds a seat that lost its connection is held.
        blurb:
          type: string
          description: One line saying what it is.
      required:
      - name
      - decide_secs
      - reconnect_secs
      - blurb
      description: One clock a room may be opened at.
    Counted:
      type: object
      properties:
        connected:
          type: integer
          format: int64
          minimum: 0
        games:
          type: integer
          format: int64
          minimum: 0
      required:
      - connected
      - games
      description: How many are connected, and the games they run.
    CreateGameBody:
      type: object
      properties:
        deck_id:
          type: string
          description: "One of the caller's decks (`GET /decks`). Required for `mode: ai`; a room may be opened without one, and its host picks one before the game starts."
        mode:
          type: string
          description: "`ai` is the one-tap game against the house AI, which starts at once; anything else (`open`) opens a room the host arranges."
        seats:
          type:
          - integer
          - "null"
          format: int64
          minimum: 2
          description: "How many chairs the room has, 2 to 8; 2 when absent. Not read for `mode: ai`."
          maximum: 8
        name:
          type: string
          description: "What the room is called in the list; the first 60 characters are kept, and an empty name lists it under its host's. Not read for `mode: ai`."
        password:
          type: string
          description: "A password for the room; empty or absent leaves it open. Not read for `mode: ai`."
        clock:
          type:
          - string
          - "null"
          description: >-
            Which clock the table plays at, by name (`GET /auth/config` lists them); the
            first of them when absent.
        decision_timeout_secs:
          type:
          - integer
          - "null"
          format: int64
          minimum: 0
          maximum: 4294967295
          description: "Seconds a player has for each decision, overriding the clock's: 0 for no decision clock, else 10 to 3600."
        reconnect_window_secs:
          type:
          - integer
          - "null"
          format: int64
          minimum: 0
          maximum: 4294967295
          description: >-
            Seconds a seat that lost its connection is held before the house answers for
            it, 10 to 3600; the gateway's own window (`BAYLEE_RECONNECT_SECS`, 180 by default)
            when absent.
        ai:
          type:
          - string
          - "null"
          description: "The house AI's difficulty for `mode: ai`; `steady` when absent, and an unknown one is refused."
          enum:
          - novice
          - casual
          - steady
          - sharp
          - expert
          - null
        allow_spectators:
          type:
          - boolean
          - "null"
          description: Whether signed-in players who hold no chair may watch the game; on when absent.
      description: "A game against the house AI (`mode: ai`), or a room the caller hosts."
    Created:
      type: object
      properties:
        id:
          type: string
          description: "The new thing's id: a device id, a group's UUID or a table invite's id."
      required:
      - id
      description: >-
        The answer to `POST /social/devices` (`201`), and to anything else that creates
        something with an id.
    DeckBody:
      type: object
      properties:
        name:
          type: string
          description: The deck's name, 1–64 bytes of UTF-8.
          minLength: 1
        cards:
          type: array
          items:
            type: string
          description: "Main-deck lines, 1–250 of them: `N Card Name`, a card named as this pool or Scryfall spells it, optionally with a printing, finish, language or note (`docs/deck-format.md`). At most four copies of a card that is not a basic land, and 250 cards in all."
          minItems: 1
          maxItems: 250
        sideboard:
          type: array
          items:
            type: string
          description: Sideboard lines, in the same form and under the same limits; none when absent.
          maxItems: 250
        commanders:
          type: array
          items:
            type: string
          description: "The deck's commanders by name: none, one, or two that may lead a deck together (the partner rule)."
          maxItems: 2
        commander:
          type:
          - string
          - "null"
          description: The one commander an older client sends; read only when `commanders` is empty.
          deprecated: true
        format:
          type:
          - string
          - "null"
          description: >-
            What the deck plays (`commander`, `freeform`, …). When absent a saved deck
            keeps its format and a new one is read off its commanders.
        description:
          type:
          - string
          - "null"
          description: >-
            What the deck is for, in its owner's words. When saving a deck again, absent
            leaves it alone and an empty string clears it.
        summary:
          type:
          - string
          - "null"
          description: >-
            What this change is called, for the deck's history; read only by `PUT
            /decks/{id}`, and only when a list changes.
        sleeve:
          type:
          - string
          - "null"
          description: >-
            The image id of the deck's sleeve, from `POST /images?kind=sleeve`; it must be
            a picture this account uploaded. Absent or `null` for the generated card back.
        playmat:
          type:
          - string
          - "null"
          description: >-
            The image id of the deck's playmat, from `POST /images?kind=playmat`, under the
            same rule as the sleeve.
      required:
      - name
      - cards
      description: The body of `POST /decks` and `PUT /decks/{id}`.
    DeckCardCount:
      type: object
      properties:
        main:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
          description: Main-deck cards, counting copies.
        side:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
          description: Sideboard cards, counting copies.
      required:
      - main
      - side
      description: How many cards a state of a deck holds.
    DeckCreated:
      type: object
      properties:
        deck_id:
          type: string
          description: The new deck's id.
      required:
      - deck_id
      description: "`POST /decks` and `POST /decks/{id}/copy`."
    DeckDelta:
      type: object
      properties:
        added:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
          description: "Copies added: new cards, and higher counts of a card already there."
        removed:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
          description: "Copies removed: cards cut, and lower counts of a card that stays."
        count:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
          description: Card rows whose count changed.
        printing:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
          description: Card rows that changed printing (set, collector number or exact printing).
        finish:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
          description: Card rows that changed finish.
        language:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
          description: Card rows that changed language.
        note:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
          description: Card rows whose note changed.
      required:
      - added
      - removed
      - count
      - printing
      - finish
      - language
      - note
      description: "How much one state of a deck changed against the state before it, over its main deck, sideboard and commanders: copies for `added` and `removed`, card rows for the rest."
    DeckDetail:
      type: object
      properties:
        id:
          type: string
          description: The deck's id.
        kind:
          type: string
          description: "Whose it is: `account` (a player's own), `preconstructed` (a retail product) or `house` (published to be played with)."
          enum:
          - account
          - preconstructed
          - house
        name:
          type: string
          description: The deck's name.
        format:
          type: string
          description: What it plays (`commander`, `freeform`, …).
        description:
          type:
          - string
          - "null"
          description: What the deck is for, in its owner's words; `null` for none.
        version:
          type: integer
          format: int32
          description: The version its cards are; every save that changes them raises it by one.
        copied_from:
          type:
          - string
          - "null"
          description: >-
            The deck it was copied from (`POST /decks/{id}/copy`), `null` for a deck that
            is no copy.
        copied_version:
          type:
          - integer
          - "null"
          format: int32
          description: Which version of that deck was copied, `null` for a deck that is no copy.
        cards:
          type: array
          items:
            type: string
          description: Main-deck lines (`N Card Name`, a printing optional).
        sideboard:
          type: array
          items:
            type: string
          description: Sideboard lines, in the same form.
        commanders:
          type: array
          items:
            type: string
          description: "Its commanders: none, one, or two under the partner rule."
        sleeve:
          type:
          - string
          - "null"
          description: The image id of its sleeve, `null` for the generated card back.
        playmat:
          type:
          - string
          - "null"
          description: The image id of its playmat, `null` for none.
      required:
      - id
      - kind
      - name
      - format
      - description
      - version
      - copied_from
      - copied_version
      - cards
      - sideboard
      - commanders
      - sleeve
      - playmat
      description: "`GET /decks/{id}`."
    DeckHistory:
      type: object
      properties:
        version:
          type: integer
          format: int32
          description: The version the deck's current cards are.
        updated_at:
          type: integer
          format: int64
          minimum: 0
          description: When it was last saved, in unix seconds.
        past:
          type: array
          items:
            $ref: "#/components/schemas/DeckPast"
          description: Every state it no longer holds, newest first.
        delta:
          anyOf:
          - $ref: "#/components/schemas/DeckDelta"
          - type: "null"
          description: >-
            What the current state changed against the newest past one, `null` when it has
            none.
        card_count:
          $ref: "#/components/schemas/DeckCardCount"
          description: How many cards the current state holds.
      required:
      - version
      - updated_at
      - past
      - delta
      - card_count
      description: "`GET /decks/{id}/history`."
    DeckLeader:
      type: object
      properties:
        name:
          type: string
          description: The card's English name, as the deck stores it.
        scryfall_id:
          type: string
          description: >-
            The Scryfall id of the printing the deck's row names, else of the one this
            build references; empty when the card is unknown to this build.
        lang:
          type: string
          description: The language code of that printing (`en`, `de`, …).
        finish:
          $ref: "#/components/schemas/Finish"
          description: The finish the row names; `Normal` when it names none.
        has_back_image:
          type: boolean
          description: >-
            Whether the card has a second picture (a back face) to turn to; left out when
            it has none.
        artist:
          type: string
          description: "Who painted that printing's art, from the gateway's catalog; left out when nobody knows (no catalog, or one that lacks the printing or is down). Show the printing's art only with its artist credited: no `artist` means no art."
      required:
      - name
      - scryfall_id
      - lang
      - finish
      description: >-
        A card a deck is pictured by (one of its commanders, or the signature card of a
        deck without one) and the printing to picture it with.
    DeckPast:
      type: object
      properties:
        version:
          type: integer
          format: int32
          description: Which version it was.
        cards:
          type: integer
          format: int64
          minimum: 0
          description: How many main-deck lines it had.
        sideboard:
          type: integer
          format: int64
          minimum: 0
          description: How many sideboard lines it had.
        commanders:
          type: array
          items:
            type: string
          description: The commanders it had.
        summary:
          type:
          - string
          - "null"
          description: What the change that replaced it was called, `null` when it was given no name.
        superseded_at:
          type: integer
          format: int64
          minimum: 0
          description: When it stopped being current, in unix seconds.
        delta:
          anyOf:
          - $ref: "#/components/schemas/DeckDelta"
          - type: "null"
          description: What it changed against the state before it, `null` on the oldest.
        card_count:
          $ref: "#/components/schemas/DeckCardCount"
          description: How many cards it held.
      required:
      - version
      - cards
      - sideboard
      - commanders
      - summary
      - superseded_at
      - delta
      - card_count
      description: One state a deck no longer holds, in `GET /decks/{id}/history`.
    DeckReverted:
      type: object
      properties:
        version:
          type: integer
          format: int32
          description: The deck's new version, which holds the lists put back.
      required:
      - version
      description: "`POST /decks/{id}/versions/{version}/revert`."
    DeckRow:
      type: object
      properties:
        id:
          type: string
          description: The deck's id.
        blocked:
          type: array
          items:
            $ref: "#/components/schemas/BlockedCard"
          description: >-
            The cards of this deck blocked on this gateway now; a deck with any does not
            sit down at a table here. Empty for a deck this gateway plays.
        name:
          type: string
          description: The deck's name.
        format:
          type: string
          description: What it plays (`commander`, `freeform`, …).
        cards:
          type: integer
          format: int64
          minimum: 0
          description: How many main-deck lines it has (`4 Lightning Bolt` is one).
        sideboard:
          type: integer
          format: int64
          minimum: 0
          description: How many sideboard lines it has.
        copies:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
          description: How many cards the main deck holds, counting copies.
        side_copies:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
          description: How many cards the sideboard holds, counting copies.
        identity:
          type: string
          description: "Its colour identity as `WUBRG` letters, empty for colourless: its commanders' together, else every main-deck card's."
        commanders:
          type: array
          items:
            type: string
          description: "Its commanders: none, one, or two under the partner rule."
        leaders:
          type: array
          items:
            $ref: "#/components/schemas/DeckLeader"
          description: The picture of each commander, in the order of `commanders`.
        signature:
          anyOf:
          - $ref: "#/components/schemas/DeckLeader"
          - type: "null"
          description: >-
            The picture of a deck without commanders (its most expensive non-land card);
            `null` for a deck with commanders or of lands alone.
        unplayable:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
          description: How many main-deck cards, counting copies, this build cannot play.
        updated_at:
          type: integer
          format: int64
          minimum: 0
          description: When it was last saved, in unix seconds.
        sleeve:
          type:
          - string
          - "null"
          description: >-
            The image id of its sleeve (`GET /images/{id}`), `null` for the generated card
            back.
        playmat:
          type:
          - string
          - "null"
          description: The image id of its playmat, `null` for none.
      required:
      - id
      - blocked
      - name
      - format
      - cards
      - sideboard
      - copies
      - side_copies
      - identity
      - commanders
      - leaders
      - signature
      - unplayable
      - updated_at
      - sleeve
      - playmat
      description: One row of `GET /decks`.
    DeckState:
      anyOf:
      - $ref: "#/components/schemas/DeckStateNow"
        description: The version asked for is the deck's current one.
      - $ref: "#/components/schemas/DeckStateThen"
        description: The version asked for is one the deck no longer holds.
      description: "`GET /decks/{id}/versions/{version}`: the deck as it is now, or a state it no longer holds, told apart by `current`."
    DeckStateNow:
      type: object
      properties:
        version:
          type: integer
          format: int32
          description: Its version, the deck's current one.
        cards:
          type: array
          items:
            type: string
          description: Main-deck lines.
        sideboard:
          type: array
          items:
            type: string
          description: Sideboard lines.
        commanders:
          type: array
          items:
            type: string
          description: Its commanders.
        current:
          type: boolean
          description: "Always `true`: this is the deck as it is now."
          const: true
      required:
      - version
      - cards
      - sideboard
      - commanders
      - current
      description: The state a deck holds now.
    DeckStateThen:
      type: object
      properties:
        version:
          type: integer
          format: int32
          description: Which version it was.
        cards:
          type: array
          items:
            type: string
          description: Main-deck lines it held.
        sideboard:
          type: array
          items:
            type: string
          description: Sideboard lines it held.
        commanders:
          type: array
          items:
            type: string
          description: The commanders it had.
        summary:
          type:
          - string
          - "null"
          description: What the change that replaced it was called, `null` when it was given no name.
        superseded_at:
          type: integer
          format: int64
          minimum: 0
          description: When it stopped being current, in unix seconds.
        current:
          type: boolean
          description: "Always `false`: a state the deck no longer holds."
          const: false
      required:
      - version
      - cards
      - sideboard
      - commanders
      - summary
      - superseded_at
      - current
      description: A state a deck no longer holds.
    Delivered:
      type: object
      properties:
        hdr:
          type: string
          description: The header's JSON bytes exactly as the sender signed them, at most 512 bytes.
        "n":
          type: string
          description: The body's nonce, 24 bytes.
        ct:
          type: string
          description: >-
            The body's ciphertext (XChaCha20-Poly1305 under the message key), at most 4112
            bytes.
        epk:
          type: string
          description: The message's ephemeral X25519 public key, 32 bytes.
        sig:
          type: string
          description: The sending device's Ed25519 signature, 64 bytes.
        k:
          type: string
          description: The message key wrapped for this device, 48 bytes.
      required:
      - hdr
      - "n"
      - ct
      - epk
      - sig
      - k
      description: "A sealed message as one device received it: the sender's header, the sealed body and its signature, and the message key wrapped for that device. Every field is base64url without padding; the gateway cannot open it."
    DeviceKey:
      type: object
      properties:
        id:
          type: string
          description: The device id.
        ik:
          type: string
          description: Its Ed25519 identity key, 32 bytes, base64url without padding.
        dk:
          type: string
          description: Its X25519 key, 32 bytes, base64url without padding.
        dsig:
          type: string
          description: "The identity key's signature over the device statement, base64url without padding: check it against the account's tag before trusting the keys."
        label:
          type: string
          description: Its OS family.
        added_at:
          type: integer
          format: int64
          minimum: 0
          description: When it was registered, Unix milliseconds.
      required:
      - id
      - ik
      - dk
      - dsig
      - label
      - added_at
      description: One device's public keys, as `GET /social/keys` gives them.
    DeviceList:
      type: object
      properties:
        devices:
          type: array
          items:
            $ref: "#/components/schemas/DeviceRow"
          description: This account's devices, oldest first.
      required:
      - devices
      description: The account's chat devices.
    DeviceRegistration:
      type: object
      properties:
        ik:
          type: string
          description: The device's Ed25519 identity key, 32 bytes, base64url without padding.
        dk:
          type: string
          description: The device's X25519 key, 32 bytes, base64url without padding.
        dsig:
          type: string
          description: >-
            The identity key's signature over the device statement for the account's tag,
            64 bytes, base64url without padding.
        label:
          type: string
          description: >-
            The device's OS family (`macOS`), 1 to 24 characters, none of them a control,
            bidirectional or invisible character.
      required:
      - ik
      - dk
      - dsig
      - label
      description: "A chat device to register: its two public keys, the identity key's statement over them for the account's tag, and its OS family."
    DeviceRow:
      type: object
      properties:
        id:
          type: string
          description: "The device id, its fingerprint: 16 lowercase hex characters derived from its identity key."
        label:
          type: string
          description: The device's OS family.
        added_at:
          type: integer
          format: int64
          minimum: 0
          description: When it was registered, Unix milliseconds.
        seen_at:
          type: integer
          format: int64
          minimum: 0
          description: When it last opened the social socket, Unix milliseconds.
      required:
      - id
      - label
      - added_at
      - seen_at
      description: One of this account's devices, as `GET /social/devices` lists it.
    ErrorBody:
      type: object
      properties:
        error:
          type: string
          description: What went wrong, as one sentence for a person.
        ban:
          $ref: "#/components/schemas/BanBody"
          description: "The ban an account is refused with (beta.8): only on a `403` from a Central sign-in or a session of a banned account (`moderation.rs`)."
        terms_required:
          type: string
          description: "Whose terms of use the account has to accept first (`central` or `gateway`): only on the `403` of a session that has not (`terms_admit`)."
          enum:
          - central
          - gateway
      required:
      - error
      description: "A refusal: one English sentence in `error`, and the parts a client words itself where a refusal has them."
    FaceText:
      type: object
      properties:
        name:
          type: string
          description: The face's name in the served language.
        english_name:
          type: string
          description: The same face's English name.
        type_line:
          type: string
          description: The face's type line in the served language.
        oracle_text:
          type: string
          description: "The face's whole rules text to draw: `printed` where there is one, the English Oracle text otherwise."
        mana_cost:
          type: string
          description: >-
            The face's mana cost in Scryfall's notation (`{2}{G}`), the same in every
            language.
        printed:
          type:
          - string
          - "null"
          description: "The face's rules text in the asked language, exactly as that printing has it; `null` when it is not a translation: under `en`, and when no printing of the card translated this face. Never English."
      required:
      - name
      - english_name
      - type_line
      - oracle_text
      - mana_cost
      description: The text of one face of a card, in the served language.
    Farewell:
      type: object
      description: "What `DELETE /account` takes: `{}`. A password, which a client from before the cutover sends, is ignored: no account here signs in with one (`docs/central-login.md` §\"Cutover\")."
    Finish:
      type: string
      enum:
      - Normal
      - Foil
      - Etched
      - Holographic
      - Glitter
      - Galaxy
      default: Normal
      description: "The finish of a printing, which only changes how it is drawn: `Normal` (non-foil), `Foil`, `Etched` (etched foil), or the cosmetic treatments `Holographic`, `Glitter` and `Galaxy`."
    FriendRequest:
      type: object
      properties:
        handle:
          type: string
          description: "Whom to ask, by handle: `Name#tag`."
      required:
      - handle
      description: A friend request.
    Games:
      type: object
      properties:
        running:
          type: integer
          format: int64
          minimum: 0
          description: Games being played.
        local_running:
          type: integer
          format: int64
          minimum: 0
          description: Of those, games whose engine runs on this machine (an agent on the unix socket).
        waiting:
          type: integer
          format: int64
          minimum: 0
          description: Rooms waiting for players.
        seats_awaiting_engine:
          type: integer
          format: int64
          minimum: 0
          description: Seats of running games whose engine has not dialled back yet.
      required:
      - running
      - local_running
      - waiting
      - seats_awaiting_engine
      description: "`GET /health`'s games."
    GroupName:
      type: object
      properties:
        name:
          type: string
          description: "The name: 1 to 48 characters, none of them hidden."
      required:
      - name
      description: A group's name.
    GuestBody:
      type: object
      properties:
        display_name:
          type:
          - string
          - "null"
          description: >-
            The name other players see, under the display-name rule; `Guest` when absent or
            empty.
        lang:
          type: string
          description: The language it asks in (`de`, `en`).
        invite_key:
          type:
          - string
          - "null"
          description: >-
            The closed-beta key a new guest needs where registration is `invite`; ignored
            elsewhere.
      description: "What `POST /auth/guest` takes. Every field is optional: `{}` is a guest called `Guest`."
    GuestSignedIn:
      type: object
      properties:
        token:
          type: string
          description: "The session token, sent as `Authorization: Bearer`: the only way back to this guest, so the client keeps it."
        expires_at:
          type: integer
          format: int64
          minimum: 0
          description: >-
            When the session lapses unless it is used before, in Unix seconds; a guest
            whose session lapsed is deleted.
        guest:
          type: boolean
          description: Always `true`.
        handle:
          type: string
          description: >-
            The guest's handle as other players see it, its display name and tag
            (`Guest#1a2b`).
        terms_stale:
          type: boolean
          description: >-
            Always `true` for a new guest, which has accepted no terms yet; absent on a
            gateway without terms.
      required:
      - token
      - expires_at
      - guest
      - handle
      description: What `POST /auth/guest` answers.
    Health:
      type: object
      properties:
        ok:
          type: boolean
          description: "Whether the gateway can do its job: its database answers."
        database:
          type: boolean
          description: Whether its database answers.
        catalog:
          $ref: "#/components/schemas/CatalogHealth"
          description: The card catalog.
        agents:
          $ref: "#/components/schemas/Counted"
          description: Engine agents connected, and the games they run.
        seathosts:
          $ref: "#/components/schemas/Counted"
          description: Seat agents connected, and the model seats they run.
        admission:
          $ref: "#/components/schemas/Admission"
          description: Whether a new game may start (`BAYLEE_ADMISSION_HOLD`).
        games:
          $ref: "#/components/schemas/Games"
          description: The lobby's games.
      required:
      - ok
      - database
      - catalog
      - agents
      - seathosts
      - admission
      - games
      allOf:
      - $ref: "#/components/schemas/Build"
      description: "`GET /health`."
    HostBody:
      type: object
      properties:
        seat:
          type: integer
          format: int64
          minimum: 0
          description: The chair to hand the room to, counted from 0.
      required:
      - seat
      description: The chair whose player becomes the room's host.
    HostedOrdered:
      type: object
      properties:
        profile:
          type: string
          description: The profile ordered.
        seat:
          type: integer
          format: int64
          minimum: 0
          description: The chair, counted from 0.
        state:
          type: string
          description: Always `starting`; the listing says when it is `ready`.
          enum:
          - starting
      required:
      - profile
      - seat
      - state
      description: "The order taken: the chair is marked for the model, which is on its way."
    HostedProfile:
      type: object
      properties:
        available:
          type: boolean
          description: Whether it may be ordered now (`state` is `available`).
        games:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
          description: Games it plays now, over every seat agent.
        id:
          type: string
          description: The profile's id, which an order names.
        kind:
          type: string
          description: How its seat agent runs it (`api`, or a CLI).
        label:
          type: string
          description: What players see it called.
        max_games:
          type:
          - integer
          - "null"
          format: int64
          minimum: 0
          maximum: 4294967295
          description: >-
            How many it may play at once over every seat agent; `null` when one of them
            sets no bound.
        model:
          type: string
          description: The model.
        state:
          type: string
          description: The best state any seat agent holding it reports.
          enum:
          - available
          - busy
          - probing
          - exhausted
          - needs_login
          - failing
          - disabled
        until_unix:
          type:
          - integer
          - "null"
          format: int64
          description: >-
            When that state is expected to end, in Unix seconds (the earliest any seat
            agent reports); `null` when none says.
        vendor:
          type: string
          description: Who the game data goes to.
      required:
      - available
      - games
      - id
      - kind
      - label
      - max_games
      - model
      - state
      - until_unix
      - vendor
      description: "A hosted model a player may seat: one row per profile id over every connected seat agent."
    HostedProfiles:
      type: object
      properties:
        profiles:
          type: array
          items:
            $ref: "#/components/schemas/HostedProfile"
          description: The profiles the caller may seat, available first.
      required:
      - profiles
      description: "`GET /lobby/llm-profiles`."
    HostedSeat:
      type: object
      properties:
        label:
          type: string
          description: What players see it called.
        model:
          type: string
          description: The model.
        note:
          type:
          - string
          - "null"
          description: Why the order failed; `null` while it stands.
        profile:
          type: string
          description: The profile's id (`GET /lobby/llm-profiles`).
        state:
          type: string
          description: "`starting` (ordered, not ready yet), `ready`, or `failed` (the chair is open again, and `note` says why)."
          enum:
          - starting
          - ready
          - failed
        vendor:
          type: string
          description: Who the game data goes to.
      required:
      - label
      - model
      - note
      - profile
      - state
      - vendor
      description: The hosted model ordered for a chair.
    HostedUnavailable:
      type: object
      properties:
        error:
          type: string
          description: The refusal, as one sentence for a person.
        state:
          type: string
          description: "Why: `unknown` (no seat agent holds the profile), or the state it is in."
          enum:
          - unknown
          - busy
          - probing
          - exhausted
          - needs_login
          - failing
          - disabled
        until_unix:
          type:
          - integer
          - "null"
          format: int64
          description: When that state is expected to end, in Unix seconds; `null` when nobody says.
      required:
      - error
      - state
      - until_unix
      description: "A profile that cannot be seated now: unknown here, or not available."
    ImageUploaded:
      type: object
      properties:
        id:
          type: string
          description: "The picture's id: 64 lower-case hex digits, the same for the same picture however often it is uploaded."
          pattern: ^[0-9a-f]{64}$
        kind:
          type: string
          description: The kind it was stored as, as asked.
          enum:
          - sleeve
          - playmat
      required:
      - id
      - kind
      description: "`POST /images`."
    Info:
      type: object
      properties:
        name:
          type: string
          description: >-
            The name to show for this gateway (`BAYLEE_GATEWAY_NAME`); absent when it has
            none, and the client shows its address.
        protocol_version:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
          description: >-
            The protocol a seat socket speaks; a client of another cannot talk to this
            gateway.
        view_version:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
          description: The view shape this build was compiled with.
        source:
          type: string
          description: Where this build's source is (AGPL §13).
        impressum:
          type:
          - string
          - "null"
          description: The operator's legal notice (Impressum), `null` when it has none.
        registration:
          $ref: "#/components/schemas/Registration"
          description: "Who may make an account: anybody, somebody with a beta key, or nobody."
        guests:
          type: boolean
          description: Whether guests are let in.
        auth_mode:
          $ref: "#/components/schemas/AuthMode"
          description: "Who comes in: guests, Baylee Central's accounts, or both."
        hosted_llm:
          type: boolean
          description: Whether a host may seat a language model this gateway's seat agents run.
        social:
          anyOf:
          - $ref: "#/components/schemas/SocialInfo"
          - type: "null"
          description: Friends and chat, `null` when the gateway has none.
        replays:
          anyOf:
          - $ref: "#/components/schemas/Replays"
          - type: "null"
          description: >-
            Replays of the hosted games an account sat at, `null` when the gateway makes
            none.
        terms:
          type:
          - string
          - "null"
          description: >-
            The version of the terms a player accepts here, `null` when the gateway has
            none (`GET /terms` has the text).
      required:
      - protocol_version
      - view_version
      - source
      - impressum
      - registration
      - guests
      - auth_mode
      - hosted_llm
      - social
      - replays
      - terms
      allOf:
      - $ref: "#/components/schemas/Build"
      description: "`GET /info`."
    InviteAnswer:
      type: string
      enum:
      - accepted
      - declined
      description: "How a table invite was answered: `accepted` (the invitee joined with it) or `declined`."
    InviteDecline:
      type: object
      properties:
        answer:
          $ref: "#/components/schemas/InviteAnswer"
          description: "`declined`; anything else, or no body, lets the invite go unanswered."
      required:
      - answer
      description: What the invitee says when it closes an invite.
    InviteRequest:
      type: object
      properties:
        tag:
          type: string
          description: The friend to invite, by tag.
        game:
          type: string
          description: The lobby game the caller sits in.
      required:
      - tag
      - game
      description: An invite to the caller's table.
    JoinGameBody:
      type: object
      properties:
        deck_id:
          type: string
          description: >-
            One of the caller's decks (`GET /decks`); empty sits down without one, to be
            picked before saying ready.
        seat:
          type:
          - integer
          - "null"
          format: int64
          minimum: 0
          description: Which chair to take; the first open person's chair when absent.
        password:
          type:
          - string
          - "null"
          description: The room's password, for a room that has one.
        invite:
          type:
          - string
          - "null"
          description: "A table invite (`POST /social/invites`) for the caller and this room: it stands in for the password and is spent by the join."
      description: >-
        Which chair to take, the deck to bring, and the room's password or an invite to
        it.
    KeysAnswer:
      type: object
      properties:
        keys:
          type: array
          items:
            $ref: "#/components/schemas/AccountKeys"
          description: One entry per tag asked for that the caller may write to.
      required:
      - keys
      description: "`GET /social/keys?tag=…`: only the tags this account may write to; any other tag is left out rather than refused."
    LobbyChair:
      type: object
      properties:
        ai:
          type:
          - string
          - "null"
          description: The AI's difficulty, for an AI chair; `null` for a person's.
          enum:
          - novice
          - casual
          - steady
          - sharp
          - expert
          - null
        deck:
          type: string
          description: The name of the deck the chair plays; empty while it has none.
        delegated_by:
          type:
          - string
          - "null"
          description: >-
            The handle of the player whose seat bridge sits here; `null` for every other
            chair.
        format:
          type: string
          description: The format of that deck; `commander` while it has none.
        host:
          type: boolean
          description: Whether the room's host sits here.
        hosted:
          anyOf:
          - $ref: "#/components/schemas/HostedSeat"
          - type: "null"
          description: The hosted model ordered for this chair; `null` for every other chair.
        kind:
          $ref: "#/components/schemas/SeatKind"
          description: Whether it is a person's chair or the house AI's.
        player:
          type:
          - string
          - "null"
          description: "Who sits there: a player's handle, or the name a seat bridge sat down under (`LLM-…`); `null` for an open or AI chair."
        ready:
          type: boolean
          description: Whether the chair is ready to start.
        seat:
          type: integer
          format: int64
          minimum: 0
          description: The chair's seat number, counted from 0.
        taken:
          type: boolean
          description: >-
            Whether somebody (a player, a seat bridge, or a hosted model on its way) holds
            it.
        team:
          type:
          - integer
          - "null"
          format: int32
          minimum: 0
          maximum: 255
          description: The side it plays for, from 1; `null` for a chair playing for itself.
        you:
          type: boolean
          description: Whether it is the caller's chair.
      required:
      - ai
      - deck
      - delegated_by
      - format
      - host
      - hosted
      - kind
      - player
      - ready
      - seat
      - taken
      - team
      - you
      description: One chair of a table, as the caller sees it.
    LobbyListing:
      type: object
      properties:
        agents_available:
          type: boolean
          description: "Whether any engine agent is connected, so whether a game can start at all: without one the lobby still lists rooms, and opening or starting a game answers `503`."
        games:
          type: array
          items:
            $ref: "#/components/schemas/LobbyTable"
          description: "The tables: rooms waiting for players and games being played. A finished game is in no listing."
      required:
      - agents_available
      - games
      description: Every table the lobby lists, as the caller sees it.
    LobbyPage:
      type: object
      properties:
        limit:
          type: integer
          format: int64
          minimum: 0
          description: How many tables a page holds (1 to 100).
        offset:
          type: integer
          format: int64
          minimum: 0
          description: How many matching tables were skipped before this page.
        total:
          type: integer
          format: int64
          minimum: 0
          description: How many tables the search matched, over every page.
      required:
      - limit
      - offset
      - total
      allOf:
      - $ref: "#/components/schemas/LobbyListing"
      description: "One page of the lobby, as the caller sees it: rooms still waiting first, then the newest, the id breaking a tie, so paging never hands a table out twice. `GET /lobby/ws` pushes the same object on every change."
    LobbyStats:
      type: object
      properties:
        games_running:
          type: integer
          format: int64
          minimum: 0
          description: Games being played; a finished table is neither.
        players_online:
          type: integer
          format: int64
          minimum: 0
          description: >-
            Distinct accounts with a socket open (the lobby feed, or their own chair's at a
            running game), together with those whose seat bridge plays a chair of a running
            game. A chair held for a player whose connection is gone does not count them.
        tables_waiting:
          type: integer
          format: int64
          minimum: 0
          description: Tables waiting for players.
      required:
      - games_running
      - players_online
      - tables_waiting
      description: "`GET /lobby/stats`."
    LobbyTable:
      type: object
      properties:
        clock:
          $ref: "#/components/schemas/TableClock"
          description: The pace the table plays at.
        host:
          type:
          - string
          - "null"
          description: The host's handle (`Alice#af03`), `null` for a table with no host.
        id:
          type: string
          description: The game's id, which every `/lobby/games/{id}/…` route takes.
        locked:
          type: boolean
          description: Whether joining needs a password.
        name:
          type: string
          description: >-
            What the table is called; empty when its host named it nothing, and a client
            then shows the host's name.
        rematch:
          type: boolean
          description: "Whether this room is the next table of one that finished: its players take their reserved chairs with `POST /lobby/games/{id}/rematch`, not `…/ready`."
        running_secs:
          type:
          - integer
          - "null"
          format: int64
          minimum: 0
          description: >-
            How long a running game has been going, in seconds as of this answer; `null`
            for a room still waiting.
        seats:
          type: array
          items:
            $ref: "#/components/schemas/LobbyChair"
          description: Every chair, in seat order.
        setup:
          $ref: "#/components/schemas/RoomSetup"
          description: >-
            The room's shared rules (starting life, free mulligans, each seat's own start,
            the table format), as `POST /lobby/games/{id}/configure` sets them.
        spectators:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
          description: How many spectators watch it now.
        spectators_allowed:
          type: boolean
          description: Whether players who hold no chair may watch it.
        startable:
          type: boolean
          description: "Whether the room could start if its host pressed Start: it is waiting and every chair is ready."
        state:
          type: string
          description: "`waiting` for a room, `playing` for a running game. A finished table (`over`) is in no listing."
          enum:
          - waiting
          - playing
          - over
        yours:
          type: boolean
          description: Whether the caller hosts it.
      required:
      - clock
      - host
      - id
      - locked
      - name
      - rematch
      - running_secs
      - seats
      - setup
      - spectators
      - spectators_allowed
      - startable
      - state
      - yours
      description: "One table of the lobby listing, as the caller sees it: a room completely, because deciding whether to sit down means seeing what is at the table. Never an account id: players are named by handle, and `yours`, `you` say what is the caller's."
    LocalRecord:
      type: object
      properties:
        complete:
          type: boolean
          description: Whether the game's end is in it.
        gzip_base64:
          type: string
          description: "The record (the JSON Lines a game's engine writes), gzip, in standard base64: at most 4 MiB of gzip."
      required:
      - complete
      - gzip_base64
      description: A client's record of its own game, as the body carries it.
    OrderBody:
      type: object
      properties:
        profile:
          type: string
          description: The profile's id (`GET /lobby/llm-profiles`).
        deck_text:
          type:
          - string
          - "null"
          description: >-
            The deck the model plays, as text in any format the seat bridge reads (at most
            64 KiB); absent, the bridge plays its own. A deck the host gives the chair (`POST
            …/seats/{seat}`) wins over either.
      required:
      - profile
      additionalProperties: false
      description: The profile to seat, and the deck it plays.
    PlayerLookup:
      type: object
      properties:
        tag:
          type: string
          description: Their tag.
        handle:
          type: string
          description: Their handle (`Alice#af03`).
        friend:
          type: boolean
          description: Whether they are the caller's friend.
        incoming:
          type: boolean
          description: Whether they asked the caller to be friends.
        outgoing:
          type: boolean
          description: Whether the caller asked them.
        blocked:
          type: boolean
          description: Whether the caller blocked them.
      required:
      - tag
      - handle
      - friend
      - incoming
      - outgoing
      - blocked
      description: A player as the caller sees them, and how the two stand.
    PoolBody:
      type: object
      properties:
        total:
          type: integer
          format: int64
          minimum: 0
          description: How many cards the pool holds, which is how many rows follow.
        pool_hash:
          type: string
          description: >-
            The compiled pool's hash (16 hex digits), so a client can keep the rows and ask
            again only when the pool changed.
        lang:
          type: string
          description: "The language the rows are in: `lang` as asked, or `en` for a language the catalog does not hold."
        has_text:
          type: boolean
          description: "Whether rules text came with the rows: `false` without a catalog, or while it is down."
        cards:
          type: array
          items:
            $ref: "#/components/schemas/PoolCard"
          description: Every card a deck may be built from, one row per card.
      required:
      - total
      - pool_hash
      - lang
      - has_text
      - cards
      description: The answer to `GET /pool`.
    PoolCard:
      type: object
      properties:
        index:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
          description: "The card's registry index (`CardIndex`): its rules identity in this build, which `GET /printings?card=` takes."
        name:
          type: string
          description: The name in the served language; the English name where the catalog has none.
        english_name:
          type: string
          description: "The English name, always: the name a deck line stores it under, whatever language the player reads."
        mana_cost:
          type: string
          description: >-
            The front face's mana cost in Scryfall's notation (`{2}{W/U}`); empty for a
            card without one, such as a land.
        cmc:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
          description: The mana value of that cost.
        colors:
          type: string
          description: The colours of that cost as `WUBRG` letters, empty for colourless.
        identity:
          type: string
          description: "The card's colour identity as `WUBRG` letters, empty for colourless: what a commander deck is bounded by."
        type_line:
          type: string
          description: >-
            The front face's whole type line, supertypes through subtypes, in the served
            language where the catalog has it.
        kinds:
          type: array
          items:
            type: string
          description: >-
            The front face's card types as English words (`Creature`, `Land`, …), whatever
            the served language.
        stats:
          type:
          - string
          - "null"
          description: >-
            The front face's power/toughness (`2/3`) or starting loyalty (`4`); `null` for
            a card that prints neither.
        oracle_text:
          type: string
          description: >-
            The rules text of every face, in printed order, joined by a line `//`; empty
            without a catalog, while it is down, or for a card it lacks.
        coverage:
          type: string
          description: "How much of the card this build plays: `implemented` (all of it, and tested), `generated` (all of it, read from a card script and not yet tested), `partial` (some of it; `note` says what is missing) or `unimplemented` (none of it: it cannot be played)."
          enum:
          - implemented
          - generated
          - partial
          - unimplemented
        note:
          type:
          - string
          - "null"
          description: >-
            Why a `partial` card is only partly there, in its author's words; `null` for
            every other card.
        commander:
          type: boolean
          description: Whether the card may lead a commander deck.
        partners:
          type: array
          items:
            type: integer
            format: int64
            minimum: 0
            maximum: 4294967295
          description: >-
            The registry indexes of the commanders this one may lead a deck together with;
            left out when there are none.
        basic_land:
          type: boolean
          description: Whether it is a basic land, the one card a deck may hold any number of.
        has_back_image:
          type: boolean
          description: "Whether its printing has a second picture (a back face) to turn to; left out when it has none. Not the same as `double_faced`: a meld card is double-faced with no back picture."
        double_faced:
          type: boolean
          description: >-
            Whether it is a double-faced card (an adventurer or split card is not); left
            out when it is not.
        scryfall_id:
          type: string
          description: The Scryfall id of the printing this build references, for its picture.
        oracle_id:
          type: string
          description: The card's Scryfall oracle id, shared by every printing in every language.
        alt_names:
          type: array
          items:
            type: string
          description: "Every other name it is printed under, to search by: its names in other languages the catalog holds, and the whole `A // B` spelling of a card with two faces. Left out when there are none."
        produces:
          type: string
          description: "The kinds of mana its printed mana abilities make, as `WUBRGC` letters: what a deck's colour sources are counted by. Left out when there are none."
      required:
      - index
      - name
      - english_name
      - mana_cost
      - cmc
      - colors
      - identity
      - type_line
      - kinds
      - stats
      - oracle_text
      - coverage
      - note
      - commander
      - basic_land
      - scryfall_id
      - oracle_id
      description: "One card of the pool a deck may be built from: its registry index, its printed characteristics, how much of it this build plays, and its names and rules text in the served language."
    PrintingsBody:
      type: object
      properties:
        card:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
          description: The card that was asked about.
        english_name:
          type: string
          description: Its English name.
        from_catalog:
          type: boolean
          description: "Whether the printings came from the catalog. `false`: the one printing listed is the one this build references, and the card may well have others."
        printings:
          type: array
          items:
            $ref: "#/components/schemas/CatalogPrinting"
          description: Every printing, newest set first; at least one.
      required:
      - card
      - english_name
      - from_catalog
      - printings
      description: The answer to `GET /printings`.
    Profile:
      type: object
      properties:
        id:
          type: string
          description: The account's id (a UUID).
        email:
          type:
          - string
          - "null"
          description: The address it registered with before usernames, `null` when it has none.
        username:
          type:
          - string
          - "null"
          description: The name it signs in with, shown to nobody but its owner; `null` for a guest.
        guest:
          type: boolean
          description: Whether it is a guest, deleted about thirty days after its last visit.
        display_name:
          type: string
          description: The name other players see.
        tag:
          type: string
          description: "The tag that tells two of a name apart: lowercase hex, at least four digits (`af03`)."
        handle:
          type: string
          description: The display name and tag as other players see them (`Alice#af03`).
      required:
      - id
      - email
      - username
      - guest
      - display_name
      - tag
      - handle
      description: What `GET /me` answers.
    PublicPlayer:
      type: object
      properties:
        id:
          type: string
          description: The account's id (a UUID).
        display_name:
          type: string
          description: The name other players see.
        tag:
          type: string
          description: "The tag that tells two of a name apart: lowercase hex, at least four digits (`af03`)."
        handle:
          type: string
          description: The display name and tag (`Alice#af03`).
      required:
      - id
      - display_name
      - tag
      - handle
      description: What `GET /players/{handle}` answers.
    ReadyBody:
      type: object
      properties:
        ready:
          type: boolean
          description: "`true` (also when absent) says ready, `false` takes it back."
          default: true
      description: Whether the caller is ready to play.
    RedeemBody:
      type: object
      properties:
        display_name:
          type: string
          description: "The name the chair sits under: `LLM-` and something after it, under the display-name rule."
        deck:
          $ref: "#/components/schemas/DeckBody"
          description: >-
            The deck it plays, as `POST /decks` takes one; a deck the host already gave the
            chair wins over it.
      required:
      - display_name
      - deck
      description: The name the chair sits under, and the deck it plays.
    Registration:
      type: string
      enum:
      - open
      - invite
      - "off"
      description: "Who may make an account: `open` (anybody), `invite` (somebody with a beta key; a new guest needs one too) or `off`."
    ReplayArchived:
      type: object
      properties:
        archived:
          type: boolean
          description: Whether the game is on the account's archived list.
      required:
      - archived
      additionalProperties: false
      description: "`PUT /replays/{game}/archived`'s body and answer."
    ReplayGame:
      type: object
      properties:
        game:
          type: string
          description: The game's id.
        started_at:
          type: string
          description: When it started (RFC 3339, UTC).
          format: date-time
        ended_at:
          type:
          - string
          - "null"
          description: When its record ended (RFC 3339, UTC), `null` while it has not.
          format: date-time
        complete:
          type: boolean
          description: Whether its record is complete.
        seat:
          type: integer
          format: int32
          minimum: 0
          maximum: 255
          description: The seat the asking account played.
        turn:
          type:
          - integer
          - "null"
          format: int64
          minimum: 0
          maximum: 4294967295
          description: How many turns it lasted, `null` when unknown.
        result:
          type: string
          description: "How it went for the asking account's seat: `won`, `lost`, `draw`, `unfinished` (the record has no end) or `unknown` (a game that ended before the gateway noted how)."
          enum:
          - won
          - lost
          - draw
          - unfinished
          - unknown
        public:
          type: boolean
          description: >-
            Whether the account may ask for the public perspective; every seated account
            may.
        archived:
          type: boolean
          description: Whether the asking account archived it.
        check:
          type: string
          description: "How far today's build is known to replay it as played: `exact` (the same build), `checked` (checked against what the table showed) or `unverified` (ask its tape with `verify: note`)."
          enum:
          - exact
          - checked
          - unverified
        build:
          type:
          - string
          - "null"
          description: The build its engine was, `null` when not recorded.
        seats:
          type: array
          items:
            $ref: "#/components/schemas/ReplaySeat"
          description: Every seat at the table.
      required:
      - game
      - started_at
      - ended_at
      - complete
      - seat
      - turn
      - result
      - public
      - archived
      - check
      - build
      - seats
      description: One listed game.
    ReplayListing:
      type: object
      properties:
        games:
          type: array
          items:
            $ref: "#/components/schemas/ReplayGame"
          description: One page of the games, newest first.
        total:
          type: integer
          format: int64
          minimum: 0
          description: How many games the whole list holds.
      required:
      - games
      - total
      description: "`GET /replays`'s answer."
    ReplaySeat:
      type: object
      properties:
        seat:
          type: integer
          format: int32
          minimum: 0
          maximum: 255
          description: The seat's number.
        who:
          type: string
          description: "Who sat there, to the asking account: `you`, `player`, `former` (a player whose account is gone), `house` (the house AI) or `model` (a seat bridge)."
          enum:
          - you
          - player
          - former
          - house
          - model
        name:
          type: string
          description: "What the seat is called: a player's handle (`Name#tag`), `House AI`, `Language model` or `Former player`."
        colours:
          type: string
          description: >-
            The deck's colour identity as `WUBRG` letters, for the asking account's own
            seat only.
        commander:
          type:
          - integer
          - "null"
          format: int64
          minimum: 0
          maximum: 4294967295
          description: The deck's commander as a `CardIndex`, `null` for none; public at the table.
        shared:
          type: boolean
          description: "Whether the seat's hidden cards may be shown in this game's replays: its player shared them (or did not say, in a game recorded from the beta.7 deploy on), or it is an AI seat."
        mine:
          type: boolean
          description: Whether the asking account played this seat.
      required:
      - seat
      - who
      - name
      - commander
      - shared
      - mine
      description: One seat of a listed game.
    ReplayShare:
      type: object
      properties:
        seat:
          type: integer
          format: int32
          minimum: 0
          maximum: 255
          description: The asking account's seat at the game.
        shared:
          type: boolean
          description: Whether its hidden cards are shown in the game's replays now.
      required:
      - seat
      - shared
      description: "`PUT /replays/{game}/share`'s answer."
    ReplayShareAsk:
      type: object
      properties:
        shared:
          type: boolean
          description: >-
            Whether the other players may see this seat's hidden cards in the game's
            replays.
      required:
      - shared
      additionalProperties: false
      description: "`PUT /replays/{game}/share`'s body."
    Replays:
      type: object
      properties:
        version:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
          description: The tape's version.
      required:
      - version
      description: "`GET /info`'s `replays`."
    Report:
      type: object
      properties:
        kind:
          $ref: "#/components/schemas/ReportKind"
          description: What it is about.
        text:
          type: string
          description: What the player says, at most 20000 characters.
        game_id:
          type:
          - string
          - "null"
          description: >-
            The game of this gateway's it is about, at most 128 characters; `null`, empty
            or left out for none. When the reporter sat at it, that game's record goes with
            the report.
        client:
          description: "Anything the client wants to say: a JSON object, at most 2 MiB serialized."
          type: object
        local_record:
          anyOf:
          - $ref: "#/components/schemas/LocalRecord"
          - type: "null"
          description: >-
            The record of a game the client hosted itself, as it wrote it; never beside a
            `game_id`.
      required:
      - kind
      - text
      - client
      description: >-
        A bug report, crash report or feedback. It is about one game of this gateway's
        (`game_id`), one the client hosted itself (`local_record`), or none; never both.
    ReportKind:
      type: string
      enum:
      - bug
      - improvement
      - feedback
      - crash
      - other
      description: "What a report is about: `bug` (something is broken), `improvement`, `feedback`, `crash` (the client crashed; sent by the client) or `other`."
    ReportReceipt:
      type: object
      properties:
        report_id:
          type: string
          description: The feedback service's id for the report.
      required:
      - report_id
      description: >-
        What a report route answers when the feedback service took the report (`POST
        /social/reports`, and `POST /reports` in the same shape).
    RequestAnswer:
      type: object
      properties:
        state:
          $ref: "#/components/schemas/RequestState"
          description: "`pending`, or `friends` when they had asked already."
      required:
      - state
      description: The answer to a friend request (`201`).
    RequestState:
      type: string
      enum:
      - pending
      - friends
      description: "Where a friend request stands: `pending` (sent, unanswered) or `friends` (they had asked already)."
    ResumableSeat:
      type: object
      properties:
        game_id:
          type: string
          description: The game it is at.
        playing:
          type: boolean
          description: "Whether the game is running (`false`: a room still waiting)."
        seat:
          type: integer
          format: int64
          minimum: 0
          description: The chair's seat number, counted from 0.
      required:
      - game_id
      - playing
      - seat
      description: A chair the caller holds and may take back (`POST /lobby/games/{id}/seat`).
    ResumableSeats:
      type: object
      properties:
        seats:
          type: array
          items:
            $ref: "#/components/schemas/ResumableSeat"
          description: The caller's chairs, running games first, then the newest.
      required:
      - seats
      description: "`GET /lobby/seats`."
    RoomSeatSetup:
      type: object
      properties:
        life:
          type:
          - integer
          - "null"
          format: int32
          description: >-
            The life this seat starts with, 1 to 999, in place of the shared starting life;
            `null` for the shared one.
          minimum: 1
          maximum: 999
        permanents:
          type: array
          items:
            type: string
          description: "Permanents this seat starts with on the battlefield, apart from its deck: one line per copy, a card name with the deck row's printing, set, collector number, language and finish suffixes but no count. At most 32, each at most 500 bytes without `;` or a line break; every line must name a card this build has."
        counters:
          type: array
          items:
            type: array
            items:
              $ref: "#/components/schemas/StartingCounter"
          description: >-
            The counters each of those permanents starts with, by its position in
            `permanents`; at most one list per permanent, each of at most 32 entries.
      description: One seat's own starting position. Every field may be left out of a request.
    RoomSetup:
      type: object
      properties:
        starting_life:
          type: integer
          format: int32
          description: The life every player starts with, 1 to 999, unless their seat says otherwise.
          minimum: 1
          maximum: 999
        free_mulligans:
          type: integer
          format: int32
          minimum: 0
          maximum: 7
          description: How many opening redraws cost no cards, 0 to 7.
        seats:
          type: array
          items:
            $ref: "#/components/schemas/RoomSeatSetup"
          description: >-
            Each seat's own starting life and permanents, by seat number from 0; at most
            one per chair, and a seat with no entry starts as the shared rules say.
        format:
          $ref: "#/components/schemas/TableFormat"
          description: Which decks the room is for; left out when `host`.
      description: "A room's shared rules and each seat's own starting position. Every field may be left out of a request: starting life 40, one free mulligan, no seat of its own, the `host` format."
    RoomUpdate:
      type: object
      properties:
        name:
          type: string
          description: "The room's public name: at most 60 characters, no control character; empty for none (a client then shows the host's name)."
        chairs:
          type: integer
          format: int64
          minimum: 2
          description: >-
            How many chairs the table has, two through eight; a chair someone sits in
            cannot be removed.
          maximum: 8
        password:
          type:
          - string
          - "null"
          description: "A new password, at most 128 bytes: empty removes it, `null` or absent keeps the one the room has."
        setup:
          $ref: "#/components/schemas/RoomSetup"
          description: The shared rules and each seat's starting position.
      required:
      - name
      - chairs
      - setup
      description: "A host's edit of a waiting room, made whole or not at all: its name, chairs, password and shared rules."
    SearchHit:
      type: object
      properties:
        scryfall_id:
          type: string
          description: The printing's Scryfall id.
        lang:
          type: string
          description: The printing's language code (`en`, `de`, …).
        name:
          type: string
          description: The card's name in that language.
        english_name:
          type: string
          description: The card's English name.
        type_line:
          type: string
          description: The type line in that language.
      required:
      - scryfall_id
      - lang
      - name
      - english_name
      - type_line
      description: One printing that matched a catalog search.
    SeatBody:
      type: object
      properties:
        kind:
          type:
          - string
          - "null"
          description: >-
            Whether the chair is for a person or the house AI. The host's; a chair someone
            sits in cannot be made the AI's.
          enum:
          - human
          - ai
          - null
        ai:
          type:
          - string
          - "null"
          description: The difficulty an AI chair plays at. The host's.
          enum:
          - novice
          - casual
          - steady
          - sharp
          - expert
          - null
        deck_id:
          type:
          - string
          - "null"
          description: >-
            The deck the chair plays, one of the caller's own (`GET /decks`). Changing it
            takes back that chair's ready.
        team:
          type:
          - integer
          - "null"
          format: int32
          minimum: 0
          maximum: 8
          description: "The side the chair plays for: teams are numbered from 1, and `0` puts the chair back on a side of its own. The host's."
      description: >-
        What to change about one chair; an absent field leaves that setting as it is.
        `kind`, `ai` and `team` are the host's; `deck_id` is the chair's own player's (or
        the host's, for a chair nobody sits in).
    SeatCosmetics:
      type: object
      properties:
        sleeve:
          type:
          - string
          - "null"
          description: >-
            The image id of the seat's sleeve (`GET /images/{id}`), absent for the
            generated card back.
        playmat:
          type:
          - string
          - "null"
          description: The image id of the seat's playmat, absent for none.
      description: The sleeve and playmat one seat is playing with.
    SeatGrant:
      type: object
      properties:
        game_id:
          type: string
          description: >-
            The game the chair is at (for a rematch, the new room's id, not the one in the
            path).
        seat:
          type: integer
          format: int64
          minimum: 0
          description: The chair's seat number, counted from 0.
        seat_token:
          type: string
          description: "The chair's secret, sent as `Authorization: Bearer` to buy a seat socket's ticket (`POST /ws-ticket`) and to read the table's cosmetics. Handed out once; a new one (`POST /lobby/games/{id}/seat`) ends the old."
      required:
      - game_id
      - seat
      - seat_token
      description: "The caller's chair: the game it is at, its seat, and the seat token that proves it."
    SeatKind:
      type: string
      enum:
      - human
      - ai
      description: "What a chair is for: a person (`human`), once one takes it, or the house AI (`ai`), which fills it the moment it is configured."
    SettingsStored:
      type: object
      properties:
        stored:
          type: integer
          format: int64
          minimum: 0
          description: The merged preferences' size, in bytes of JSON.
      required:
      - stored
      description: What `PUT /settings` answers.
    SharedDeckRow:
      type: object
      properties:
        id:
          type: string
          description: The deck's id.
        blocked:
          type: array
          items:
            $ref: "#/components/schemas/BlockedCard"
          description: >-
            The cards of this deck blocked on this gateway now; a deck with any does not
            sit down at a table here.
        kind:
          type: string
          description: "`preconstructed` (a retail product) or `house` (published to be played with)."
          enum:
          - preconstructed
          - house
        name:
          type: string
          description: The deck's name.
        format:
          type: string
          description: What it plays (`commander`, `freeform`, …).
        description:
          type:
          - string
          - "null"
          description: What the deck is for, `null` for nothing said.
        cards:
          type: integer
          format: int64
          minimum: 0
          description: How many main-deck lines it has.
        sideboard:
          type: integer
          format: int64
          minimum: 0
          description: How many sideboard lines it has.
        commanders:
          type: array
          items:
            type: string
          description: "Its commanders: none, one, or two under the partner rule."
        version:
          type: integer
          format: int32
          description: The version its cards are, which a copy remembers.
        copies:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
          description: How many cards the main deck holds, counting copies.
        identity:
          type: string
          description: Its colour identity as `WUBRG` letters, empty for colourless.
        leaders:
          type: array
          items:
            $ref: "#/components/schemas/DeckLeader"
          description: The picture of each commander, in the order of `commanders`.
        signature:
          anyOf:
          - $ref: "#/components/schemas/DeckLeader"
          - type: "null"
          description: >-
            The picture of a deck without commanders; `null` for a deck with commanders or
            of lands alone.
        unplayable:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
          description: How many main-deck cards, counting copies, this build cannot play.
      required:
      - id
      - blocked
      - kind
      - name
      - format
      - description
      - cards
      - sideboard
      - commanders
      - version
      - copies
      - identity
      - leaders
      - signature
      - unplayable
      description: One row of `GET /decks/shared`.
    SocialInfo:
      type: object
      properties:
        version:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
          description: The chat protocol the social socket speaks.
        keep_days:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
          description: >-
            How many days an undelivered message is kept for a registered account's device
            (`BAYLEE_SOCIAL_KEEP_DAYS`, 1 to 30); a guest's device keeps it one day.
      required:
      - version
      - keep_days
      description: "`GET /info`'s `social`, or `null` when the gateway has no chat."
    SocialSettings:
      type: object
      properties:
        whispers_from:
          $ref: "#/components/schemas/WhispersFrom"
          description: Who may whisper this account.
        requests_open:
          type: boolean
          description: Whether others may send this account a friend request.
        share_table:
          type: boolean
          description: >-
            Whether friends are shown which table this account is at (never a table with a
            password).
      required:
      - whispers_from
      - requests_open
      - share_table
      description: The settings the gateway enforces for an account.
    SourceOffer:
      type: object
      properties:
        name:
          type: string
          description: "The program: `baylee`."
        license:
          type: string
          description: Its licence, an SPDX identifier.
        source:
          type: string
          description: >-
            Where this build's source is (`BAYLEE_SOURCE_URL`, else the repository it was
            built from).
      required:
      - name
      - license
      - source
      allOf:
      - $ref: "#/components/schemas/Build"
      description: "`GET /source`."
    StartingCounter:
      type: object
      properties:
        kind:
          type: string
          description: "The kind, at most 40 bytes: a counter's name (`loyalty`, `charge`, `shield`, …), a power/toughness pair with both signs alike (`+1/+1`, `-2/-2`), or `custom:` and a number."
        amount:
          type: integer
          format: int32
          minimum: 1
          maximum: 999
          description: How many are placed before the game begins, 1 to 999.
      required:
      - kind
      - amount
      description: One kind of counter a starting permanent carries, and how many.
    TableClock:
      type: object
      properties:
        decide_secs:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
          description: Seconds a player has for each decision; 0 for no decision clock.
        reconnect_secs:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
          description: Seconds a seat that lost its connection is held before the house answers for it.
      required:
      - decide_secs
      - reconnect_secs
      description: The pace a table plays at.
    TableFormat:
      type: string
      enum:
      - mixed
      - host
      default: host
      description: "Which decks a room is for: `host` (the host's deck names the table's format, and a player whose deck is of another format is warned) or `mixed` (decks of every format side by side, nobody warned). It changes no rule. A word the gateway does not know reads as `host`."
    TagBody:
      type: object
      properties:
        tag:
          type: string
          description: "The account's tag: lowercase hex, four to eight digits."
      required:
      - tag
      description: One account, by tag.
    TapeAsk:
      type: object
      properties:
        perspective:
          $ref: "#/components/schemas/TapePerspective"
          description: Whose view the tape shows.
        seat:
          type:
          - integer
          - "null"
          format: int32
          minimum: 0
          maximum: 255
          description: >-
            The seat the table is drawn from, the asking account's own when absent; ignored
            for `public`.
        verify:
          $ref: "#/components/schemas/TapeVerify"
          description: What a departure from the record does; `stop` when absent.
          default: stop
      required:
      - perspective
      additionalProperties: false
      description: >-
        What tape to make. Whose hidden cards it may hold the gateway decides from each
        seat's consent, never the request; any other field is refused.
    TapePerspective:
      type: string
      enum:
      - seat
      - public
      - all_hands
      description: "Whose view the tape shows: `seat` (what a seat was sent), `public` (what spectators were sent) or `all_hands` (a seat's view and every shown seat's hand)."
    TapeVerify:
      type: string
      enum:
      - stop
      - note
      default: stop
      description: "What a replay that departs from the record does: `stop` there, or `note` it and go on unverified."
    TermsAccepted:
      type: object
      properties:
        version:
          type: string
          description: The version the account has now accepted.
      required:
      - version
      description: What `POST /account/terms` answers.
    TermsDocument:
      type: object
      properties:
        version:
          type: string
          description: The version an account accepts, the same in every language.
        digest:
          type: string
          description: "The digest of every language's text, 64 lowercase hex digits: what an acceptance at Baylee Central names beside the version."
        markdown:
          type: string
          description: The text, as Markdown.
        updated:
          type: string
          description: The date the text says it was last changed (`2026-10-06`), when it says.
        lang:
          type: string
          description: >-
            The language the text is in, a primary language tag (`de`); absent when the
            gateway has one text for every language.
      required:
      - version
      - digest
      - markdown
      description: What `GET /terms` answers.
    TicketFor:
      type: object
      oneOf:
      - $ref: "#/components/schemas/TicketForLobby"
      - $ref: "#/components/schemas/TicketForSeat"
      - $ref: "#/components/schemas/TicketForSocial"
      - $ref: "#/components/schemas/TicketForWatch"
      discriminator:
        propertyName: socket
        mapping:
          lobby: "#/components/schemas/TicketForLobby"
          seat: "#/components/schemas/TicketForSeat"
          social: "#/components/schemas/TicketForSocial"
          watch: "#/components/schemas/TicketForWatch"
      description: Which socket the ticket opens, by `socket`.
    TicketForLobby:
      type: object
      properties:
        socket:
          type: string
          enum:
          - lobby
          description: "Discriminator: lobby"
      required:
      - socket
      description: "`/lobby/ws`, proven by the session in `Authorization`."
    TicketForSeat:
      type: object
      properties:
        socket:
          type: string
          enum:
          - seat
          description: "Discriminator: seat"
        game:
          type: string
          description: The game the seat is at.
      required:
      - socket
      - game
      description: "`/games/{game}/ws`, proven by that seat's token in `Authorization`."
    TicketForSocial:
      type: object
      properties:
        socket:
          type: string
          enum:
          - social
          description: "Discriminator: social"
      required:
      - socket
      description: "`/social/ws`, proven by the session; refused `403` on a gateway without chat."
    TicketForWatch:
      type: object
      properties:
        socket:
          type: string
          enum:
          - watch
          description: "Discriminator: watch"
        game:
          type: string
          description: The game to watch.
      required:
      - socket
      - game
      description: "`/games/{game}/watch`, proven by the session; refused `403` at a table that allows no spectators."
    TicketGrant:
      type: object
      properties:
        expires_in:
          type: integer
          format: int64
          minimum: 0
          description: Seconds it lives unspent.
        ticket:
          type: string
          description: "The ticket: random, single use, and spent the moment it is shown, whether or not what it opens is still there."
      required:
      - expires_in
      - ticket
      description: A single-use ticket and how long it lives.
    WhispersFrom:
      type: string
      enum:
      - friends
      - friends_and_tables
      default: friends_and_tables
      description: "Who may whisper an account: `friends`, or `friends_and_tables` (also the players with a chair at a table it sits at; the default)."
tags:
- name: Gateway
  description: What the gateway is and whether it is well
- name: Accounts
  description: Signing in and out, guests, the account and its settings
- name: Terms
  description: The terms of use and their acceptance
- name: Lobby
  description: Rooms, seats and the games the lobby lists
- name: Chairs
  description: A host's chair for a seat bridge, and hosted model seats
- name: Decks
  description: A player's decks and their pictures
- name: Catalog
  description: Card text, search, printings and card images
- name: Replays
  description: Replays of hosted games
- name: Social
  description: Friends, chat devices and sealed messages
- name: Central
  description: Baylee Central accounts at this gateway
- name: Reports
  description: Bug reports a client sends on
