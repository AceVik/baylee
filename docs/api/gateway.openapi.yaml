              schema:
                $ref: "#/components/schemas/ErrorBody"
  /social/invites:
    post:
      summary: Invite a friend to the caller's table
      description: |-
        Invites a friend to the lobby game the caller sits in: to
        sit down in a waiting room with an open person's chair (`join`), or to
        watch a running table that allows spectators (`watch`). It stands ten
        minutes and replaces an earlier invite of that friend to that game; a
        `join` invite stands in for the room's password at
        `POST /lobby/games/{id}/join`.
      operationId: social_invite_to_table
      tags:
      - Social
      security:
      - bearer: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteRequest"
        required: true
      responses:
        "201":
          description: The invite's id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Created"
        "401":
          description: No bearer token, or one that is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: |-
            - The account is banned (`ban`) or must accept the terms in force first (`terms_required`)
            - This gateway has no chat, the caller is a guest (who has no friends list), the invitee is not a friend, the caller does not sit at that table, or it has no chair or watching to offer, or the account is banned (`ban`) or must accept the terms in force first (`terms_required`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: No such player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
