      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeckBody"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeckCreated"
        "400":
          description: "The deck is refused: its name, a card line, a commander or the deck's size (the error names it)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: No bearer token, or one that is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: |-
            - The account is banned (`ban`) or must accept the terms in force first (`terms_required`)
            - A sleeve or playmat the account did not upload (`that picture is not yours`); or the account is banned (`ban`) or must accept the terms in force first (`terms_required`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "415":
          description: The body is not sent as `application/json` (axum's rejection)
          content:
