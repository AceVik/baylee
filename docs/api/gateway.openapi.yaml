openapi: "3.1.0"
info:
  title: Baylee gateway
  version: 0.1.1-beta.9a
  description: "A Baylee gateway: accounts, decks, the lobby, and the games its agents host. The gateway runs no rules; a game's engine speaks to its seats over the WebSocket routes, which this document lists but does not describe frame by frame (`docs/protocol.md`)."
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
- url: http://127.0.0.1:28766
  description: >-
    A gateway on this machine (`PORT`, default 28766). The same routes are served
    on `BAYLEE_UNIX_SOCKET` when it is set.
paths:
  /account:
    delete:
      summary: Delete one's own account
      description: |-
        Deletes the caller's account here and everything it owns:
        its sessions, decks and their history, preferences and the pictures no
        other account claims; its chairs and sockets close. The body is `{}`.
        Open to a session that has not accepted the terms in force.
      operationId: delete_account
      tags:
      - Accounts
      security:
      - bearer: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Farewell"
        required: true
      responses:
        "204":
          description: The account is deleted
        "401":
          description: No bearer token, or one that is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: The account is banned (`ban`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: The account store or Baylee Central is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  "/art/{size}/{face}/{a}/{b}/{file}":
    get:
      summary: One card image, from this gateway's mirror
      description: |-
        A printing's image in Scryfall's own path shape, served
        from this gateway's mirror and fetched from Scryfall the first time
        anyone asks. `backs` is the shelf the printed card back stands on, not
        a face. For a signed-in session only (a guest's counts); each account
        may have 300 images a minute fetched from Scryfall, and what the mirror
        already holds costs nothing.
      operationId: get_art
      tags:
      - Catalog
      parameters:
      - name: size
        in: path
        required: true
        description: The image size, as Scryfall names it
        schema:
          type: string
          enum:
          - small
          - normal
          - art_crop
      - name: face
        in: path
        required: true
        description: The printing's front or back, or `backs` for the card back
        schema:
          type: string
          enum:
          - front
          - back
          - backs
      - name: a
        in: path
        required: true
        description: The id's first character
        schema:
          type: string
      - name: b
        in: path
        required: true
        description: The id's second character
        schema:
          type: string
      - name: file
        in: path
        required: true
        description: The printing's Scryfall id, lower case, and `.jpg`
        schema:
          type: string
          pattern: ^[0-9a-f-]{36}\.jpg$
      security:
      - bearer: []
      responses:
        "200":
          description: OK
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
          headers:
            Cache-Control:
              schema:
                type: string
              description: "`private, max-age=31536000, immutable`: a printing's image never changes"
        "401":
          description: No bearer token, or one that is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: >-
            The account is banned (`ban`) or must accept the terms in force first
            (`terms_required`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: "No such image: a malformed path, the mirror switched off (`BAYLEE_ART_PATH=off`; fetch from Scryfall instead), or Scryfall has none"
        "429":
          description: The account has had its 300 images a minute fetched from Scryfall
        "502":
          description: Scryfall could not be reached
        "503":
          description: The account store or Baylee Central is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /auth/central/login:
    post:
      summary: Sign in with Baylee Central
      description: |-
        Trades an `admit` ticket from Baylee Central for a session
        at this gateway, for the account Central names (a gateway that is not
        the migration gateway makes a local projection of it the first time,
        only while its registration is open). Answered as a sign-in is, and the
        session's every request is checked with Central. Every refusal is a bare
        status.
      operationId: central_login
      tags:
      - Central
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CentralCapability"
        required: true
      responses:
        "200":
          description: The session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CentralSession"
        "401":
          description: >-
            The ticket is not good, the account is not linked here, it is a guest, or
            Central no longer admits it
        "403":
          description: >-
            This gateway takes no Central account (its mode is `guests`), the account is
            banned or must choose a new password first, or Central refused
        "409":
          description: Central answered a conflict
        "413":
          description: The body is over 8 KiB
          content:
            text/plain:
              schema:
                type: string
        "429":
          description: Central is busy
        "503":
          description: >-
            No Baylee Central is configured, the database or Central is unavailable, or the
            account is new here and this gateway's registration is not open
  /auth/central/admin:
    post:
      summary: Sign in to the admin console with Baylee Central
      description: |-
        Trades an `admin` ticket from Baylee Central for a bearer
        that works on the admin listener only, where each request checks the
        Central session and the account's admin membership. Not on the migration
        gateway. Every refusal is a bare status.
      operationId: central_admin_login
      tags:
      - Central
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CentralCapability"
        required: true
      responses:
        "200":
          description: The admin bearer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CentralAdminSession"
        "401":
          description: The ticket is not good, or the account is a guest
        "403":
          description: >-
            This is the migration gateway, the account is banned or must choose a new
            password first, or Central refused
        "409":
          description: Central answered a conflict
        "413":
          description: The body is over 8 KiB
          content:
            text/plain:
              schema:
                type: string
        "429":
          description: Central is busy
        "503":
          description: No Baylee Central is configured, or the database or Central is unavailable
  "/lobby/games/{id}/chairs/{seat}/ticket":
    post:
      summary: Hand a chair to a seat bridge
      description: |-
        The room's host, signed in to a registered account, asks
        for a chair ticket for one open person's chair, and hands it to the seat
        bridge it starts (never in an address). The bridge sits down with it
        (`POST …/chairs/{seat}/redeem`) as the host's delegate. Single use,
        bound to this room, chair and host, and dropped when the host leaves or
        hands the room on. Refused on a gateway that hands no chair to a bridge
        (`BAYLEE_CHAIR_TICKETS=off`) before the session is read.
      operationId: mint_chair_ticket
      tags:
      - Chairs
      parameters:
      - name: id
        in: path
        required: true
        description: The room's game id
        schema:
          type: string
      - name: seat
        in: path
        required: true
        description: The chair, counted from 0
        schema:
          type: integer
          format: int64
          minimum: 0
      security:
      - bearer: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketGrant"
        "401":
          description: No bearer token, or one that is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: |-
            - The account is banned (`ban`) or must accept the terms in force first (`terms_required`)
            - The account is banned (`ban`) or must accept the terms first (`terms_required`); this gateway hands no chair to a seat bridge, the caller is a guest, or it is not the room's host
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: No such room (`no such game`) or chair (`no such seat`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: The game has started, or the chair is not an open person's chair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: More than 30 chair tickets asked for by this host in a minute
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: |-
            - The account store or Baylee Central is unavailable
            - The account store or Baylee Central is unavailable, or too many chairs are being handed over
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  "/lobby/games/{id}/chairs/{seat}/redeem":
    post:
      summary: Sit down on a host's chair ticket
      description: |-
        A seat bridge sits in the chair its host's ticket names, as
        that host's delegate: no account is made, and the listing shows the
        chair under the bridge's name with the host's handle beside it. The
        ticket, as `Authorization: Bearer`, is spent whether or not the chair is
        still there; the body is checked first, so a malformed one does not
        spend it. The chair is ready once the bridge says so
        (`POST …/chair/ready`).
      operationId: redeem_chair_ticket
      tags:
      - Chairs
      parameters:
      - name: id
        in: path
        required: true
        description: The room's game id
        schema:
          type: string
      - name: seat
        in: path
        required: true
        description: The chair the ticket was asked for
        schema:
          type: integer
          format: int64
          minimum: 0
      security:
      - chairTicket: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedeemBody"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChairGrant"
        "400":
          description: >-
            The name is not a language model's (`LLM-…`), or the deck is not one `POST
            /decks` would take
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: "No ticket, or one that opens nothing: unknown, spent, expired, for another chair, or its host's session ended (`ticket expired or used`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: >-
            This gateway hands no chair to a seat bridge, or the host who handed the chair
            over no longer hosts the room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: No such room (`no such game`) or chair (`no such seat`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: >-
            The game has started, or the chair was taken meanwhile (or no longer waits for
            this hosted model)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: More than 30 redemptions from this address in a minute
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  "/lobby/games/{id}/chair":
    get:
      summary: A chair's own view of its room
      description: |-
        What a seat bridge, which has a seat token and no session,
        waits for the start with: whether the game is on, at what pace, whether
        its chair is ready, and the deck it will play. `401` once the token
        opens nothing (the host took the chair back, or left).
      operationId: chair_status
      tags:
      - Chairs
      parameters:
      - name: id
        in: path
        required: true
        description: The game's id
        schema:
          type: string
      security:
      - seatToken: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChairStatus"
        "401":
          description: >-
            No seat token, or one that is not this game's any more (`ticket expired or
            used`, `invalid seat token`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: No such game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  "/lobby/games/{id}/chair/ready":
    post:
      summary: A seat bridge says its model is ready
      description: |-
        A host's seat bridge says its mind answered its check, so
        its chair may play; until it does the room does not start. The host
        rearranging the table does not take it back. A person says ready with
        their session (`POST /lobby/games/{id}/ready`).
      operationId: chair_ready
      tags:
      - Chairs
      parameters:
      - name: id
        in: path
        required: true
        description: The room's game id
        schema:
          type: string
      security:
      - seatToken: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChairReadyBody"
        required: true
      responses:
        "204":
          description: Said
        "401":
          description: >-
            No seat token, or one that is not this game's any more (`ticket expired or
            used`, `invalid seat token`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: The chair is a person's, not a seat bridge's
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: No such game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: The game has already started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  "/lobby/games/{id}/chair/leave":
    post:
      summary: A seat bridge gives its chair back
      description: |-
        A host's seat bridge gives its chair back before the game,
        which empties it and ends its seat token. A person leaves with their
        session (`POST /lobby/games/{id}/leave`).
      operationId: chair_leave
      tags:
      - Chairs
      parameters:
      - name: id
        in: path
        required: true
        description: The room's game id
        schema:
          type: string
      security:
      - seatToken: []
      responses:
        "204":
          description: The chair is open again
        "401":
          description: >-
            No seat token, or one that is not this game's any more (`ticket expired or
            used`, `invalid seat token`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: The chair is a person's, not a seat bridge's
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: No such game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: The game has already started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /images:
    post:
      summary: Upload a sleeve or playmat
      description: |-
        Stores one picture, sent as the raw body, for the decks of
        the account that uploaded it. It is centre-cropped to its kind's shape
        and stored as a JPEG at one size (a sleeve 488×680, a playmat 1024×512);
        the answer's `id`, a hash of what is stored, is what a deck's `sleeve`
        or `playmat` names. A registered account only, never a guest.
      operationId: upload_image
      tags:
      - Decks
      parameters:
      - name: kind
        in: query
        required: true
        description: What the picture is for
        schema:
          type: string
          enum:
          - sleeve
          - playmat
      security:
      - bearer: []
      requestBody:
        content:
          image/png:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageUploaded"
        "400":
          description: The body is not a PNG or a JPEG
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: No bearer token, or one that is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: |-
            - The account is banned (`ban`) or must accept the terms in force first (`terms_required`)
            - A guest (`guests cannot upload images`), a banned account (`ban`), or one that must accept the terms in force first (`terms_required`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: No `kind`, or one that is neither `sleeve` nor `playmat`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "413":
          description: A body over 8 mebibytes (axum's rejection)
          content:
            text/plain:
              schema:
                type: string
        "500":
          description: The picture could not be stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: |-
            - The account store or Baylee Central is unavailable
            - Uploads are off on this gateway (`BAYLEE_DECK_IMAGE_PATH=off`), or its account store or Baylee Central is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  "/images/{id}":
    get:
      summary: One stored sleeve or playmat
      description: |-
        The stored JPEG of an uploaded sleeve or playmat. Anyone
        may fetch one: every seat at a table is told its decks' picture ids
        (`GET /games/{id}/cosmetics`), and an id is a content hash, so the
        image never changes.
      operationId: get_image
      tags:
      - Decks
      parameters:
      - name: id
        in: path
        required: true
        description: The picture's id, as `POST /images` answered it
        schema:
          type: string
          pattern: ^[0-9a-f]{64}$
      security: []
      responses:
        "200":
          description: OK
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
          headers:
            Cache-Control:
              schema:
                type: string
              description: "`public, max-age=31536000, immutable`"
        "404":
          description: No such image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /lobby/depart:
    post:
      summary: Leave every table on purpose
      description: |-
        What a client sends when its player leaves on purpose (never
        when the application merely closes). The caller stands up from every
        waiting room at once, and every running game it sits in is told the
        player left: the house takes the chair if another player is at the
        table, and the game ends if none is. `204` whether or not there was
        anything to leave.
      operationId: depart
      tags:
      - Lobby
      security:
      - bearer: []
      responses:
        "204":
          description: Left, or there was nothing to leave
        "401":
          description: No bearer token, or one that is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: >-
            The account is banned (`ban`) or must accept the terms in force first
            (`terms_required`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: The account store or Baylee Central is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /pool:
    get:
      summary: Every card a deck may be built from
      description: |-
        The whole compiled card pool, sent at once: each card's
        registry index (what a deck line resolves to), its printed
        characteristics, whether this build plays it (`coverage`), and the
        catalog's names and rules text in `lang` when this gateway has a
        catalog, English field by field otherwise. A catalog that is down costs
        the text, never the answer. For a signed-in session, a guest's included.
      operationId: pool
      tags:
      - Catalog
      parameters:
      - name: lang
        in: query
        required: false
        description: >-
          The language for names and rules text (`en` when absent), English where the
          catalog has none.
        schema:
          type: string
      security:
      - bearer: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoolBody"
        "401":
          description: No bearer token, or one that is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: >-
            The account is banned (`ban`) or must accept the terms in force first
            (`terms_required`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: The account store or Baylee Central is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /printings:
    get:
      summary: Every printing of one card
      description: |-
        Every printing of one pool card the catalog knows (set,
        collector number, language, rarity, artist, finishes, …), newest set
        first. Without a catalog, or for a card it lacks, the one printing this
        build references, in English, with `from_catalog: false`. For a
        signed-in session, a guest's included.
      operationId: printings
      tags:
      - Catalog
      parameters:
      - name: card
        in: query
        required: true
        description: The registry index of the card (a `/pool` row's `index`).
        schema:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
      security:
      - bearer: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrintingsBody"
        "400":
          description: No `card`, or one that is not a number (axum's rejection)
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: No bearer token, or one that is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: >-
            The account is banned (`ban`) or must accept the terms in force first
            (`terms_required`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: No such card in this build's pool
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: The account store or Baylee Central is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /reports:
    post:
      summary: Send a bug report or feedback
      description: |-
        A signed-in player's bug report, crash report or feedback,
        guests included. The gateway passes it on to the feedback service with
        its own name and build, a pseudonym for the reporter, and the record of
        the game it names when the reporter sat at it (or the client's own
        record of a local game); never a name, address or IP. 64 reports an
        hour per account; one the service did not take is not counted.
      operationId: send_report
      tags:
      - Reports
      security:
      - bearer: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Report"
        required: true
      responses:
        "201":
          description: The feedback service took it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportReceipt"
        "400":
          description: "Not a report: not JSON, an unknown `kind`, no `text`, `client` not an object, a `game_id` over 128 characters, or a `local_record` beside a `game_id` or not base64 of gzip"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: No bearer token, or one that is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: >-
            The account is banned (`ban`) or must accept the terms in force first
            (`terms_required`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "413":
          description: >-
            The text is over 20000 characters, `client` over 2 MiB, or the `local_record`
            over 4 MiB; a body over 7.58 MiB is refused before it is read, in plain text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: 64 reports in the last hour from this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: The report could not be encoded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "502":
          description: The feedback service did not take it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: |-
            - The account store or Baylee Central is unavailable
            - Reports are not configured here (`BAYLEE_FEEDBACK_URL` unset), or the account store, the database or Baylee Central is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  "/lobby/games/{id}/configure":
    post:
      summary: Change a waiting room's settings
      description: |-
        The host sets the room's name, its number of chairs, its
        password (`null` keeps it, empty removes it) and its shared rules
        (starting life, free mulligans, each seat's own life and starting
        permanents, the table format), all at once or not at all. A chair
        someone sits in cannot be removed; a change to the rules or the chairs
        takes back every chair's ready. Answers the whole listing as the caller
        sees it.
      operationId: configure_room
      tags:
      - Lobby
      parameters:
      - name: id
        in: path
        required: true
        description: The room's game id
        schema:
          type: string
      security:
      - bearer: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomUpdate"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LobbyListing"
        "400":
          description: >-
            A setting out of bounds (life 1 to 999, free mulligans 0 to 7, 2 to 8 chairs,
            at most 32 starting permanents a seat), a name over 60 characters or with a
            control character, a password over 128 bytes, or a starting permanent that does not
            resolve
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: No bearer token, or one that is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: |-
            - The account is banned (`ban`) or must accept the terms in force first (`terms_required`)
            - The account is banned (`ban`) or must accept the terms first (`terms_required`), or the caller is not the host (`only the host arranges seats`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: No such room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: The game has started, or someone sits in a chair the edit removes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: The house deck is missing from this build
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: The account store or Baylee Central is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /catalog/text:
    get:
      summary: Card text in a player's language
      description: |-
        The text of the cards (`oracle_ids`) or printings (`ids`)
        asked for, in `lang` with English as the fallback, one entry per card or
        printing the catalog knows; one it lacks is left out, and a request with
        neither list is answered `[]`. For a signed-in session, a guest's
        included.
      operationId: catalog_text
      tags:
      - Catalog
      parameters:
      - name: oracle_ids
        in: query
        required: false
        description: "Comma-separated Scryfall oracle ids: text by card. The first 500 well-formed ids are read; a malformed one is dropped. Wins over `ids` when both are given."
        schema:
          type: string
      - name: ids
        in: query
        required: false
        description: "Comma-separated Scryfall printing ids: text by printing, each answered under the id asked for. Kept for clients that predate `oracle_ids`."
        schema:
          type: string
      - name: lang
        in: query
        required: false
        description: >-
          The language to answer in (`en` when absent); English where the catalog has no
          text in it.
        schema:
          type: string
      security:
      - bearer: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CardTextEntry"
        "401":
          description: No bearer token, or one that is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: >-
            The account is banned (`ban`) or must accept the terms in force first
            (`terms_required`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "502":
          description: The card catalog failed to answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: |-
            - The account store or Baylee Central is unavailable
            - This gateway has no card catalog, or its account store is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /catalog/search:
    get:
      summary: Search the card catalog
      description: |-
        Printings whose name or rules text matches `q`, in `lang`,
        at most `limit` of them. For a signed-in session, a guest's included.
      operationId: catalog_search
      tags:
      - Catalog
      parameters:
      - name: q
        in: query
        required: true
        description: "What to search for: names first, then rules text."
        schema:
          type: string
      - name: lang
        in: query
        required: false
        description: The language to search and answer in (`en` when absent).
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: "How many hits at most: 50 when absent, held to 1–200."
        schema:
          type: integer
          format: int64
          minimum: 0
      security:
      - bearer: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SearchHit"
        "400":
          description: A query without `q`, or a `limit` that is not a number (axum's rejection)
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: No bearer token, or one that is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: >-
            The account is banned (`ban`) or must accept the terms in force first
