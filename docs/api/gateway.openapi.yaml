        What a client asks before it saves a gateway: the name to
        show, the build, the versions that decide whether the two can talk, the
        source (AGPL §13), the operator's legal notice, who may come in, and
        which of the optional parts this gateway runs.
      operationId: info
      tags:
      - Gateway
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Info"
  /health:
    get:
      summary: Whether this gateway can do its job
      description: |-
        `200` while its database answers, `503` when it does not.
        Everything else (the catalog, agents, seat agents, admission, games) is
        a field and never a status: a gateway without an agent hosts no games
        and is still running as it should.
      operationId: health
      tags:
      - Gateway
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: The database does not answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /auth/config:
    get:
      summary: How this gateway signs people in
      description: |-
        What a client checks before it offers registration or a
        guest seat, whether card images and deck pictures are served, and the
        clocks a room may be opened at.
      operationId: auth_config
      tags:
      - Accounts
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthConfig"
  /lobby/games:
    get:
      summary: The lobby, searched and paged
      description: |-
        One page of the tables this gateway lists: rooms waiting
        for players and games being played, each described completely (its
        chairs, who sits in them, what they brought, the pace). A client with no
        lobby socket polls this; `GET /lobby/ws` pushes the same page on every
        change.
      operationId: list_games
      tags:
      - Lobby
      parameters:
      - name: q
        in: query
        required: false
        description: >-
          Text to find, case-insensitively and anywhere, in a table's name or its host's
          display name; a table's exact id also matches. Blank matches every table.
        schema:
          type: string
      - name: offset
        in: query
        required: false
        description: How many matching tables to skip; 0 when absent.
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: limit
        in: query
        required: false
        description: "How many tables the page holds: 25 when absent, and anything outside 1 to 100 is taken as the nearer of the two."
        schema:
          type: integer
          format: int64
          minimum: 0
          default: 25
      - name: waiting_only
        in: query
        required: false
        description: >-
          Whether to leave out the games already being played; `true`, `1` and `yes` say
          so.
        schema:
          type: boolean
      security:
      - bearer: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LobbyPage"
        "401":
          description: No bearer token, or one that is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: >-
            The account is banned (`ban`) or must accept the terms in force first
            (`terms_required`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: The account store or Baylee Central is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    post:
      summary: Open a room, or play the house AI
      description: |-
        With `mode: ai`, a game against the house AI that starts
        at once: its engine is ordered before the answer, so the seat socket
        can be opened right away. Otherwise a waiting room of `seats` chairs
        with the caller as its host in the first one. Either way the answer is
        the caller's chair.
      operationId: create_game
      tags:
      - Lobby
      security:
      - bearer: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGameBody"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeatGrant"
        "400":
          description: "No deck for `mode: ai` (`pick a deck first`), an unknown difficulty or clock, a clock out of bounds, a chair count outside 2 to 8, or a deck that does not load"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: No bearer token, or one that is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: |-
            - The account is banned (`ban`) or must accept the terms in force first (`terms_required`)
            - The account is banned (`ban`) or must accept the terms first (`terms_required`), or the deck is someone else's (`not your deck`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: No such deck
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: >-
            The deck holds a card blocked on this gateway, or the caller is still playing a
            running game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: The house deck is missing from this build
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: |-
            - The account store or Baylee Central is unavailable
            - The account store or Baylee Central is unavailable, the gateway's database is, or no engine could be ordered for `mode: ai` (no agent, or a deploy holds new games)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /lobby/seats:
    get:
      summary: Your chairs you may take back
      description: |-
        The chairs the caller holds at running games and waiting
        rooms, at most 32, running games first, then the newest. Each is taken
        back with `POST /lobby/games/{id}/seat`. A rematch chair not yet claimed
        is not one.
      operationId: list_seats
      tags:
      - Lobby
      security:
      - bearer: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumableSeats"
        "401":
          description: No bearer token, or one that is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: >-
            The account is banned (`ban`) or must accept the terms in force first
            (`terms_required`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: The account store or Baylee Central is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  "/lobby/games/{id}/rematch":
    post:
      summary: Play the same table again
      description: |-
        `{id}` is either the finished game or the room opened from
        it. The first press opens a room with the table's arrangement copied
        (chairs, sides, who sat where, the AI and its difficulty, the name, the
        password, the clock) and each player's deck as it is saved now; every
        press after that joins the same room. Pressing is also saying ready, and
        the room starts itself once every chair is ready. Answers the caller's
        chair in the new room.
      operationId: rematch
      tags:
      - Lobby
      parameters:
      - name: id
        in: path
        required: true
        description: The finished game's id, or its rematch room's
        schema:
          type: string
      security:
      - bearer: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeatGrant"
        "400":
          description: >-
            The room would start, but a deck at it does not load or a starting card does
            not resolve
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: No bearer token, or one that is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: |-
            - The account is banned (`ban`) or must accept the terms in force first (`terms_required`)
            - The account is banned (`ban`) or must accept the terms first (`terms_required`), or the caller did not sit at that table (`you were not at that table`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: No such game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: >-
            The game is not over yet, the rematch has already started, the caller is still
            playing another running game, or (the room starting) every chair is on one team
            or a deck holds a card blocked here
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: The room would start, but the house deck is missing from this build
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: |-
            - The account store or Baylee Central is unavailable
            - The account store, Baylee Central or the gateway's database is unavailable, or no engine could be ordered for a room that would start
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /replays:
    get:
      summary: The hosted games the account sat at
      description: |-
        The games on this gateway the signed-in account played a
        seat of (guests too), newest first, a page at a time: the ones it has
        not archived, or with `archived=true` only the ones it has. Each says
        how it went, who sat where, and how far this build can replay it.
      operationId: list_replays
      tags:
      - Replays
      parameters:
      - name: offset
        in: query
        required: false
        description: How many games to skip, from the newest; 0 when absent.
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: limit
        in: query
        required: false
        description: "How many games to list: 20 when absent, at most 50."
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: archived
        in: query
        required: false
        description: "`true` lists the games the account archived instead of the others."
        schema:
          type: boolean
      security:
      - bearer: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayListing"
        "400":
          description: A query value of the wrong type (axum's rejection)
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: No bearer token, or one that is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: >-
            The account is banned (`ban`) or must accept the terms in force first
            (`terms_required`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: The account store or Baylee Central is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  "/replays/{game}/tape":
    post:
      summary: Play a game again as a tape
      description: |-
        An engine plays the game again on this build from its
        record and answers what the asked perspective was sent, as gzip JSON
        Lines (`baylee_protocol::tape`): a header, the frames, and a closing
        `stop` line saying how far it is the recorded game. A tape that stops
        early is still `200`. For an account that sat at the game; a client
        retries a `502` once.
      operationId: replay_tape
      tags:
      - Replays
      parameters:
      - name: game
        in: path
        required: true
        description: The game's id
        schema:
          type: string
      security:
      - bearer: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TapeAsk"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/gzip:
              schema:
                type: string
                format: binary
        "400":
          description: The body is not a tape request, or names a seat the table lacks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: No bearer token, or one that is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: |-
            - The account is banned (`ban`) or must accept the terms in force first (`terms_required`)
            - The account sat at no seat of that game; or it is banned (`ban`) or must accept the terms in force first (`terms_required`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: No record of that game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: The game is still being played
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "413":
          description: The game's record is over 8 mebibytes compressed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: More than 6 tapes a minute, or 2 at once, for the account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "502":
          description: The tape passed 32 mebibytes compressed, or its engine failed or went away
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: |-
            - The account store or Baylee Central is unavailable
            - Replays are off (`BAYLEE_REPLAY_JOBS=0`), as many are being made as the gateway allows, no agent has room, admission is held, or the account store or Baylee Central is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "504":
          description: No tape within the job's time (`BAYLEE_REPLAY_JOB_SECS`, 60 s by default)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  "/replays/{game}/share":
    put:
      summary: Share a seat's hidden cards in replays
      description: |-
        Sets whether the other players may see the asking
        account's own seat's hidden cards in that game's replays. The seat is
        the one the table says the account played. Any time, also while the
        game is played.
      operationId: share_replay
      tags:
      - Replays
      parameters:
      - name: game
        in: path
        required: true
        description: The game's id
        schema:
          type: string
      security:
      - bearer: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplayShareAsk"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayShare"
        "400":
          description: The body is not a sharing choice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: No bearer token, or one that is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: |-
            - The account is banned (`ban`) or must accept the terms in force first (`terms_required`)
            - The account sat at no seat of that game; or it is banned (`ban`) or must accept the terms in force first (`terms_required`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: No record of that game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: The account store or Baylee Central is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  "/replays/{game}/archived":
    put:
      summary: Archive a game, or bring it back
      description: |-
        Moves the game to the asking account's archived list
        (`GET /replays?archived=true`) or back, and nothing else: the record is
        kept, other players' lists stay as they are, and its tapes are answered
        as before. Answers the choice, also when it already was so.
      operationId: archive_replay
      tags:
      - Replays
      parameters:
      - name: game
        in: path
        required: true
        description: The game's id
        schema:
          type: string
      security:
      - bearer: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplayArchived"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayArchived"
        "400":
          description: The body is not an archive choice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: No bearer token, or one that is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: |-
            - The account is banned (`ban`) or must accept the terms in force first (`terms_required`)
            - The account sat at no seat of that game; or it is banned (`ban`) or must accept the terms in force first (`terms_required`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: No record of that game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: The account store or Baylee Central is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  "/lobby/games/{id}/join":
    post:
      summary: Sit down at a waiting room
      description: |-
        Takes a person's chair in a room that has not started: the
        one named, or the first open one. A locked room wants its password (or
        an invite) before its chairs are looked at, so a wrong password learns
        nothing of how full it is. Answers the caller's chair.
      operationId: join_game
      tags:
      - Lobby
      parameters:
      - name: id
        in: path
        required: true
        description: The room's game id
        schema:
          type: string
      security:
      - bearer: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinGameBody"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeatGrant"
        "401":
          description: No bearer token, or one that is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: |-
            - The account is banned (`ban`) or must accept the terms in force first (`terms_required`)
            - The account is banned (`ban`) or must accept the terms first (`terms_required`), the password is wrong or missing (`wrong password`), or the deck is someone else's (`not your deck`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: No such room (`no such game`) or deck (`no such deck`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: >-
            The game has started, the caller already sits there, the chair is taken, the
            table is full, the deck holds a card blocked here, or the caller is still playing a
            running game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: |-
            - The account store or Baylee Central is unavailable
            - The account store or Baylee Central is unavailable, or the gateway's database is
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  "/lobby/games/{id}/seat":
    post:
      summary: Take back the chair you are in
      description: |-
        For a client that lost its seat token (a restart): hands
        the caller a new token for the chair it already holds, in a waiting
        room or a running game. Nothing else about the table changes, and the
        old token stops working.
      operationId: take_seat
      tags:
      - Lobby
      parameters:
      - name: id
        in: path
        required: true
        description: The game's id
        schema:
          type: string
      security:
      - bearer: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeatGrant"
        "401":
          description: No bearer token, or one that is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: |-
            - The account is banned (`ban`) or must accept the terms in force first (`terms_required`)
            - The account is banned (`ban`) or must accept the terms first (`terms_required`), or the caller has no chair there (`you are not at this table`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: No such game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: >-
            The game is over, or the chair cannot be resumed (a rematch chair not yet
            claimed, or a participation that ended)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: The account store or Baylee Central is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  "/lobby/games/{id}/seats/{seat}":
    post:
      summary: Arrange a chair of a waiting room
      description: |-
        The host arranges the table (which chairs are people and
        which the AI, how hard it plays, which side each chair is on); every
        player sets the deck of their own chair. A change to a chair's kind,
        difficulty or side takes back every chair's ready; a new deck or side
        takes back that chair's. Answers the whole listing as the caller sees
        it.
      operationId: set_seat
      tags:
      - Lobby
      parameters:
      - name: id
        in: path
        required: true
        description: The room's game id
        schema:
          type: string
      - name: seat
        in: path
        required: true
        description: The chair, counted from 0
        schema:
          type: integer
          format: int64
          minimum: 0
      security:
      - bearer: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SeatBody"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LobbyListing"
        "400":
          description: >-
            A `kind` other than `human` or `ai`, an unknown difficulty (`no such AI`), or a
            team above 8
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: No bearer token, or one that is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: |-
            - The account is banned (`ban`) or must accept the terms in force first (`terms_required`)
            - The account is banned (`ban`) or must accept the terms first (`terms_required`); the chair is not the caller's (`not your seat`), a setting is the host's (`only the host arranges seats`), or the deck is someone else's (`not your deck`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: No such room (`no such game`), chair (`no such seat`) or deck (`no such deck`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: >-
            The game has started, someone sits in the chair made the AI's, `ai` for a chair
            that is not the AI's, or a deck (the chosen one, or the house deck an AI chair
            gets) holds a card blocked here
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: The house deck is missing from this build
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: |-
            - The account store or Baylee Central is unavailable
            - The account store or Baylee Central is unavailable, or the gateway's database is
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  "/lobby/games/{id}/ready":
    post:
      summary: Say you are ready, or take it back
      description: |-
        Only ever about the caller's own chair, which needs a deck
        first. A rematch room starts itself once every chair is ready, so this
        may be what starts it. Answers the whole listing as the caller sees it.
      operationId: set_ready
      tags:
      - Lobby
      parameters:
      - name: id
        in: path
        required: true
        description: The room's game id
        schema:
          type: string
      security:
      - bearer: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReadyBody"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LobbyListing"
        "400":
          description: >-
            A rematch room that would start, but a deck at it does not load or a starting
            card does not resolve
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: No bearer token, or one that is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: >-
            The account is banned (`ban`) or must accept the terms in force first
            (`terms_required`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: >-
            No such room (`no such game`), or the caller has no chair there (`you are not
            at this table`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: >-
            The game has started, the chair has no deck (`pick a deck first`), the deck
            holds a card blocked here, or (a rematch room starting) every chair is on one team
            or a player is still in another running game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: A rematch room that would start, but the house deck is missing from this build
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: |-
            - The account store or Baylee Central is unavailable
            - The account store or Baylee Central is unavailable, the card catalog's database is, or no engine could be ordered for a rematch room that would start
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  "/lobby/games/{id}/start":
    post:
      summary: Start a waiting room
      description: |-
        The host's go, once every chair is ready (the listing's
        `startable`). Every deck at the table is checked again, the game's
        engine is ordered, and the room turns `playing`. Answers the whole
        listing as the caller sees it.
      operationId: start_room
      tags:
      - Lobby
      parameters:
      - name: id
        in: path
        required: true
        description: The room's game id
        schema:
          type: string
      security:
      - bearer: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LobbyListing"
        "400":
          description: >-
            A deck at the table does not load, or a starting card or printing does not
            resolve
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: No bearer token, or one that is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: |-
            - The account is banned (`ban`) or must accept the terms in force first (`terms_required`)
            - The account is banned (`ban`) or must accept the terms first (`terms_required`), or the caller is not the host (`only the host starts the game`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: No such room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: >-
            The game has started, not every chair is ready, the room changed meanwhile
            (`the room is no longer ready`), every chair is on one team, a deck holds a card
            blocked here, or a player is still in another running game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: The house deck is missing from this build
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: |-
            - The account store or Baylee Central is unavailable
            - The account store or Baylee Central is unavailable, the card catalog's database is, or no engine could be ordered (no agent, or a deploy holds new games)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  "/lobby/games/{id}/host":
    post:
      summary: Hand the room to another player
      description: |-
        The host makes whoever sits in that chair the host. The
        chair tickets the old host handed out and nobody redeemed are dropped.
        Answers the whole listing as the caller sees it.
      operationId: hand_over_room
      tags:
      - Lobby
      parameters:
      - name: id
        in: path
        required: true
        description: The room's game id
        schema:
          type: string
      security:
      - bearer: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostBody"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LobbyListing"
        "401":
          description: No bearer token, or one that is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: |-
            - The account is banned (`ban`) or must accept the terms in force first (`terms_required`)
            - The account is banned (`ban`) or must accept the terms first (`terms_required`), or the caller is not the host (`not your room`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: No such room (`no such game`) or chair (`no such seat`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: The game has started, or nobody sits in that chair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: The account store or Baylee Central is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  "/lobby/games/{id}/leave":
    post:
      summary: Stand up from a waiting room
      description: |-
        Frees the caller's chair in a room that has not started.
        A seat bridge the caller seated goes with it; a room whose host leaves
        passes to the player who joined earliest, and closes when nobody is
        left.
      operationId: leave_game
      tags:
      - Lobby
      parameters:
      - name: id
        in: path
        required: true
        description: The room's game id
        schema:
          type: string
      security:
      - bearer: []
      responses:
        "204":
          description: The chair is free
        "401":
          description: No bearer token, or one that is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: >-
            The account is banned (`ban`) or must accept the terms in force first
            (`terms_required`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: >-
            No such room (`no such game`), or the caller has no chair there (`you are not
            at this table`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: The game has already started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: The account store or Baylee Central is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /settings:
    get:
      summary: The account's client preferences
      description: |-
        The preferences the account's clients stored, as every save
        so far has merged them: an object the gateway keeps without reading it.
        `{}` for an account that has never saved any, never a `404`.
      operationId: get_settings
      tags:
      - Accounts
      security:
      - bearer: []
      responses:
        "200":
          description: The stored preferences, `{}` when there are none
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: No bearer token, or one that is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: >-
            The account is banned (`ban`) or must accept the terms in force first
            (`terms_required`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: The account store or Baylee Central is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    put:
      summary: Merge into the account's client preferences
      description: |-
        Merges an object of top-level keys into the stored
        preferences: each key named replaces that key's value whole, a key set
        to `null` is removed, and a key not named is kept. The patch and the
        merged object must each stay within 16 KiB of JSON. The answer names the
        merged object's size.
      operationId: put_settings
      tags:
      - Accounts
      security:
      - bearer: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
        required: true
        description: Top-level keys to replace; `null` removes a key
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsStored"
        "400":
          description: The body is not a JSON object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: No bearer token, or one that is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: >-
            The account is banned (`ban`) or must accept the terms in force first
            (`terms_required`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "413":
          description: The patch or the merged preferences are over 16 KiB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: The account store or Baylee Central is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /auth/guest:
    post:
      summary: Play as a guest
      description: |-
        An account with no username, address or password, and its
        session, in one answer: the session is the guest. It lasts 29 to 30 days
        past the last call made with its token, and the guest is deleted with
        its decks and preferences when it lapses or signs out. A guest may not
        upload pictures. On a closed beta a new guest needs a key.
      operationId: guest
      tags:
      - Accounts
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestBody"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestSignedIn"
        "400":
          description: The display name breaks its rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: >-
            This gateway takes no guests (its mode is `central`), or a closed beta's key is
            missing or not valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: Too many attempts from this address, or too many keys tried
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: >-
            No guest seats are free (`BAYLEE_GUEST_CAP`), or the gateway's database is
            unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /auth/logout:
    post:
      summary: Sign out
      description: |-
        Ends the session the bearer token names; a token that names
        no session is answered the same. A guest's session is the guest, so a
        guest signing out is deleted with its decks and preferences. Open to a
        session that has not accepted the terms in force.
      operationId: logout
      tags:
      - Accounts
      security:
      - bearer: []
      responses:
        "204":
          description: Signed out
        "401":
          description: No bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: The gateway's database is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /me:
    get:
      summary: Who am I
      description: |-
        The signed-in account as its owner sees it: its id, its
        address and username (shown to nobody else), whether it is a guest, and
        its display name, tag and handle.
      operationId: me
      tags:
      - Accounts
      security:
      - bearer: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          description: No bearer token, or one that is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: >-
            The account is banned (`ban`) or must accept the terms in force first
            (`terms_required`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: The account is gone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: The account store or Baylee Central is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  "/players/{handle}":
    get:
      summary: Find a player by handle
      description: |-
        What one player may know about another, found by handle:
        the id, display name, tag and handle, never an address or username. The
        tag decides; a handle without `#` is refused rather than guessed at.
      operationId: player
      tags:
      - Accounts
      parameters:
      - name: handle
        in: path
        required: true
        description: A handle, `Alice#af03`, or only its tag, `#af03`; the `#` URL-encoded as `%23`
        schema:
          type: string
      security:
      - bearer: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicPlayer"
        "400":
          description: The handle carries no `#tag`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: No bearer token, or one that is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: >-
            The account is banned (`ban`) or must accept the terms in force first
            (`terms_required`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: No player has that tag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: The account store or Baylee Central is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /lobby/stats:
    get:
      summary: How busy this gateway is
      description: |-
        Three exact numbers for a lobby's header, read from memory
        as the request is answered: no ids, no names, nothing per table. For
        signed-in sessions only, as the listing is.
      operationId: lobby_stats
      tags:
      - Lobby
      security:
      - bearer: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LobbyStats"
        "401":
          description: No bearer token, or one that is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: >-
            The account is banned (`ban`) or must accept the terms in force first
            (`terms_required`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: The account store or Baylee Central is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  "/games/{id}/cosmetics":
    get:
      summary: What every seat at a table wears
      description: |-
        Every seat's sleeve and playmat (image ids for
        `GET /images/{id}`), keyed by seat number, for the holder of one of the
        table's seat tokens. A seat that set neither is left out, so a table
        where nobody uploaded anything answers `{}` and the client draws the
        generated card back.
      operationId: game_cosmetics
      tags:
      - Lobby
      parameters:
      - name: id
        in: path
        required: true
        description: The game's id
        schema:
          type: string
      - name: token
        in: query
        required: false
        description: >-
          The seat token, for a client that cannot send `Authorization`; accepted until
          2026-10-31 (UTC) and then refused. `Authorization` wins when both are sent.
        deprecated: true
        schema:
          type: string
      security:
      - seatToken: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/SeatCosmetics"
                propertyNames:
                  pattern: ^[0-9]+$
        "401":
          description: >-
            No seat token, one that is not this game's (`invalid seat token`, `ticket
            expired or used`), or a token in the address after its end
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: No such game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /terms:
    get:
      summary: The terms of use in force
      description: |-
        The terms a player reads before accepting them: the
        version, its digest and the text, in the asked language when the gateway
        has it, else in English. `lang` and `Content-Language` say which language
        it is; a gateway with one text for every language names none. Only
        `?lang=` decides, never `Accept-Language`.
      operationId: terms
      tags:
      - Terms
      parameters:
      - name: lang
        in: query
        required: false
        description: >-
          The client's interface language (`de`, `en`; a regional tag such as `de-AT` is
          read by its first part). Absent is English.
        schema:
          type: string
      security: []
      responses:
        "200":
          description: The terms in force
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TermsDocument"
          headers:
            Content-Language:
              schema:
                type: string
              description: The language of the text, when the gateway names one
        "404":
          description: This gateway has no terms of use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /account/terms:
    post:
      summary: Accept the terms of use
      description: |-
        Records that the signed-in account accepted the terms in
        force, by the version `GET /terms` named. A version that is no longer
        current is `409`, and the client shows the new text. An account of
        Baylee Central accepts at Central instead, and is answered `409` here.
        Open to a session that has not accepted the terms in force.
      operationId: accept_terms
      tags:
      - Terms
      security:
      - bearer: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptTerms"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TermsAccepted"
        "401":
          description: No bearer token, or one that is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: The account is banned (`ban`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: This gateway has no terms of use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: >-
            The terms changed since they were shown, or the account accepts them at Baylee
            Central
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: The account store or Baylee Central is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /ws-ticket:
    post:
      summary: Buy a ticket to open a socket
      description: |-
        A browser cannot put a header on a WebSocket, and a secret
        must not ride in an address, so a socket is opened with a single-use
        ticket bought here (`?ticket=`). The lobby feed, the social socket and a
        spectator's socket are bought with the session; a seat's socket with
        that seat's token, as `Authorization: Bearer`. A ticket opens only the
        socket it was bought for, and only while what bought it still stands.
      operationId: ws_ticket
      tags:
      - Lobby
      security:
      - bearer: []
      - seatToken: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketFor"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketGrant"
        "401":
          description: |-
            - No bearer token, or one that is invalid or expired
            - No bearer, or one that opens nothing: an invalid or expired session, or a seat token that is not this game's (`invalid seat token`, `ticket expired or used`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: |-
            - The account is banned (`ban`) or must accept the terms in force first (`terms_required`)
            - The account is banned (`ban`) or must accept the terms first (`terms_required`); this gateway has no chat (`social`), or the table allows no spectators (`watch`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: No such game (`seat`, `watch`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: The table is not playing (`watch`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: |-
            - The account store or Baylee Central is unavailable
            - The account store or Baylee Central is unavailable, or too many sockets are being opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /lobby/llm-profiles:
    get:
      summary: The hosted models you may seat
      description: |-
        The language models this gateway's seat agents run that
        the caller's account may order for a chair: one row per profile, the
        available ones first, each group by label. Rows that are not available
        now are listed too, so a player knows when to come back. A guest's list
        is empty.
      operationId: hosted_profiles
      tags:
      - Chairs
      security:
      - bearer: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostedProfiles"
        "401":
          description: No bearer token, or one that is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: >-
            The account is banned (`ban`) or must accept the terms in force first
            (`terms_required`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: |-
            - The account store or Baylee Central is unavailable
            - The account store or Baylee Central is unavailable, or the gateway's database is
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  "/lobby/games/{id}/chairs/{seat}/hosted":
    post:
      summary: Seat a hosted model at a chair
      description: |-
        The room's host, signed in to a registered account, orders
        a language model this gateway's seat agents run for one open person's
        chair. The chair is marked for it at once (the listing's `hosted`,
        `starting`); the model's seat bridge then sits down as the host's
        delegate and says ready. A chair not ready within 60 seconds is opened
        again with a `note`. Asked before the session: a gateway with no seat
        agent connected answers `503` to anybody.
      operationId: order_hosted_seat
      tags:
      - Chairs
      parameters:
      - name: id
        in: path
        required: true
        description: The room's game id
        schema:
          type: string
      - name: seat
        in: path
        required: true
        description: The chair, counted from 0
        schema:
          type: integer
          format: int64
          minimum: 0
      security:
      - bearer: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderBody"
        required: true
      responses:
        "202":
          description: Ordered; the chair is starting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostedOrdered"
        "401":
          description: No bearer token, or one that is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: |-
            - The account is banned (`ban`) or must accept the terms in force first (`terms_required`)
            - The account is banned (`ban`) or must accept the terms first (`terms_required`); a guest asked, the profile is not open to the account, or the caller is not the room's host
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: No such room (`no such game`) or chair (`no such seat`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: >-
            The chair is not an open person's chair of a waiting room (an error alone), or
            the profile is not available now or no seat agent holds it (with `state` and
            `until_unix`)
          content:
            application/json:
              schema:
                anyOf:
                - $ref: "#/components/schemas/ErrorBody"
                - $ref: "#/components/schemas/HostedUnavailable"
        "413":
          description: The deck text is longer than 64 KiB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: Too many chairs asked for by this host in a minute
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: |-
            - The account store or Baylee Central is unavailable
            - No seat agent is connected, the account store, Baylee Central or the gateway's database is unavailable, too many chairs are being handed over, or the seat agent went away
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    delete:
      summary: Take a hosted chair back
      description: |-
        The room's host cancels a hosted model's chair before the
        game: a standing order's chair is opened again and its bridge stopped;
        a failed one's note is cleared.
      operationId: cancel_hosted_seat
      tags:
      - Chairs
      parameters:
      - name: id
        in: path
        required: true
        description: The room's game id
        schema:
          type: string
      - name: seat
        in: path
        required: true
        description: The chair, counted from 0
        schema:
          type: integer
          format: int64
          minimum: 0
      security:
      - bearer: []
      responses:
        "204":
          description: Taken back
        "401":
          description: No bearer token, or one that is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: |-
            - The account is banned (`ban`) or must accept the terms in force first (`terms_required`)
            - The account is banned (`ban`) or must accept the terms first (`terms_required`), or the caller is not the room's host
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: >-
            No such room (`no such game`) or chair (`no such seat`), or no hosted model at
            that chair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: The game has already started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: The account store or Baylee Central is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /social/reports:
    post:
      summary: Report a chat message
      description: |-
        Reveals one delivered message to the feedback service: the
        message as it arrived, its key and the body it decrypted to. The gateway
        checks the sender's signature and that the key opens the message to
        exactly that body, and sends the reporter's note and the message's text
        on as a `chat` report saying whether the check held (a device removed
        since cannot be checked). Guests may report too; 10 reports an hour per
        account.
      operationId: social_report
      tags:
      - Social
      security:
      - bearer: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatReport"
        required: true
      responses:
        "201":
          description: The feedback service took it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportReceipt"
        "400":
          description: >-
            Not a report or a conversation id, a note over 2000 characters, a malformed
            message, key or body, or a message of another conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: No bearer token, or one that is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: |-
            - The account is banned (`ban`) or must accept the terms in force first (`terms_required`)
            - This gateway has no chat, or the account is banned (`ban`) or must accept the terms in force first (`terms_required`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "413":
          description: >-
            The body is over 64 KiB (over 2 MiB it is refused before it is read, in plain
            text)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: 10 reports in the last hour from this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "500":
          description: The report could not be encoded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "502":
          description: The feedback service did not take it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: |-
            - The account store or Baylee Central is unavailable
            - Reports are not configured here (`BAYLEE_FEEDBACK_URL` unset), or the account store, the database or Baylee Central is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /social/devices:
    post:
      summary: Register a chat device
      description: |-
        Registers one of the account's chat devices by its two
        public keys and the identity key's statement over them, and answers
        its id. The same device again (a client registers on each start) is
        answered the same and costs nothing; a guest has one device, which a new
        one replaces. Everyone who may write to the account is told its keys
        changed.
      operationId: social_register_device
      tags:
      - Social
      security:
      - bearer: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceRegistration"
        required: true
      responses:
        "201":
          description: The device's id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Created"
        "400":
          description: >-
            A key of the wrong shape, a label that is not an OS family, or a device
            statement that does not hold for the account's tag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: No bearer token, or one that is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: |-
            - The account is banned (`ban`) or must accept the terms in force first (`terms_required`)
            - This gateway has no chat, or the account is banned (`ban`) or must accept the terms in force first (`terms_required`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: The account has five devices already, or another device has this key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: Five new devices today already
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: The account store or Baylee Central is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    get:
      summary: List the account's chat devices
      description: |-
        The account's chat devices, oldest first: their ids,
        OS families, and when each was registered and last seen.
      operationId: social_list_devices
      tags:
      - Social
      security:
      - bearer: []
      responses:
        "200":
          description: The devices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceList"
        "401":
          description: No bearer token, or one that is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: |-
            - The account is banned (`ban`) or must accept the terms in force first (`terms_required`)
            - This gateway has no chat, or the account is banned (`ban`) or must accept the terms in force first (`terms_required`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: The account store or Baylee Central is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
