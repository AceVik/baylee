  /site/contact:
    options:
      summary: A browser's preflight for the contact form
      description: |-
        Says yes only to an `Origin` in `FEEDBACK_CONTACT_ORIGINS`:
        `POST`, `Content-Type`, for a day. Every answer says `Vary: Origin`.
      operationId: preflightContact
      tags:
      - Site
      parameters:
      - name: Origin
        in: header
        required: true
        description: The page's origin
        schema:
          type: string
      security: []
      responses:
        "204":
          description: Allowed
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
              description: The asking origin
            Access-Control-Allow-Methods:
              schema:
                type: string
              description: "`POST, OPTIONS`"
            Access-Control-Allow-Headers:
              schema:
                type: string
              description: "`content-type`"
            Access-Control-Max-Age:
              schema:
                type: string
              description: "`86400`"
        "403":
          description: The `Origin` is missing or not a configured one
    post:
      summary: Send a message from the landing page
      description: |-
        The landing page's contact form posts here across origins.
        Only a page served at one of `FEEDBACK_CONTACT_ORIGINS` may: every answer
        says `Vary: Origin` and names the asking origin in
        `Access-Control-Allow-Origin` only when it is a configured one, never with
        credentials. 5 messages per address and 100 from everyone per hour, every
        request past the origin check counted. A filled honeypot is answered
        `201` and nothing is stored. Off until `FEEDBACK_CONTACT_ORIGINS` is set.
      operationId: postContact
      tags:
      - Site
      parameters:
      - name: Origin
        in: header
        required: true
        description: The page's origin, one of `FEEDBACK_CONTACT_ORIGINS`
        schema:
          type: string
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactIn"
        required: true
      responses:
        "201":
          description: Taken, or dropped for its honeypot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactTaken"
        "400":
          description: "Not a message: malformed JSON, an unknown field, an empty message, a malformed name or address, or another language"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: The `Origin` is missing or not one of `FEEDBACK_CONTACT_ORIGINS`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "413":
          description: A field over its bound, or the body over 32 KiB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: Too many messages from this address or from everyone in the last hour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: >-
            Contact messages are not taken here (`FEEDBACK_CONTACT_ORIGINS` is unset), or
            the database is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
