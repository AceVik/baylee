openapi: "3.1.0"
info:
  title: Baylee feedback service
  version: 0.1.1-beta.9b
  description: "The service that keeps what players report: gateways pass reports on with their intake tokens, clients signed in nowhere send their own, and admins read and triage them, with tokens or in the service's web UI. The UI's admin pages also reach one gateway's admin console through it, and the landing page posts its contact form and fetches its Impressum here. Every JSON answer is `Cache-Control: no-store`; a refusal is an `ErrorBody`."
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
- url: http://127.0.0.1:28780
  description: A feedback service on this machine (`FEEDBACK_BIND`)
paths:
  /client/alive:
    post:
      summary: Say an offline game is still going
      description: |-
        While a game a client hosts itself runs, and its player
        left the anonymous usage count on, the client beats once a minute. The
        game counts for 150 seconds after its last beat, in memory only; nothing
        is written down or logged per beat. 300 beats per address and 120000 from
        everyone per hour. Off until `FEEDBACK_DIRECT_KEY` is set. Any origin may
        post, as for direct reports.
      operationId: postAlive
      tags:
      - Clients
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Beat"
        required: true
      responses:
        "204":
          description: Counted
        "400":
          description: "Not a beat: malformed JSON, another field, or a `game` that is not 32 lowercase hex digits"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "413":
          description: >-
            The body is over 256 bytes, refused in plain text before anything else is
            checked
          content:
            text/plain:
              schema:
                type: string
        "429":
          description: Too many beats from this address or from everyone in the last hour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: Usage counts are not taken here (`FEEDBACK_DIRECT_KEY` is unset)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    options:
      summary: A browser's preflight for a direct report or a beat
      description: "Says yes to any origin: `POST`, `Content-Type`, for a day."
      operationId: preflight_options_client_alive
      tags:
      - Clients
      security: []
      responses:
        "204":
          description: Allowed
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
              description: "`*`"
            Access-Control-Allow-Methods:
              schema:
                type: string
              description: "`POST, OPTIONS`"
            Access-Control-Allow-Headers:
              schema:
                type: string
              description: "`content-type`"
            Access-Control-Max-Age:
              schema:
                type: string
              description: "`86400`"
  /ui/api/admin/offline:
    get:
      summary: Offline games going now
      description: |-
        How many games clients host themselves are going now, by
        their anonymous beats (`POST /client/alive`). This service's own count:
        it needs no gateway console.
      operationId: offline
      tags:
      - Console
      security:
      - session: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Offline"
        "401":
          description: "No live session: signed out, or the session lapsed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: The database is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /ui/api/admin/stats:
