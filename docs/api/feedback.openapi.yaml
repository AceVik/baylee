      type: apiKey
      in: header
      name: X-Baylee-CSRF
      description: >-
        Must be `1` on every `/ui/api` request that changes something, sign-in and
        sign-out included. Such a request must also carry an `Origin` naming the request's
        `Host`, and must not be marked `Sec-Fetch-Site` other than `same-origin`.
    gatewayToken:
      type: http
      scheme: bearer
      description: >-
        A gateway's intake token, one of `FEEDBACK_GATEWAY_TOKENS`. The report is filed
        under the name that token is configured with.
    readToken:
      type: http
      scheme: bearer
      description: "`FEEDBACK_READ_TOKEN`: reads reports."
    session:
      type: apiKey
      in: cookie
      name: __Host-baylee-feedback
      description: >-
        The web UI's session, set by `POST /ui/api/login` (`HttpOnly; Secure;
        SameSite=Strict; Path=/`). It ends 12 hours unused or 7 days after sign-in. The tokens
        open none of the `/ui/api` routes, and a session none of the token routes.
  schemas:
    AccessAccounts:
      type: object
      properties:
        accounts:
          type: array
          items:
            type: string
            format: uuid
          description: The accounts, by id, 1 to 200.
          minItems: 1
          maxItems: 200
      required:
      - accounts
      additionalProperties: false
      description: Accounts for a hosted model's list.
    AccessPolicy:
      type: object
      properties:
        policy:
          type: string
          description: "`registered` (every registered account), `listed` (the accounts on its list) or `nobody`; the gateway refuses any other."
          enum:
          - registered
          - listed
          - nobody
        default_for_registered:
          type:
          - boolean
          - "null"
          description: Whether it is the model a registered account is offered first.
      required:
      - policy
      additionalProperties: false
      description: Who may seat a hosted model.
    Action:
      type: string
      enum:
      - trash
      - restore
      - purge
      description: "`trash` (into the trash), `restore` (out of it) or `purge` (deleted for good, only from the trash)."
    AuditEntry:
      type: object
      properties:
        at:
          type: string
          description: When, RFC 3339 in UTC.
          format: date-time
        actor:
          type: string
          description: "Who: an admin's name, `token` for the admin token, or `sweep` for the trash's own purge."
        action:
          type: string
          description: "What: `status`, `issue`, `assign`, `priority`, `labels`, `duplicate`, `trash`, `restore` or `delete`."
        detail:
          type:
          - string
          - "null"
          description: The new value, where the action has one.
      required:
      - at
      - actor
      - action
      - detail
      description: One line of a report's audit.
    AuthModeChoice:
      type: object
      properties:
        mode:
          type: string
          description: "`guests`, `central` or `mixed`."
          enum:
          - guests
          - central
          - mixed
      required:
      - mode
      additionalProperties: false
      description: The mode to put in force.
    BanOrder:
      type: object
      properties:
        reason:
          type: string
          description: Why, as the player is told it.
        until:
          type:
          - string
          - "null"
          description: When the ban ends, RFC 3339; absent for never.
          format: date-time
      required:
      - reason
      additionalProperties: false
      description: A ban for an account.
    Beat:
      type: object
      properties:
        game:
          type: string
          description: "A random value the client made for this one game: 32 lowercase hex digits, forgotten when the game ends."
          pattern: ^[0-9a-f]{32}$
      required:
      - game
      additionalProperties: false
      description: "An offline game's beat: the one field, nothing else."
    BlockOrder:
      type: object
      properties:
        index:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
          description: The card, by its index in the gateway's pool.
        reason:
          type: string
          description: Why, as the players are told it.
        until:
          type:
          - string
          - "null"
          description: When the block ends, RFC 3339; absent for no end.
          format: date-time
      required:
      - index
      - reason
      additionalProperties: false
      description: A card to block on the gateway.
    BuildIn:
      type: object
      properties:
        version:
          type: string
          description: The client's release.
        commit:
          type:
          - string
          - "null"
          description: The commit it was built from, if it knows.
      required:
      - version
      description: The build a client says it is.
    Bulk:
      type: object
      properties:
        ids:
          type: array
          items:
            type: string
            format: uuid
          description: The reports, 1 to 200 after duplicates are dropped.
          minItems: 1
        change:
          anyOf:
          - $ref: "#/components/schemas/BulkChange"
          - type: "null"
          description: The change for each of them.
        action:
          anyOf:
          - $ref: "#/components/schemas/Action"
          - type: "null"
          description: The action for each of them.
      required:
      - ids
      additionalProperties: false
      description: "One change or one action for many reports: exactly one of `change` and `action`."
    BulkChange:
      type: object
      properties:
        status:
          anyOf:
          - $ref: "#/components/schemas/Status"
          - type: "null"
          description: The status each gets.
        issue:
          description: The GitHub issue, by number, or `null` for none.
          type:
          - integer
          - "null"
          minimum: 1
        assignee:
          description: The admin who looks after them, or `null` for nobody.
          type:
          - string
          - "null"
        priority:
          description: How urgent they are, or `null` for none.
          type:
          - string
          - "null"
          enum:
          - critical
          - high
          - normal
          - low
          - null
        labels_add:
          type: array
          items:
            type: string
          description: Labels each gets.
        labels_remove:
          type: array
          items:
            type: string
          description: Labels each loses.
        duplicate_of:
          description: The report they duplicate, or `null` for none.
          type:
          - string
          - "null"
          format: uuid
      additionalProperties: false
      description: "A change for many reports: as one report's, with labels added and removed instead of a whole set, and no revision."
    BulkDone:
      type: object
      properties:
        changed:
          type: integer
          format: int64
          minimum: 0
          description: >-
            How many reports it changed; one already as asked, or not where the action
            needs it, is not counted.
      required:
      - changed
      description: What a bulk request did.
    CentralToken:
      type: object
      properties:
        token:
          type: string
          description: "`bgt_` and 64 lowercase hex digits."
      required:
      - token
      additionalProperties: false
      description: A gateway token, as the website showed it.
    Challenge:
      type: object
      properties:
        nonce:
          type: string
          description: 16 random bytes, base64url.
        parts:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
          description: "How many parts: 8."
        difficulty:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
          description: "Zero bits each part needs: 17 for an ordinary request, up to 4 more for a suspicious one."
        expires:
          type: integer
          format: int64
          description: "Unix seconds after which it is not taken: 5 minutes from now."
        sig:
          type: string
          description: This service's signature over the rest, base64url; sent back unchanged.
      required:
      - nonce
      - parts
      - difficulty
      - expires
      - sig
      description: "A proof-of-work puzzle: for each part `p` in `0..parts`, the smallest counter `c` with `SHA-256(nonce + \":\" + p + \":\" + c)` (UTF-8, decimal numbers) starting with `difficulty` zero bits."
    Change:
      type: object
      properties:
        status:
          anyOf:
          - $ref: "#/components/schemas/Status"
          - type: "null"
          description: >-
            The status it gets. Marking it a duplicate sets `duplicate`; unmarking one sets
            `triaged` unless a status is named.
        issue:
          description: The GitHub issue it is linked to, by number (1 or more), or `null` for none.
          type:
          - integer
          - "null"
          minimum: 1
        assignee:
          description: The admin who looks after it, by name, or `null` for nobody.
          type:
          - string
          - "null"
        priority:
          description: How urgent it is, or `null` for none.
          type:
          - string
          - "null"
          enum:
          - critical
          - high
          - normal
          - low
          - null
        labels:
          type:
          - array
          - "null"
          items:
            type: string
          description: "Its labels, the whole set: at most 16, each lowercase letters, digits and dashes, 1–32 characters."
        duplicate_of:
          description: >-
            The report it duplicates (an original, not itself a duplicate), or `null` for
            none.
          type:
          - string
          - "null"
          format: uuid
        expected_revision:
          type:
          - integer
          - "null"
          format: int64
          description: The revision the change was made against; another one is `409`.
      additionalProperties: false
      description: >-
        What to change about a report. A part left out stays as it is; `null` clears an
        issue, an assignee, a priority or a duplicate. At least one part besides
        `expected_revision`.
    ClientRecord:
      type: object
      properties:
        complete:
          type: boolean
          description: Whether the record reaches the game's end.
        gzip_base64:
          type: string
          description: "The record: gzip of JSON Lines, in standard base64."
      required:
      - complete
      - gzip_base64
      description: "A game record a client attaches: at most 4 MiB of gzip that unpacks to at most 32 MiB of JSON Lines, a header of record version 1 first and nothing after it but input, chair and end lines."
    CloseOrder:
      type: object
      properties:
        reason:
          type: string
          description: Why, as the players are told it.
      required:
      - reason
      additionalProperties: false
      description: Why a game is ended.
    ConsoleChange:
      type: object
      properties:
        at:
          type: string
          description: When, RFC 3339 in UTC.
          format: date-time
        actor:
          type: string
          description: The admin who made it.
        action:
          type: string
          description: "What: `gateway.invite.create`, `gateway.card.block`, `gateway.account.ban`, `gateway.llm.profile.write`, …."
        detail:
          type:
          - string
          - "null"
          description: Ids and ends; never a key, a password, a note or a reason.
      required:
      - at
      - actor
      - action
      - detail
      description: One change made through the admin console.
    ContactAuditEntry:
      type: object
      properties:
        at:
          type: string
          description: When, RFC 3339 in UTC.
          format: date-time
        actor:
          type: string
          description: The admin.
        action:
          type: string
          description: "`status` or `delete`."
        detail:
          type:
          - string
          - "null"
          description: The new status, for `status`.
      required:
      - at
      - actor
      - action
      - detail
      description: One line of a contact message's audit.
    ContactChange:
      type: object
      properties:
        status:
          type: string
          description: "`new`, or `done` once an admin has dealt with it."
          enum:
          - new
          - done
      required:
      - status
      additionalProperties: false
      description: "`PATCH /ui/api/contact/{id}`."
    ContactDetail:
      type: object
      properties:
        audit:
          type: array
          items:
            $ref: "#/components/schemas/ContactAuditEntry"
          description: Who changed it and when, oldest first.
      required:
      - audit
      allOf:
      - $ref: "#/components/schemas/ContactMessage"
      description: One contact message with its audit.
    ContactIn:
      type: object
      properties:
        name:
          type:
          - string
          - "null"
          description: "The sender's name, if given: at most 100 characters, no control character."
        email:
          type:
          - string
          - "null"
          description: "Where to answer, if given: at most 254 characters, one `@` with something before it and a dot in the domain after it, no whitespace."
        message:
          type: string
          description: "What they wrote: 1 to 5000 characters after trimming; line breaks and tabs are the only control characters taken."
        language:
          type: string
          description: The page's language when it was sent.
          enum:
          - en
          - de
        website:
          type:
          - string
          - "null"
          description: "The honeypot: the page hides it from people. Filled, the message is answered as taken and dropped."
      required:
      - message
      - language
      additionalProperties: false
      description: >-
        A message from the landing page's contact form; every field named, no other
        taken. Blank `name` and `email` are none.
    ContactListing:
      type: object
      properties:
        open:
          type: integer
          format: int64
          description: Messages not yet marked done, all of them.
        total:
          type: integer
          format: int64
          description: Messages the filter matches, all of them.
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ContactMessage"
          description: The newest of those, at most 500.
      required:
      - open
      - total
      - messages
      description: The contact messages.
    ContactMessage:
      type: object
      properties:
        id:
          type: string
          description: Its id.
          format: uuid
        created_at:
          type: string
          description: When it came, RFC 3339 in UTC.
          format: date-time
        updated_at:
          type: string
          description: When it last changed, RFC 3339 in UTC.
          format: date-time
        name:
          type:
          - string
          - "null"
          description: The sender's name, if given.
        email:
          type:
          - string
          - "null"
          description: Where to answer, if given.
        message:
          type: string
          description: What they wrote.
        language:
          type: string
          description: The page's language when it was sent.
          enum:
          - en
          - de
        status:
          type: string
          description: Whether an admin has dealt with it.
          enum:
          - new
          - done
        done_at:
          type:
          - string
          - "null"
          description: When it was marked done, RFC 3339 in UTC.
          format: date-time
      required:
      - id
      - created_at
      - updated_at
      - name
      - email
      - message
      - language
      - status
      - done_at
      description: A contact message as the web UI shows it.
    ContactTaken:
      type: object
      properties:
        ok:
          type: boolean
          description: Always `true`.
      required:
      - ok
      description: A contact message taken.
    Count:
      type: object
      properties:
        value:
          type:
          - string
          - "null"
          description: The value; `null` for nobody assigned or no priority.
        count:
          type: integer
          format: int64
          description: How many reports have it.
      required:
      - value
      - count
      description: One value and how many reports have it.
    CrashGroup:
      type: object
      properties:
        signature:
          type: string
          description: The crash's signature.
        count:
          type: integer
          format: int64
          description: How many reports of it the filter matches.
        open:
          type: integer
          format: int64
          description: Of them, how many are not done.
        first:
          type: string
          description: When the first came, RFC 3339 in UTC.
          format: date-time
        last:
          type: string
          description: When the last came, RFC 3339 in UTC.
          format: date-time
        latest:
          type: string
          description: The newest report of it, by id.
          format: uuid
        message:
          type:
          - string
          - "null"
          description: Its message, as the newest report has it.
        location:
          type:
          - string
          - "null"
          description: Where it happened, as the newest report has it.
      required:
      - signature
      - count
      - open
      - first
      - last
      - latest
      - message
      - location
      description: One crash, by its signature, under the filter.
    Created:
      type: object
      properties:
        report_id:
          type: string
          description: The new report's id, a `UUIDv7`.
          format: uuid
      required:
      - report_id
      description: A report taken.
    Credentials:
      type: object
      properties:
        name:
          type: string
          description: The admin's name.
        password:
          type: string
          description: The admin's password.
          format: password
      required:
      - name
      - password
      description: "`POST /ui/api/login`."
    DayKind:
      type: object
      properties:
        day:
          type: string
          description: The day, `YYYY-MM-DD` in UTC.
          format: date
        kind:
          type: string
          description: The reports' kind.
          enum:
          - bug
          - improvement
          - feedback
          - crash
          - other
          - chat
        count:
          type: integer
          format: int64
          description: How many came.
      required:
      - day
      - kind
      - count
      description: One day's reports of one kind.
    Detail:
      type: object
      properties:
        note_list:
          type: array
          items:
            $ref: "#/components/schemas/Note"
          description: Its internal notes, oldest first; only in the web UI.
      allOf:
      - $ref: "#/components/schemas/Summary"
      description: One report, with its `client` object and, in the web UI, its notes.
    Direct:
      type: object
      properties:
        kind:
          $ref: "#/components/schemas/Kind"
          description: >-
            What the report is about; never `chat`, which goes through the message's
            gateway.
        text:
          type: string
          description: What the player wrote, at most 20000 characters; empty only for a crash.
        build:
          $ref: "#/components/schemas/BuildIn"
          description: "The client's build: its version and commit together at most 128 characters, not empty."
        device:
          type: string
          description: "A random id the client made for its reports: 32 lowercase hex digits. The report is filed under this service's HMAC of it, never the id."
          pattern: ^[0-9a-f]{32}$
        client:
          description: "What the client says about itself: a JSON object of at most 1 MiB serialized."
        record:
          anyOf:
          - $ref: "#/components/schemas/ClientRecord"
          - type: "null"
          description: The game's record, if one is attached.
      required:
      - kind
      - text
      - build
      - device
      - client
      additionalProperties: false
      description: >-
        A report from a client signed in to no gateway; every field named, no other
        taken.
    ErrorBody:
      type: object
      properties:
        error:
          type: string
          description: What went wrong, as one sentence for a person.
      required:
      - error
      description: "A refusal: one English sentence in `error`."
    Facets:
      type: object
      properties:
        statuses:
          type: array
          items:
            $ref: "#/components/schemas/Count"
          description: Per status.
        kinds:
          type: array
          items:
            $ref: "#/components/schemas/Count"
          description: Per kind.
        gateways:
          type: array
          items:
            $ref: "#/components/schemas/Count"
          description: Per gateway.
        reporters:
          type: array
          items:
            $ref: "#/components/schemas/Count"
          description: The 50 reporters with the most reports.
        assignees:
          type: array
          items:
            $ref: "#/components/schemas/Count"
          description: Per assignee.
        priorities:
          type: array
          items:
            $ref: "#/components/schemas/Count"
          description: Per priority.
        labels:
          type: array
          items:
            $ref: "#/components/schemas/Count"
          description: Per label.
        channels:
          type: array
          items:
            $ref: "#/components/schemas/Count"
          description: Per channel.
        sources:
          type: array
          items:
            $ref: "#/components/schemas/Count"
          description: Per source; `null` for reports without one.
        total:
          type: integer
          format: int64
          description: What the whole filter matches.
      required:
      - statuses
      - kinds
      - gateways
      - reporters
      - assignees
      - priorities
      - labels
      - channels
      - sources
      - total
      description: >-
        The counts beside the list, most first, each over the filter without its own
        dimension.
    GatewayIn:
      type: object
      properties:
        name:
          type:
          - string
          - "null"
          description: >-
            The name the gateway shows (`BAYLEE_GATEWAY_NAME`), at most 256 characters, no
            control character.
        url:
          type:
          - string
          - "null"
          description: Where the gateway is, at most 256 characters, no control character.
        version:
          type: string
          description: The gateway's build, at most 128 characters, no control character.
      required:
      - version
      description: The gateway a report came through, as it describes itself.
    Health:
      type: object
      properties:
        ok:
          type: boolean
          description: "Always `true`: the service answers."
        version:
          type: string
          description: The release, e.g. `0.1.0-beta.8a`.
        source:
          type: string
          description: The repository this build's source is in.
      required:
      - ok
      - version
      - source
      description: "`GET /health`."
    Intake:
      type: object
      properties:
        gateway:
          $ref: "#/components/schemas/GatewayIn"
          description: >-
            The gateway, as it describes itself; the report is filed under its token's name
            whatever it says here.
        reporter:
          type: string
          description: "The gateway's pseudonym for the player: 1–128 letters and digits."
        kind:
          $ref: "#/components/schemas/Kind"
          description: What the report is about.
        text:
          type: string
          description: What the player wrote, at most 20000 characters.
        game_id:
          type:
          - string
          - "null"
          description: The game the report was written at, at most 128 characters.
        client:
          description: "What the client says about itself: a JSON object of at most 2 MiB serialized."
        record:
          anyOf:
          - $ref: "#/components/schemas/RecordIn"
          - type: "null"
          description: "The game's record, if one is attached: at most 64 MiB compressed from a gateway, 4 MiB (32 MiB unpacked) from a client."
        record_origin:
          $ref: "#/components/schemas/Origin"
          description: >-
            Who wrote `record` (`gateway` when absent); a client's is checked for a game
            record's shape.
          default: gateway
      required:
      - gateway
      - reporter
      - kind
      - text
      - client
      description: A report a gateway passes on (`docs/feedback.md` §"The gateway").
    Kind:
      type: string
      enum:
      - bug
      - improvement
      - feedback
      - crash
      - other
      - chat
      description: "What a report is about: `bug`, `improvement`, `feedback`, `crash`, `other`, or `chat` (a reported chat message, only from a gateway)."
    Listing:
      type: object
      properties:
        reports:
          type: array
          items:
            $ref: "#/components/schemas/Summary"
          description: The page's reports.
        total:
          type: integer
          format: int64
          description: How many reports the filter matches in all.
      required:
      - reports
      - total
      description: One page of the list.
    LlmDefinition:
      type: object
      properties:
        label:
          type: string
          description: The name the profile is shown under.
        vendor:
          type: string
          description: Who makes the model.
        enabled:
          type:
          - boolean
          - "null"
          description: Whether new games may seat it.
        max_games:
          type:
          - integer
          - "null"
          format: int64
          minimum: 0
          maximum: 4294967295
          description: How many games may seat it at once.
        caps:
          description: The caps of the profile's spend book.
        canary:
          type:
          - boolean
          - "null"
          description: Whether it is a canary.
        fallback:
          type:
          - string
          - "null"
          description: >-
            Another profile of the same seat agent, by id (1–64 of `A-Za-z0-9._-`), that
            new games start on past `max_games`; the seat agent says whether it may be one.
        profile:
          description: The rest of the profile, in the seat settings file's format.
      required:
      - label
      - vendor
      - profile
      additionalProperties: false
      description: >-
        A hosted profile's definition, as the gateway takes it (its document's §"Hosted
        language-model seats").
    LlmEnabled:
      type: object
      properties:
        enabled:
          type: boolean
          description: Whether new games may seat the profile.
      required:
      - enabled
      additionalProperties: false
      description: "`POST …/profiles/{id}/enabled`."
    LlmKey:
      type: object
      properties:
        key:
          type:
          - string
          - "null"
          description: The key, or `null` to forget the one kept.
          format: password
      additionalProperties: false
      description: A profile's API key, write-only.
    Me:
      type: object
      properties:
        name:
          type: string
          description: The admin's name.
        gateway_admin:
          type: boolean
          description: >-
            Whether a gateway's admin console is configured, so the UI shows its admin
            pages (`/ui/api/admin/…`).
      required:
      - name
      - gateway_admin
      description: The signed-in admin.
    Neighbours:
      type: object
      properties:
        previous:
          type:
          - string
          - "null"
          description: The report above it, by id, if any.
          format: uuid
        next:
          type:
          - string
          - "null"
          description: The report below it, by id, if any.
          format: uuid
        position:
          type:
          - integer
          - "null"
          format: int64
          description: Its place, from 1; `null` when the filter does not match it.
        total:
          type: integer
          format: int64
          description: How many reports the filter matches; 0 when it does not match this one.
      required:
      - previous
      - next
      - position
      - total
      description: Where a report stands in the list the filter makes.
    Note:
      type: object
      properties:
        id:
          type: string
          description: Its id.
          format: uuid
        at:
          type: string
          description: When it was written, RFC 3339 in UTC.
          format: date-time
        author:
          type: string
          description: The admin who wrote it.
        text:
          type: string
          description: What it says.
      required:
      - id
      - at
      - author
      - text
      description: One internal note.
    NoteIn:
      type: object
      properties:
        text:
          type: string
          description: "What the note says: 1 to 4000 characters after trimming."
      required:
      - text
      additionalProperties: false
      description: "`POST /ui/api/reports/{id}/notes`."
    Offline:
      type: object
      properties:
        offline_now:
          type: integer
          format: int64
          minimum: 0
          description: Offline games heard from within the window.
        window_secs:
          type: integer
          format: int64
          description: "How long a game counts after its last beat, in seconds: 150."
      required:
      - offline_now
      - window_secs
      description: "`GET /ui/api/admin/offline`'s answer."
    Order:
      type: object
      properties:
        uses:
          type:
          - integer
          - "null"
          format: int64
          minimum: 0
          maximum: 4294967295
          description: How often each key may be used.
        expires:
          type:
          - string
          - "null"
          description: "When the keys expire, from now: `30d`, `12h`, …."
        note:
          type:
          - string
          - "null"
          description: A note kept with the keys at the gateway.
        count:
          type:
          - integer
          - "null"
          format: int64
          minimum: 0
          maximum: 4294967295
          description: How many keys to make.
      additionalProperties: false
      description: Keys to make, as `invite create` takes them.
    Origin:
      type: string
      enum:
      - gateway
      - client
      default: gateway
      description: "Who wrote a report's record: `gateway`, or `client` (unverified)."
    RecordIn:
      type: object
      properties:
        complete:
          type: boolean
          description: Whether the record reaches the game's end.
        gzip_base64:
          type: string
          description: "The record: gzip of JSON Lines, in standard base64."
      required:
      - complete
      - gzip_base64
      description: A game record attached to a report.
    ReportStats:
      type: object
      properties:
        days:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
          description: "How many days back it counts: 30."
        rows:
          type: array
          items:
            $ref: "#/components/schemas/DayKind"
          description: Each day and kind that had reports, by day then kind.
      required:
      - days
      - rows
      description: Reports per UTC day and kind, counts only.
    SeenIn:
      type: object
      properties:
        ids:
          type: array
          items:
            type: string
            format: uuid
          description: The reports, 1 to 500; an id that is no report is passed over.
          minItems: 1
          maxItems: 500
        seen:
          type: boolean
          description: Opened (`true`) or not (`false`).
      required:
      - ids
      - seen
      additionalProperties: false
      description: "`POST /ui/api/seen`."
    Solution:
      type: object
      properties:
        nonce:
          type: string
          description: The challenge's nonce.
        parts:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
          description: The challenge's parts.
        difficulty:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
          description: The challenge's difficulty.
        expires:
          type: integer
          format: int64
          description: The challenge's expiry.
        sig:
          type: string
          description: The challenge's signature.
        counters:
          type: array
          items:
            type: integer
            format: int64
            minimum: 0
          description: One counter per part, in order.
      required:
      - nonce
      - parts
      - difficulty
      - expires
      - sig
      - counters
      additionalProperties: false
      description: "A solved challenge: its five fields unchanged, and one counter per part."
    Status:
      type: string
      enum:
      - new
      - triaged
      - in_progress
      - resolved
      - wont_fix
      - duplicate
      description: "Where a report stands: `new`, `triaged`, `in_progress`, `resolved`, `wont_fix` or `duplicate`."
    StatusChange:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/Status"
          description: The status the report gets.
      required:
      - status
      description: "`PATCH /reports/{id}`."
    Summary:
      type: object
      properties:
        id:
          type: string
          description: Its id, a `UUIDv7`.
          format: uuid
        created_at:
          type: string
          description: When it came, RFC 3339 in UTC.
          format: date-time
        updated_at:
          type: string
          description: When it last changed, RFC 3339 in UTC.
          format: date-time
        gateway:
          type: string
          description: >-
            The name of the gateway it came through, as this service configures that
            gateway's token; `(direct)` for a direct report.
        gateway_name:
          type:
          - string
          - "null"
          description: The name the gateway gave itself, if it sent one.
        gateway_url:
          type:
          - string
          - "null"
          description: Where the gateway said it is, if it sent that.
        gateway_version:
          type: string
          description: The gateway's build, or a direct report's client build.
        reporter:
          type: string
          description: "The reporter's pseudonym: the gateway's HMAC, or for a direct report this service's of the device's id. Never an account."
        kind:
          type: string
          description: What it is about.
          enum:
          - bug
          - improvement
          - feedback
          - crash
          - other
          - chat
        status:
          type: string
          description: Where it stands.
          enum:
          - new
          - triaged
          - in_progress
          - resolved
          - wont_fix
          - duplicate
        text:
          type: string
          description: What the player wrote.
        game_id:
          type:
          - string
          - "null"
          description: The game it was written at, if any.
        has_record:
          type: boolean
          description: Whether a game record is attached.
        record_complete:
          type:
          - boolean
          - "null"
          description: Whether the record reaches the game's end; `null` without a record.
        record_bytes:
          type: integer
          format: int64
          description: The record's size in bytes, compressed; 0 without one.
        channel:
          type: string
          description: "How it came: `gateway` (passed on by one) or `direct` (a client sent it itself, unauthenticated)."
          enum:
          - gateway
          - direct
        record_origin:
          type:
          - string
          - "null"
          description: "Who wrote the record: `gateway`, or `client` (unverified); `null` without one."
          enum:
          - gateway
          - client
          - null
        source:
          type:
          - string
          - "null"
          description: >-
            What sent it, as the client's `source` says, at most 64 characters (`llm-seat`
            for a language-model seat); `null` without one. The client's word, unchecked.
        issue_number:
          type:
          - integer
          - "null"
          format: int32
          description: The GitHub issue it is linked to, by number.
        issue_url:
          type:
          - string
          - "null"
          description: That issue's page, made from the number; `null` without one.
        assignee:
          type:
          - string
          - "null"
          description: The admin who looks after it, by name.
        priority:
          type:
          - string
          - "null"
          description: How urgent it is; `null` for none.
          enum:
          - critical
          - high
          - normal
          - low
          - null
        labels:
          type: array
          items:
            type: string
          description: Its labels, sorted.
        duplicate_of:
          type:
          - string
          - "null"
          description: The report this one duplicates.
          format: uuid
        signature:
          type:
          - string
          - "null"
          description: "A crash's signature: the same crash has the same one."
        revision:
          type: integer
          format: int64
          description: Moved on by every change; a change may name the one it was made against.
        done_at:
          type:
          - string
          - "null"
          description: >-
            When it entered a done status (`resolved`, `wont_fix`, `duplicate`), RFC 3339
            in UTC.
          format: date-time
        deleted_at:
          type:
          - string
          - "null"
          description: When it went into the trash, RFC 3339 in UTC.
          format: date-time
        seen:
          type: boolean
          description: Whether the signed-in admin has opened it; always `false` over the tokens.
        notes:
          type: integer
          format: int64
          description: How many internal notes it has.
        client:
          description: What the client said about itself; only on one report, never in a list.
      required:
      - id
      - created_at
      - updated_at
      - gateway
      - gateway_name
      - gateway_url
      - gateway_version
      - reporter
      - kind
      - status
      - text
      - game_id
      - has_record
      - record_complete
      - record_bytes
      - channel
      - record_origin
      - source
      - issue_number
      - issue_url
      - assignee
      - priority
      - labels
      - duplicate_of
      - signature
      - revision
      - done_at
      - deleted_at
      - seen
      - notes
      description: A report as a list shows it.
    View:
      type: object
      properties:
        id:
          type: string
          description: Its id.
          format: uuid
        name:
          type: string
          description: Its name.
        query:
          type: string
          description: The list's query string, without `?`.
      required:
      - id
      - name
      - query
      description: "One saved view: a name and the list's query string."
    ViewIn:
      type: object
      properties:
        name:
          type: string
          description: "Its name: 1 to 60 characters after trimming, no control character. A name saved again replaces its query."
        query:
          type: string
          description: >-
            The list's query string (a leading `?` is dropped), at most 2000 characters,
            read as the list reads it.
      required:
      - name
      - query
      additionalProperties: false
      description: "`POST /ui/api/views`."
tags:
- name: Service
  description: Whether the service is well
- name: Intake
  description: Reports a gateway passes on, with its intake token
- name: Clients
  description: "What a client sends itself, with no credential: a report from a client signed in nowhere, and the anonymous offline count"
- name: Site
  description: "The landing page: its contact form and its Impressum"
- name: Reports
  description: Reading and changing reports with the read or admin token
- name: Sessions
  description: Signing in to the web UI and out again
- name: Triage
  description: "The web UI's reports: the list, one report, its notes, the trash, saved views"
- name: Contact
  description: The web UI's contact messages from the landing page
- name: Console
  description: The web UI's admin pages, passed on to one gateway's admin console
- name: Moderation
  description: Acting on a gateway's account or game, through its admin console
- name: Models
  description: >-
    Hosted language models and who may seat them, through the gateway's admin
    console
