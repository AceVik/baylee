      tags:
      - Sessions
      security:
      - session: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          description: "No live session: signed out, or the session lapsed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: The database is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /ui/api/reports:
    get:
      summary: List reports
      description: |-
        The reports the filter matches, a page at a time, with
        how many match in all and whether this admin has opened each. The trash
        is swept first.
      operationId: uiListReports
      tags:
      - Triage
      parameters:
      - name: status
        in: query
        required: false
        description: "Statuses, comma-separated: `new`, `triaged`, `in_progress`, `resolved`, `wont_fix`, `duplicate`."
        schema:
          type: string
      - name: kind
        in: query
        required: false
        description: "Kinds, comma-separated: `bug`, `improvement`, `feedback`, `crash`, `other`, `chat`."
        schema:
          type: string
      - name: gateway
        in: query
        required: false
        description: The gateway's name the reports are filed under (`(direct)` for direct reports).
        schema:
          type: string
      - name: reporter
        in: query
        required: false
        description: One reporter's pseudonym.
        schema:
          type: string
      - name: game_id
        in: query
        required: false
        description: One game's id.
        schema:
          type: string
      - name: q
        in: query
        required: false
        description: >-
          Words of the text or of a crash's message, a piece of the text (`%` and `_`
          literal), or a piece of a report's id (six hex digits or more); at most 200
          characters.
        schema:
          type: string
      - name: from
        in: query
        required: false
        description: The first day, `YYYY-MM-DD` in UTC, inclusive.
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: false
        description: The last day, `YYYY-MM-DD` in UTC, inclusive.
        schema:
          type: string
          format: date
      - name: has_record
        in: query
        required: false
        description: Only reports with a record (`true`) or without one (`false`).
        schema:
          type: boolean
      - name: channel
        in: query
        required: false
        description: "How the reports came: `gateway` or `direct`."
        schema:
          type: string
          enum:
          - gateway
          - direct
      - name: source
        in: query
        required: false
        description: "What sent the reports, as the client's `source` says (`llm-seat` for a language-model seat): a source, `none` for reports without one, or either after `!` for all the others. 1–64 characters, no control character."
        schema:
          type: string
      - name: assignee
        in: query
        required: false
        description: An admin's name, or `none` for reports nobody looks after.
        schema:
          type: string
      - name: label
        in: query
        required: false
        description: "One label: lowercase letters, digits and dashes, 1–32."
        schema:
          type: string
      - name: priority
        in: query
        required: false
        description: "Priorities, comma-separated: `critical`, `high`, `normal`, `low`, or `none` for a report without one."
        schema:
          type: string
      - name: signature
        in: query
        required: false
        description: "One crash signature: 16 hex digits."
        schema:
          type: string
      - name: duplicate_of
        in: query
        required: false
        description: The duplicates of this report (its id).
        schema:
          type: string
          format: uuid
      - name: trash
        in: query
        required: false
        description: The trash instead of the reports.
        schema:
          type: boolean
      - name: unseen
        in: query
        required: false
        description: >-
          Only what the signed-in admin has not opened yet (the web UI's routes only; the
          token routes have no admin).
        schema:
          type: boolean
      - name: sort
        in: query
        required: false
        description: "What the list is sorted by: `received` (the default), `changed`, `priority`, `status`, `kind`, `reporter` or `gateway`."
        schema:
          type: string
          enum:
          - received
          - changed
          - priority
          - status
          - kind
          - reporter
          - gateway
      - name: dir
        in: query
        required: false
        description: "`desc` (the default) or `asc`."
        schema:
          type: string
          enum:
          - desc
          - asc
      - name: limit
        in: query
        required: false
        description: "How many reports a page holds: 50 by default; a value below 1 or above 200 is taken as 1 or 200."
        schema:
          type: integer
          format: int64
          minimum: 0
          default: 50
      - name: offset
        in: query
        required: false
        description: How many reports of the list to skip.
        schema:
          type: integer
          format: int64
          minimum: 0
      security:
      - session: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "400":
          description: A filter is malformed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: "No live session: signed out, or the session lapsed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: The database is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
