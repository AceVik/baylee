  "/ui/api/reports/{id}":
    get:
      summary: One report
      description: |-
        One report with its `client` object and its notes, in the
        trash or not.
      operationId: uiGetReport
      tags:
      - Triage
      parameters:
      - name: id
        in: path
        required: true
        description: The report's id
        schema:
          type: string
          format: uuid
      security:
      - session: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Detail"
        "401":
          description: "No live session: signed out, or the session lapsed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: No such report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: The database is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    patch:
      summary: Change a report
      description: |-
        Changes what the body names and answers the report as it
        is now, with its notes. Only what differs is written, each part with an
        audit line under this admin's name; a change that changes nothing writes
        nothing. A report in the trash is not changed (`404`).
      operationId: uiChangeReport
      tags:
      - Triage
      parameters:
      - name: id
        in: path
        required: true
        description: The report's id
        schema:
          type: string
          format: uuid
      security:
      - session: []
        csrf: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Change"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Detail"
        "400":
          description: "Not a change, nothing to change, or a part that is refused: an issue number below 1, no admin of that name, a malformed label or more than 16, or a duplicate of itself, of no report, or of a duplicate"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: "No live session: signed out, or the session lapsed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: "A cross-site request: no `X-Baylee-CSRF: 1`, an `Origin` that is not this host, or `Sec-Fetch-Site` other than `same-origin`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: No such report, or it is in the trash
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: The report changed meanwhile (another `expected_revision`); read it again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: The database is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    delete:
      summary: Move a report into the trash
      description: |-
        The report leaves every list but the trash; it can be
        restored, and is purged from there after 30 days.
      operationId: trash
      tags:
      - Triage
      parameters:
      - name: id
        in: path
        required: true
        description: The report's id
        schema:
          type: string
          format: uuid
      security:
      - session: []
        csrf: []
      responses:
        "204":
          description: Moved into the trash
        "401":
          description: "No live session: signed out, or the session lapsed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: "A cross-site request: no `X-Baylee-CSRF: 1`, an `Origin` that is not this host, or `Sec-Fetch-Site` other than `same-origin`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: No such report, or it is in the trash already
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: The database is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
