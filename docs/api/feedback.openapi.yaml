            application/json:
              schema:
                $ref: "#/components/schemas/Created"
        "400":
          description: "Not a report: malformed JSON, an unknown field or `kind`, a `chat` report, no text (but for a crash), `client` not an object, a malformed `device` or `build`, or a record that is not base64 or not a game record"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "413":
          description: |-
            - The text is over 20000 characters, `client` over 1 MiB, or the record over 4 MiB (32 MiB unpacked)
            - The text, `client` or the record is over its bound (an `ErrorBody`), or the whole body is over the route's limit, which is refused in plain text before anything else is checked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
            text/plain:
              schema:
                type: string
        "429":
          description: Too many reports from this address or from everyone in the last hour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: >-
            Direct reports are not taken here (`FEEDBACK_DIRECT_KEY` is unset), or the
            database is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /site/impressum:
    options:
      summary: A browser's preflight for the Impressum
      description: |-
        The contact form's preflight: yes only to an `Origin` in
        `FEEDBACK_CONTACT_ORIGINS`, for a page tried on another origin than the
        site's own.
      operationId: preflightImpressum
      tags:
      - Site
      parameters:
      - name: Origin
        in: header
        required: true
        description: The page's origin
        schema:
          type: string
      security: []
      responses:
        "204":
          description: Allowed
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
              description: The asking origin
        "403":
          description: The `Origin` is missing or not a configured one
    post:
      summary: The Impressum for a solved puzzle
      description: |-
        Answers the Impressum's blob for a solved challenge, once,
        before it expires; the page decodes it. Headers as for the challenge.
      operationId: postImpressum
      tags:
      - Site
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Solution"
        required: true
      responses:
        "200":
          description: The blob, `text/plain; charset=us-ascii`
          content:
            text/plain:
              schema:
                type: string
        "400":
          description: "Not a solution: malformed, over 4 KiB, the wrong number of counters, or a counter that does not solve its part"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: >-
            From another site (as for the challenge), or a challenge this service did not
            sign or one changed since
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: That challenge was answered already
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "410":
          description: The challenge expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: No Impressum here (not configured), or its blob file is gone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /site/impressum/challenge:
    get:
      summary: A puzzle for the Impressum
      description: |-
        A signed proof-of-work puzzle, valid 5 minutes. A request
        is never refused one for how it looks: a suspicious one only gets up to
        4 more bits, each doubling the work. Every
        answer says `Cache-Control: no-store`, `X-Robots-Tag: noindex, noarchive,
        nosnippet` and `Vary: Origin`, and names a configured origin in
        `Access-Control-Allow-Origin`. Off until `FEEDBACK_IMPRESSUM_KEY` and
        `FEEDBACK_IMPRESSUM_BLOB` are set.
      operationId: getImpressumChallenge
      tags:
      - Site
      parameters:
      - name: s
        in: query
        required: false
        description: "What the page saw of its browser, as bits: 1 `navigator.webdriver`, 2 no `navigator.languages`, 4 a software WebGL renderer"
        schema:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
      security: []
      responses:
        "200":
          description: The puzzle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Challenge"
        "403":
          description: "From another site: marked `Sec-Fetch-Site: same-site` or `cross-site` without a configured `Origin`, or carrying an `Origin` that is not one of `FEEDBACK_CONTACT_ORIGINS` without being marked `same-origin`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: No Impressum here (it is not configured)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /site/impressum/kontakt:
    get:
      summary: The Impressum's honeypot
      description: |-
        A link on the Impressum page no person sees. It answers an
        invented Impressum, and the asking address gets the decoy and the
        hardest puzzle for 24 hours.
      operationId: impressumHoneypot
      tags:
      - Site
      security: []
      responses:
        "200":
          description: An invented Impressum
          content:
            text/html:
              schema:
                type: string
          headers:
            X-Robots-Tag:
              schema:
                type: string
              description: "`noindex, noarchive, nosnippet`"
  /health:
    get:
      summary: Whether the service answers
      description: |-
        Always `200` while the process runs, with its build and
        where its source is. It asks nothing of the database.
      operationId: health
      tags:
      - Service
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /intake/reports:
    post:
      summary: Take a report a gateway passes on
      description: |-
        A gateway passes on what one of its players reported. The
        report is filed under the name the intake token is configured with. A
        record a client wrote (`record_origin: client`) is held to a client's
        bounds and checked for the shape of a game record first.
      operationId: intake
      tags:
      - Intake
      security:
      - gatewayToken: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Intake"
        required: true
      responses:
        "201":
          description: Taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Created"
        "400":
          description: "Not a report: malformed JSON, an unknown `kind`, `client` not an object, a malformed field, a record that is not base64, or a client's record that is not a game record"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Not a gateway's intake token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "413":
          description: |-
            - The text is over 20000 characters, `client` over 2 MiB, or the record over its bound
            - The text, `client` or the record is over its bound (an `ErrorBody`), or the whole body is over the route's limit, which is refused in plain text before it is read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
            text/plain:
              schema:
                type: string
        "503":
          description: The database is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /reports:
    get:
      summary: List reports
      description: |-
        The reports the filter matches, newest first unless `sort`
        says otherwise, one page at a time, and how many match in all. The
        trash is swept first and listed only under `trash=true`. Over the
        tokens `seen` is always `false`.
      operationId: listReports
      tags:
      - Reports
      parameters:
      - name: status
        in: query
        required: false
        description: "Statuses, comma-separated: `new`, `triaged`, `in_progress`, `resolved`, `wont_fix`, `duplicate`."
        schema:
          type: string
      - name: kind
        in: query
        required: false
        description: "Kinds, comma-separated: `bug`, `improvement`, `feedback`, `crash`, `other`, `chat`."
        schema:
          type: string
      - name: gateway
        in: query
        required: false
        description: The gateway's name the reports are filed under (`(direct)` for direct reports).
        schema:
          type: string
      - name: reporter
        in: query
        required: false
        description: One reporter's pseudonym.
        schema:
          type: string
      - name: game_id
        in: query
        required: false
        description: One game's id.
        schema:
          type: string
      - name: q
        in: query
        required: false
        description: >-
          Words of the text or of a crash's message, a piece of the text (`%` and `_`
          literal), or a piece of a report's id (six hex digits or more); at most 200
          characters.
        schema:
          type: string
      - name: from
        in: query
        required: false
        description: The first day, `YYYY-MM-DD` in UTC, inclusive.
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: false
        description: The last day, `YYYY-MM-DD` in UTC, inclusive.
        schema:
          type: string
          format: date
      - name: has_record
        in: query
        required: false
        description: Only reports with a record (`true`) or without one (`false`).
        schema:
          type: boolean
      - name: channel
        in: query
        required: false
        description: "How the reports came: `gateway` or `direct`."
        schema:
          type: string
          enum:
          - gateway
          - direct
      - name: source
        in: query
        required: false
        description: "What sent the reports, as the client's `source` says (`llm-seat` for a language-model seat): a source, `none` for reports without one, or either after `!` for all the others. 1–64 characters, no control character."
        schema:
          type: string
      - name: assignee
        in: query
        required: false
        description: An admin's name, or `none` for reports nobody looks after.
        schema:
          type: string
      - name: label
        in: query
        required: false
        description: "One label: lowercase letters, digits and dashes, 1–32."
        schema:
          type: string
      - name: priority
        in: query
        required: false
        description: "Priorities, comma-separated: `critical`, `high`, `normal`, `low`, or `none` for a report without one."
        schema:
          type: string
      - name: signature
        in: query
        required: false
        description: "One crash signature: 16 hex digits."
        schema:
          type: string
      - name: duplicate_of
        in: query
        required: false
        description: The duplicates of this report (its id).
        schema:
          type: string
          format: uuid
      - name: trash
        in: query
        required: false
        description: The trash instead of the reports.
        schema:
          type: boolean
      - name: unseen
        in: query
        required: false
        description: >-
          Only what the signed-in admin has not opened yet (the web UI's routes only; the
          token routes have no admin).
        schema:
          type: boolean
      - name: sort
        in: query
        required: false
        description: "What the list is sorted by: `received` (the default), `changed`, `priority`, `status`, `kind`, `reporter` or `gateway`."
        schema:
          type: string
          enum:
          - received
          - changed
          - priority
          - status
          - kind
          - reporter
          - gateway
      - name: dir
        in: query
        required: false
        description: "`desc` (the default) or `asc`."
        schema:
          type: string
          enum:
          - desc
          - asc
      - name: limit
        in: query
        required: false
        description: "How many reports a page holds: 50 by default; a value below 1 or above 200 is taken as 1 or 200."
        schema:
          type: integer
          format: int64
          minimum: 0
          default: 50
      - name: offset
        in: query
        required: false
        description: How many reports of the list to skip.
        schema:
          type: integer
          format: int64
          minimum: 0
      security:
      - readToken: []
      - adminToken: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "400":
          description: A filter is malformed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Neither the read token nor the admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: The database is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  "/reports/{id}":
    get:
      summary: One report
      description: |-
        One report, with its `client` object; no notes. A report
        in the trash is answered too.
      operationId: getReport
      tags:
      - Reports
      parameters:
      - name: id
        in: path
        required: true
        description: The report's id
        schema:
          type: string
          format: uuid
      security:
      - readToken: []
      - adminToken: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Detail"
        "401":
          description: Neither the read token nor the admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: No such report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: The database is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    patch:
      summary: Change a report's status
      description: |-
        Sets a report's status and answers the report as it is
        now. A report in the trash is not changed (`404`). The change is
        written to the audit under the actor `token`.
      operationId: setReportStatus
      tags:
      - Reports
      parameters:
      - name: id
        in: path
        required: true
        description: The report's id
        schema:
          type: string
          format: uuid
      security:
      - adminToken: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusChange"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Detail"
        "400":
          description: Not a status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Not the admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: No such report, or it is in the trash
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: The database is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    delete:
      summary: Delete a report for good
      description: |-
        Deletes a report and its record, wherever it is, the trash
        included; the UI's delete only moves it into the trash. The deletion is
        written to the audit under the actor `token`.
      operationId: deleteReport
      tags:
      - Reports
      parameters:
      - name: id
        in: path
        required: true
        description: The report's id
        schema:
          type: string
          format: uuid
      security:
      - adminToken: []
      responses:
        "204":
          description: Deleted
        "401":
          description: Not the admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: No such report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: The database is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  "/reports/{id}/record":
    get:
      summary: A report's game record
      description: |-
        The record attached to a report, as stored: gzip of JSON
        Lines (`zcat` reads it), a download named `<id>.jsonl.gz`. Its writer is
        in `X-Record-Origin`; a client's is unverified.
      operationId: getReportRecord
      tags:
      - Reports
      parameters:
      - name: id
        in: path
        required: true
        description: The report's id
        schema:
          type: string
          format: uuid
      security:
      - readToken: []
      - adminToken: []
      responses:
        "200":
          description: The record
          content:
            application/gzip:
              schema:
                type: string
                format: binary
          headers:
            X-Record-Origin:
              schema:
                type: string
              description: "Who wrote the record: `gateway`, or `client` (unverified)"
            Content-Disposition:
              schema:
                type: string
              description: An attachment named `<id>.jsonl.gz`
        "401":
          description: Neither the read token nor the admin token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: No such report, or it has no record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: The database is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  "/ui/api/admin/accounts/{id}/ban":
    put:
      summary: Ban an account
      description: |-
        The gateway's `PUT /admin/accounts/{id}/ban`, passed on
        with its status. A ban made is an audit row with the account and the
        ban's end, never the reason.
      operationId: ban
      tags:
      - Moderation
      parameters:
      - name: id
        in: path
        required: true
        description: The account's id
        schema:
          type: string
          format: uuid
      security:
      - session: []
        csrf: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BanOrder"
        required: true
      responses:
        "200":
          description: "Banned, as the gateway answers: the account's `ban` with its end"
          content:
            application/json:
              schema: {}
        "400":
          description: >-
            Not an account's id, not a ban, or the gateway's own refusal of its reason or
            end
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: "No live session: signed out, or the session lapsed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: "A cross-site request: no `X-Baylee-CSRF: 1`, an `Origin` that is not this host, or `Sec-Fetch-Site` other than `same-origin`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: |-
            - No gateway console is configured for this service (`FEEDBACK_GATEWAY_ADMIN_URL`)
            - No gateway console is configured, or the gateway has no such account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "502":
          description: >-
            The gateway refused this service's console token, did not answer within 10
            seconds, or answered with a status or body this service does not pass on
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: >-
            The database is unavailable, the gateway's console is shut after too many wrong
            tokens, or the gateway's own `503`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
    delete:
      summary: Lift an account's ban
      description: |-
        The gateway's `DELETE /admin/accounts/{id}/ban`, passed on
        with its status; a ban lifted is an audit row.
      operationId: unban
      tags:
      - Moderation
      parameters:
      - name: id
        in: path
        required: true
        description: The account's id
        schema:
          type: string
          format: uuid
      security:
      - session: []
        csrf: []
      responses:
        "204":
          description: Lifted
        "400":
          description: Not an account's id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: "No live session: signed out, or the session lapsed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: "A cross-site request: no `X-Baylee-CSRF: 1`, an `Origin` that is not this host, or `Sec-Fetch-Site` other than `same-origin`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: |-
            - No gateway console is configured for this service (`FEEDBACK_GATEWAY_ADMIN_URL`)
            - No gateway console is configured, or the gateway has no such account or no ban on it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "502":
          description: >-
            The gateway refused this service's console token, did not answer within 10
            seconds, or answered with a status or body this service does not pass on
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: >-
            The database is unavailable, the gateway's console is shut after too many wrong
            tokens, or the gateway's own `503`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  "/ui/api/admin/games/{id}/close":
    post:
      summary: End a running game
      description: |-
        The gateway's `POST /admin/games/{id}/close`, passed on
        with its status: the gateway ends the game through its engine. A game
        ended is an audit row, never with its reason.
      operationId: close_game
      tags:
      - Moderation
      parameters:
      - name: id
        in: path
        required: true
        description: The game's id
        schema:
          type: string
          format: uuid
      security:
      - session: []
        csrf: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloseOrder"
        required: true
      responses:
        "202":
          description: Asked; the engine ends the game
        "400":
          description: Not a game's id, not a reason, or the gateway's own refusal of it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: "No live session: signed out, or the session lapsed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: "A cross-site request: no `X-Baylee-CSRF: 1`, an `Origin` that is not this host, or `Sec-Fetch-Site` other than `same-origin`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "404":
          description: |-
            - No gateway console is configured for this service (`FEEDBACK_GATEWAY_ADMIN_URL`)
            - No gateway console is configured, or the gateway has no such table
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "409":
          description: That table is not being played (the gateway's)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "502":
          description: >-
            The gateway refused this service's console token, did not answer within 10
            seconds, or answered with a status or body this service does not pass on
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: >-
            The database is unavailable, the gateway's console is shut after too many wrong
            tokens, or the gateway's own `503`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /ui/api/login:
    post:
      summary: Sign in to the web UI
      description: |-
        Signs an admin in and sets the session cookie. A wrong
        password and an unknown name get the same `401`. Past 10 failed
        sign-ins from one address or 5 for one name in 15 minutes, every
        sign-in is `429`, the right password included.
      operationId: login
      tags:
      - Sessions
      security:
      - csrf: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
        required: true
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
          headers:
            Set-Cookie:
              schema:
                type: string
              description: "The session: `__Host-baylee-feedback=<token>; HttpOnly; Secure; SameSite=Strict; Path=/; Max-Age=604800`"
        "400":
          description: Not a sign-in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "401":
          description: Wrong name or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: "A cross-site request: no `X-Baylee-CSRF: 1`, an `Origin` that is not this host, or `Sec-Fetch-Site` other than `same-origin`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "429":
          description: Too many failed sign-ins; try again later
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
          headers:
            Retry-After:
              schema:
                type: integer
                format: int64
                minimum: 0
                maximum: 4294967295
              description: "Seconds to wait: 900"
        "503":
          description: The database is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /ui/api/logout:
    post:
      summary: Sign out of the web UI
      description: |-
        Ends the session in the database and clears the cookie. A
        request without a live session is `401` and clears the cookie too.
      operationId: logout
      tags:
      - Sessions
      security:
      - session: []
        csrf: []
      responses:
        "204":
          description: Signed out
          headers:
            Set-Cookie:
              schema:
                type: string
              description: The cleared session cookie (`Max-Age=0`)
        "401":
          description: "No live session: signed out, or the session lapsed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "403":
          description: "A cross-site request: no `X-Baylee-CSRF: 1`, an `Origin` that is not this host, or `Sec-Fetch-Site` other than `same-origin`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
        "503":
          description: The database is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /ui/api/me:
