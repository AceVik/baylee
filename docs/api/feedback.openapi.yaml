  /ui/api/admin/accounts:
    get:
      summary: Search the gateway's accounts
      description: >-
        The gateway's `GET /admin/accounts`, passed on with its status. The query is
        read into its seven fields and written out again.
      operationId: accounts
      tags:
      - Console
      parameters:
      - name: q
        in: query
        required: false
        description: What to search for in names.
        schema:
          type: string
      - name: tag
        in: query
        required: false
        description: "One exact tag: a reported chat message's sender (`client.chat.sender_tag`)."
        schema:
          type: string
      - name: kind
        in: query
        required: false
        description: "`all`, `registered` or `guest`."
        schema:
          type: string
      - name: sort
        in: query
        required: false
        description: The order, as the gateway takes it.
        schema:
          type: string
      - name: online
        in: query
        required: false
        description: Only accounts online now (`true`).
        schema:
          type: boolean
      - name: offset
        in: query
        required: false
        description: How many accounts to skip.
        schema:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
      - name: limit
        in: query
        required: false
        description: How many accounts a page holds.
        schema:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
