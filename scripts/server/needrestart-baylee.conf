# Installed as /etc/needrestart/conf.d/baylee.conf. needrestart must not
# restart what carries running games after a library update: the gateway
# (every seat and engine link), the agent, Docker (the database) and Caddy
# (every seat socket). Their new libraries take effect at the next reboot,
# which baylee-reboot times.
$nrconf{override_rc}{qr(^baylee-)} = 0;
$nrconf{override_rc}{qr(^docker)} = 0;
$nrconf{override_rc}{qr(^containerd)} = 0;
$nrconf{override_rc}{qr(^caddy)} = 0;
