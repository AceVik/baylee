# fail2ban filter: an address that asked the Impressum's honeypot
# (scripts/server/impressum-honeypot.caddy writes the log). Install as
# /etc/fail2ban/filter.d/baylee-impressum-honeypot.conf; the jail is
# baylee-impressum-honeypot.local beside this file. Check it against a log:
#
#   fail2ban-regex /var/log/caddy/baylee-impressum-honeypot.log \
#       /etc/fail2ban/filter.d/baylee-impressum-honeypot.conf
#
# Caddy writes one JSON object per line; `client_ip` is the visitor's
# address (Caddy's own view, or a trusted proxy's when one is configured).

[Definition]
failregex = "client_ip":"<HOST>".*"uri":"/site/impressum/kontakt
ignoreregex =
datepattern = "ts":{EPOCH}
